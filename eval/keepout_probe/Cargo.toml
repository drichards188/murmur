[package]
name = "murmur-keepout-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Evaluation only (eval/keepout.py): generated engagement situations through murmur-decide's own nomination checks, and the bridge's own tracker by path, read-only"

# A workspace member (the root Cargo.toml lists it) so `make check`'s clippy and tests cover
# it and its lock is the engine's and the bridge's. eval/keepout.py builds it on demand:
# `cargo build --release -p murmur-keepout-probe`.

[dependencies]
murmur-decide = { path = "../../crates/murmur-decide" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# the bridge's sensing model reads the catalog's sensors from sim/platforms.toml
toml = "1"
# the bridge's physical sensing model reads terrain grids (gzip), compiled here with it
flate2 = "1"

[lints]
workspace = true
