# The minimal-approval evaluation profile (rules 9; user direction 2026-10-05: the system
# decides where the evidence is clear and flags for human review where it is unsure; the
# evaluation shows what really needs a person). sim/policy.toml with these differences only
# (a supplement: it extends the shipped policy and sets only what it changes; the decision
# layer merges it, crates/murmur-decide/src/policy.rs), which eval/tests/test_harness.py checks:
#   - [identification] nominate_unconfirmed = true: a track the engine declared hostile by
#     rule (an observed hostile act attributed above the threshold, nothing conflicting) may
#     be nominated before an operator confirms the declaration (it stays a review item);
#   - [approval] step_up_acts = []: no step-up besides the ones the rules always need (every
#     engagement signature re-enters the signer's password in a credentials run).
# Rule declaration is on, as in the shipped policy; agents' routine proposals are approved by
# the shipped tiers (routine tasks inside the approved area: auto). What never changes: an
# effect is released only on two signatures by distinct operators with engagement authority,
# neither the proposer and never an agent, on one frozen plan; accepting a lost friendly is
# an engagement-authority operator's act; agents can't declare, confirm, revoke, sign, stop
# or release.

extends = "../../sim/policy.toml"

[approval]
step_up_acts = []                           # minimal: no step-up besides engagement signatures

[identification]
nominate_unconfirmed = true                 # minimal: a rule declaration may be nominated at once
