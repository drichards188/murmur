# ---------------------------------------------------------------- goes silent (stale-track)
[[contact]]
id = "dark-boat-baker"
name = "Dark boat holding in the Gate west of Fort Point, gone from the picture after 75 s"
affiliation = "hostile"
domain = "surface"
kind = "small_fast_boat"
motion = "station"
# in open water with a line of sight to the Crissy Field ground station (off Baker Beach
# itself the bluffs mask an aircraft orbiting there, and its link goes stale)
at = [-122.4900, 37.8120]
end_s = 75
