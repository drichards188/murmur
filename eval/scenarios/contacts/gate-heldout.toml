# Same area and fleet as eval/scenarios/contacts/gate.toml, different situations. Points
# are [lon, lat]; identities are fictional; everything here is truth, which only the
# evaluation reads.
title = "Evaluation: Golden Gate, held-out situations"
seed = 23

[sensing]
