[workspace]
resolver = "3"
members = ["crates/*", "eval/keepout_probe"]

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"
# `murmur_headless` is set only by crates/murmur-headless's build script, which compiles the
# bridge's files by path (docs/HEADLESS.md): the bridge's own build never has it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(murmur_headless)'] }

[workspace.lints.clippy]
unwrap_used = "warn"

# Password hashing is deliberately slow; unoptimized it is slower still, and the bridge's
# and the auth crate's tests hash many passwords.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
