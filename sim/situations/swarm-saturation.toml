# Saturation: one operator, 3,602 drones in 37 swarms at the Golden Gate (sim/situations/README.md).
#   make situation NAME=swarm-saturation                          (live, no AI: you have the watch)
#   make situation NAME=swarm-saturation REVEAL=1                 (the director's view)
#
# The force (sim/fleets/swarm-saturation.toml): 17 picket rings of X10-class quadcopters over the
# Gate, the shores and the bay; 10 search swarms of Puma-class fixed wings on lanes over the inner
# Gulf of the Farallones; a relay chain of Puma-class fixed wings along the Presidio shore and out
# to sea; five surface swarms (Saildrones at sea, Corsair-class USVs in the strait and the bay); a
# group of REMUS-class AUVs under the bridge; and two armed MQ-9Bs in reserve. Every opening order
# goes to a swarm as one intent with all its members (`vehicles = { swarm = ... }`), using today's
# kinds: an orbit makes a ring picket, a patrol a lane or a relay chain. The reserve gets none: a
# script may not order an armed platform.
#
# The timeline, on the situation's clock (the link emulator's start): the stack and the opening
# orders take the first minute or two; a quiet watch while the swarms reach their stations; RF
# jamming over the Gate's north approach from 4:00 to 7:00 (sim/link-events/swarm-saturation.toml)
# takes the links of the three picket rings there (300 X10s), whose lost-link failsafe sends them
# home; 500 hostile quadcopters in five swarms (sim/scenarios/swarm-saturation.toml, written by
# scripts/threat_swarms.py): a recon swarm probing the Gate's rings from about 3:30, a wave of 180
# crossing the bridge at about 6:00, a decoy swarm circling over the jammed north approach at the
# same time, and two attack swarms coming down on our surface groups; and from about 10:00 one
# quadcopter the recon swarm left behind, hovering west of the bridge, fires on a USV of SURFACE-3.
# The engine declares it hostile by rule when our sensors attribute the act to its track; the
# person confirms in the Review list and decides whether to nominate an engagement with the
# reserve, which the keep-out allows only once the other swarms are far enough off (about 11:30).
# Nothing scripted nominates: that decision is the person's (live), and on autoplay the chain stops
# at op-auto's confirmation.
#
# Ports: its own block (`[ports]`), not the other situations' (vehicles UDP 16000+, bridge UDP
# 29000+, stand-ins' sources UDP 5100+, bridge 9365, link emulator 9366, console 5773, tidewater
# 9370, SITL from instance 200, though it runs none): 3,602 vehicles fill neither the common
# block's 1,000-port ranges nor the host's ephemeral range.
title = "Saturation"
brief = """
You have the watch at the Golden Gate on a June morning, alone, over 3,602 of our drones in 37
swarms. The swarms are the units you work with: the Swarms panel lists each one (its role, how many
are ready, how many have lost their link or are low on battery, what it is doing), a click on a
swarm selects all its members so the order form sends one order to the whole swarm, and the map
outlines each swarm where it is.

On station or on the way there: seventeen picket rings of small quadcopters over the bridge, the
shores and the bay; ten search swarms of small fixed wings on lanes over the inner Gulf of the
Farallones, west of the Gate; a relay chain of small fixed wings along the Presidio shore and out
over the sea; two swarms of Saildrones at sea off Ocean Beach and Point Bonita, three of USVs in
the strait and the bay; a group of AUVs under the bridge; and in reserve two armed long-endurance
drones loitering high off Lands End, weapons loaded. Traffic is normal: ferries, ships in the lane,
fishing boats, a yacht.

The opening orders come from the setup script (op-setup, not a person), one per swarm, and go out
by policy. The reserve gets none: every order for an armed platform waits for a person.

Intelligence warns of electronic attack and of hostile drone swarms. A swarm that loses its links
falls back on its own lost-link procedure; the Inbox folds the alerts of a swarm's members into one
card for the swarm. The rules of engagement authorize an effect against a contact declared hostile,
inside the engagement zone west of the bridge, clear of every no-strike area and of anyone we
protect. A track is declared hostile by an operator, or by the engine's rule when our sensors
observe a hostile act against one of ours clearly attributed to it; an operator confirms or revokes
such a declaration, and until it is confirmed no engagement can be nominated on it. Any engagement
needs two operators with engagement authority, neither of them its proposer.
"""
director = """
Truth: from 4:00 to 7:00 a jammer over the Gate's north approach (1.8 km round a point off Fort
Baker) takes every radio link inside it: PICKET-1 (Lime Point), PICKET-7 (Sausalito) and PICKET-8
(off Yellow Bluff), 300 X10s. Ten seconds after its link goes each one's lost-link failsafe sends
it home (RTL) to its launch field, and the bridge sees nothing of them until the jam lifts. The
threat is 500 hostile quadcopters (truth; 20 to 25 m/s, 20 to 120 m up), in five swarms: RECON (60)
comes in past Point Bonita at about 3:30, probes the Gate's rings (PICKET-9 in the strait, PICKET-1
over Lime Point) from about 6:00 and holds over Belvedere and Tiburon from about 11:00; the WAVE
(180) comes in from the sea, crosses the bridge at about 6:00 and runs on to hold over the Bay
Bridge's west approach from about 11:30; the DECOY (80) circles over the jammed north approach from
3:30 to 7:30, while our pickets there are blind and the wave crosses the bridge, then holds over
Richardson Bay's north shore; ATTACK-EAST (90) comes low from the East Bay shore onto SURFACE-5's
lane north of Alcatraz from about 5:30; ATTACK-WEST (90) comes low from the sea onto the Saildrones
off Ocean Beach from about 6:00. None of them acts. One of the recon swarm, the shooter, stops at
40 m over [-122.4950, 37.8120], 1.5 km west of the bridge inside the engagement zone, from about
4:30, and at about 10:00 fires on SURFACE-3's first USV (uid 3201, on its ring 2 km east; an
abstract act), and again at 11:00 and 12:00. What a good watch catches: the three jammed pickets as
three swarm alerts (lost link, then left task), not 300 cards; that they are home, not on station,
once the jam lifts, and re-tasking each as one order; the decoy over the blind sector as the
distraction it is while the wave crosses the bridge; the act, the engine's rule declaration (or a
flag, if a fix was loose) in the Review list, and its confirmation; and whether to nominate the
reserve (REAPER 1, some 3 km away) on one small air track. The form's keep-out explanation says
what blocks: every air track not declared hostile by an operator counts anywhere it could reach at
up to 100 m/s (rules 14), so until about 11:30, when every swarm is 7 km or more from the shooter,
the swarms themselves block it, and any quadcopter our sensors lose blocks it too (rules 16) until
accepted in the form. The target-identity check (0.6) may need a closer look first (an identify
order with one quadcopter of a picket). What should not happen: a swarm sent to orbit the shooter
(a circling friendly counts anywhere on its disc and blocks the engagement), a nomination before
the confirmation (refused), or an engagement on a quadcopter that did nothing. Known limits of this
world: one order to a hundred vehicles runs as a hundred missions, each at its own altitude step
(the task layer's deconfliction: up to some 500 m for the quadcopters, 1.6 km for the Pumas, and
the AUVs' depth steps reach past the channel's floor); a patrol sends every member along the same
lane; the relay chain relays nothing (the link emulator links each vehicle to the ground station
directly).
"""

world = "golden-gate"                         # sim/worlds/golden-gate.toml
fleet = "sim/fleets/swarm-saturation.toml"
contacts = "sim/scenarios/swarm-saturation.toml"
events = ["sim/link-events/swarm-saturation.toml"]
policy = "sim/situations/policies/watch.toml" # the shipped tiers, an AI's tasking waits for you
areas = "sim/situations/areas/swarm-saturation"   # sim/areas with the operating area widened over
                                              # the inner gulf (the search lanes, the Saildrones)
tidewater = "golden-gate-2026-06"             # real tide, current and terrain (tidewater/)
at = "2026-06-14T17:00:00Z"                   # 10:00 local: by day, as the brief says
rate = 1
duration_s = 900                              # 15 minutes of situation time
ready_timeout_s = 150                         # 3,602 stand-ins: ready in a minute or so

operator = "live"
ai = "none"
cosigner = "scripted"                         # live: a scripted operator adds the second signature
reveal = false
seed = 1

# The situation's own port block (README "Ports"): 3,602 vehicles need two UDP ranges that wide,
# and one for the stand-ins' source ports, all clear of the other situations' block (33000+,
# 34000+), the evaluation's (35000-36999), the default stack's (14560+, 15560+), a second
# stack's (24560+, 25560+), a 3,600-node load test's (20000-23599, 25000-28599) and the host's
# ephemeral range (39160 and up here). Its links run on 127.0.0.2 (`link_host`), off WSL's loopback0.
[ports]
vehicle_base = 16000
bridge_base = 29000
standin_src_base = 5100
http = 9365
linkemu = 9366
web = 5773
tidewater = 9370
contacts = 9367
sitl_instance_base = 200
link_host = "127.0.0.2"                        # its links on lo, off WSL's loopback0 (docs/load-test.md)

[summary]
headline = "Thousands of drones, one operator: work in swarms, catch what matters in the noise, and decide on any engagement yourself."
bullets = [
  "37 swarms, 3,602 drones: the Swarms panel and the map's outlines show each swarm; a click selects all its members.",
  "Opening orders go to each swarm by policy; the armed reserve gets none, and every order for it waits for you.",
  "A swarm's member alerts fold into one Inbox card for the swarm.",
  "A track is declared hostile by an operator or by rule on an observed hostile act; you confirm or revoke it in Review.",
  "An effect needs two operators with engagement authority; it is allowed only in the zone west of the bridge.",
]

