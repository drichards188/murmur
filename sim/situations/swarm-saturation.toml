# ---- the scripted operator on autoplay (eval/proxy.py): it confirms the engine's rule
# declarations, read first; nothing in this situation nominates, so on autoplay the chain stops
# there. No [playbook]: its plays look with one free sensor at a time, and here every sensor is
# already tasked in a swarm.
[autoplay]
preset = "default"
confirm_rule_declarations = true
