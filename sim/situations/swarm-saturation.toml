# Saturation: one operator, 3,602 drones in 37 swarms over the region from Bodega Bay to Monterey
# Bay (sim/situations/README.md; bd murmur-mum5).
#   make situation NAME=swarm-saturation                          (live, no AI: you have the watch)
#   make situation NAME=swarm-saturation REVEAL=1                 (the director's view)
#   make situation NAME=swarm-saturation-packed                   (the same load packed at the Gate,
#                                                                  kept for performance work)
#
# The force (sim/fleets/swarm-saturation-bay-region.toml), the same 37 swarms as the packed layout
# laid out as a planner covering the region would: 17 picket rings of X10-class quadcopters round
# the harbors and landmarks a drone attack would go for (Bodega Harbor; seven in San Francisco Bay;
# three at Half Moon Bay; Santa Cruz; Moss Landing; Monterey); 10 search swarms of Puma-class fixed
# wings on lanes over the sea from Bodega Head to Point Pinos; a relay chain of Pumas from Point
# Reyes to the Farallones; Saildrones mid-gulf and on Cordell Bank; Corsair-class USVs on the San
# Francisco Bar, in the central bay and across Monterey Bay; REMUS-class AUVs over the Monterey
# Canyon head; and two armed MQ-9Bs in reserve over the gulf. Each group's radio reaches one of
# thirteen ground stations (its own links file, `links`: each radio link through whichever station
# hears it best; scripts/layout_reach.py checks every group's way against them). Every opening
# order goes to a swarm as one intent with all its members (`vehicles = { swarm = ... }`), using
# today's kinds: an orbit makes a ring picket, a patrol a lane or the relay chain. The reserve gets
# none: a script may not order an armed platform.
#
# The timeline, on the situation's clock (the link emulator's start), worked out from the contacts'
# own motion (crates/murmur-contacts run on this file at 4x in one-second steps, each kind
# reaching its speed and slowing onto its hold at its own rate; the contacts' clock starts a few
# seconds after the situation's): the stack and the opening orders take the first minute or two;
# RF jamming over the coast approach at Half Moon Bay from 4:00 to 7:00
# (sim/link-events/swarm-saturation-bay-region.toml) takes the links of the three picket rings
# there (300 X10s), whose lost-link failsafe sends them home; 500 hostile drones in five swarms
# (sim/scenarios/swarm-saturation-bay-region.toml, written by scripts/threat_swarms.py; each armed
# as its kind is, sim/contacts.toml): a recon swarm of quadcopters probing the Golden Gate's rings
# from about 3:30, a wave of 180 crossing the bridge at about 6:00, a decoy swarm circling over the
# jammed approach at Half Moon Bay, 35 km south, at the same time, and two swarms of one-way attack
# drones coming down on our USVs in the central bay and our Saildrones mid-gulf and holding there
# (no order sends them in); and from about 10:00 an armed drone that flew in with the recon swarm,
# hovering over the bar, fires a light missile at a USV of SURFACE-3 by its own fire control, its
# second a minute later, then turns for home (docs/AUTONOMOUS-NODES.md; the contacts file orders
# it, bd murmur-y85j.6). Each strike is drawn: the USV can be stopped or sunk. The engine declares
# it hostile by rule when our sensors attribute the act to its track; the person confirms in the
# Review list and decides whether to nominate an engagement with the reserve. Nothing scripted
# nominates: that decision is the person's (live), and on autoplay the chain stops at op-auto's
# confirmation.
#
# Ports: its own block (`[ports]`), the packed layout's, not the other situations' (vehicles UDP
# 16000+, bridge UDP 29000+, stand-ins' sources UDP 5100+, bridge 9365, link emulator 9366, console
# 5773, tidewater 9370, SITL from instance 200, though it runs none): 3,602 vehicles fill neither
# the common block's 1,000-port ranges nor the host's ephemeral range.
title = "Saturation"
brief = """
You have the watch over the San Francisco Bay region on a June morning, alone, over 3,602 of our
drones in 37 swarms spread from Bodega Bay to Monterey Bay. The swarms are the units you work with:
the Swarms panel lists each one (its role, how many are ready, how many have lost their link or
are low on battery, what it is doing), a click on a swarm selects all its members so the order
form sends one order to the whole swarm, and the map outlines each swarm where it is.

On station or on the way there: seventeen picket rings of small quadcopters over the harbors and
landmarks a drone attack would go for (Bodega Harbor; the Golden Gate, the city front, the Bay
Bridge, the Port of Oakland, Coast Guard Island and Richardson Bay in the bay; Half Moon Bay;
Santa Cruz; the Moss Landing power plant and harbor; Monterey); ten search swarms of small fixed
wings on lanes over the sea from Bodega Head to Point Pinos, two of them either side of the
Farallones; a relay chain of small fixed wings from Point Reyes to the Farallones; two swarms of
Saildrones far out, on the western traffic lane mid-gulf and on Cordell Bank; three of USVs, on the
San Francisco Bar, in the central bay and across Monterey Bay; a group of AUVs over the Monterey
Canyon head off Moss Landing; and in reserve two armed long-endurance drones loitering high over
the gulf west of the Golden Gate, weapons loaded. Thirteen ground stations along the coast and in the
bay carry the quadcopters' and fixed wings' radios, each link through whichever station hears it
best; the boats and the reserve are on satellite links. Traffic is normal: ferries, ships in the
lanes, fishing boats, a yacht, a whale-watching boat out of Monterey.

The opening orders come from the setup script (op-setup, not a person), one per swarm, and go out
by policy. The reserve gets none: every order for an armed platform waits for a person.

Intelligence warns of electronic attack and of hostile drone swarms. A swarm that loses its links
falls back on its own lost-link procedure; the Inbox folds the alerts of a swarm's members into one
card for the swarm. The rules of engagement authorize an effect against a contact declared hostile,
inside an engagement zone (the Golden Gate's approaches in the inner gulf, the strait west of the
bridge, the open sea west of the Farallones, outer Monterey Bay), clear of every no-strike area and
of anyone we protect. A track is declared hostile by an operator, or by the engine's rule when our
sensors observe a hostile act against one of ours clearly attributed to it; an operator confirms or
revokes such a declaration, and until it is confirmed no engagement can be nominated on it. Any
engagement needs two operators with engagement authority, neither of them its proposer. Any of ours
can be struck, and a strike can stop or sink a vessel.
"""
director = """
Truth: from 4:00 to 7:00 a jammer over the coast approach at Half Moon Bay (5 km round a point over
the airport) takes every radio link inside it: PICKET-9 (Montara and Moss Beach), PICKET-10 (Pillar
Point) and PICKET-11 (the harbor and El Granada), 300 X10s. Ten seconds after its link goes each
one's lost-link failsafe sends it home (RTL) to Half Moon Bay Airport, inside the jam, and the
bridge sees nothing of them until it lifts. The threat is 500 hostile drones (truth; 20 to 25 m/s,
20 to 120 m up), in five swarms, each slowing onto its hold at its kind's rate. RECON (60) appears
over the inner gulf at about 0:35, reaches the ring over the Gate's mouth (PICKET-3) from about 3:25,
crosses the Gate's mouth north of the bridge with the wave at about 6:00, runs through the
Richardson Bay ring (PICKET-2) from about 6:50 and holds over Belvedere and Tiburon from about
11:00. The WAVE (180) appears 7 km west of the bridge, crosses it at about 6:00, runs on through the
strait and city front rings (PICKET-4, -5) and holds over the Bay Bridge's west approach from about
12:15. The DECOY (80) appears off Half Moon Bay, reaches Pillar Point at about 2:30 and circles over
the airport and the three jammed rings until about 8:00, while their links are down and the wave
crosses the Golden Gate 35 km north, then holds over the mouth of Pillar Point Harbor from about
9:15. ATTACK-EAST (90), launched off the Berkeley shore at about 1:00, comes low across the central
bay onto SURFACE-4's ring and holds over its east side from about 5:50; ATTACK-WEST (90) comes low
from the sea to the south-west onto the Saildrones mid-gulf (SURFACE-1) and holds over them from
about 6:10. The two attack swarms are one-way attack drones (an RPG-class warhead each, looking like
quadcopters to our sensors); no order sends them in, so none of the swarms acts. The shooter, an
armed VTOL drone with two light missiles (looking like an unknown UAS) that flew in with the recon
swarm, turns back south off Point Bonita at about 3:15, slows from about 6:20 at its kind's 1.25
m/s² (bd murmur-2of4) and stops 40 m over the San Francisco Bar, inside the engagement zone of the
gulf approaches, at about 6:35, 1.6 km outside SURFACE-3's ring; its contacts file orders it to
attack SURFACE-3's first USV (uid 3201, 1.6 to 5.6 km away wherever it is on its ring) from where
it hovers: it fires a missile at about 10:00 and its second at about 11:00 (each an act, each strike
drawn: the USV can be stopped or sunk), then turns for home along its way in, north past Point
Bonita. What a good watch catches: the three jammed pickets as three swarm alerts (lost link, then
left task), not 300 cards; that they are home at the airport, not on station, once the jam lifts,
and re-tasking each as one order; the decoy over the blind sector at Half Moon Bay as the
distraction it is while the wave crosses the Golden Gate; the attack swarms holding over our USVs
and Saildrones; the act, the engine's rule declaration (or a flag, if a fix was loose) in the
Review list, and its confirmation; and whether to nominate the reserve (REAPER 1, some 5 km away
over the gulf) on one small air track. Every other swarm is 7 km or more from where the shooter
holds from about 6:25, so by the time it fires they no longer block a strike's keep-out (rules 14
counts an air track not declared hostile by an operator anywhere it could reach at up to 100 m/s);
what can still block: any drone our sensors lose (rules 16) until it is accepted in the form, the
inbound container ship coming over the bar through SURFACE-3's ring, and our own USVs. The
target-identity check (0.6) may need a closer look first (an identify order with one quadcopter of
the ring over the Gate's mouth, or one fixed wing of the search lane off the Gate). From rules 24 the
reserve's loadout (AGM-114R, GBU-12) is for surface and ground targets: a nomination on the air
track is refused by the weapon check, whatever the keep-out. What should not happen: a swarm sent
to orbit the shooter (a circling friendly counts anywhere on its disc and blocks the engagement), a
nomination before the confirmation (refused), or an engagement on a drone that did nothing. Known
limits of this world: one order to a hundred vehicles runs as a hundred missions, each at its own
altitude step (the task layer's deconfliction: the quadcopters from 100 m to some 1,000 m, the
Pumas from 300 m to some 1.8 km, and the AUVs' depth steps reach past the shelf's floor where their
ring leaves the canyon); a patrol sends every member along the same lane; the relay chain relays
nothing (the link emulator links each vehicle to its best station directly); the launch fields,
spawns and stations are checked on tidewater's terrain of the region, the live run's own, whose
90 m cells outside the Bay smooth narrow headlands and islands, so the stations on Bodega Head,
Point Reyes and the Farallones take their NGS marks' published heights instead.
"""

world = "bay-region-saturation"               # sim/worlds/bay-region-saturation.toml: the region, so
                                              # nothing headless runs it on the Golden Gate's grids
                                              # (headless needs the region's grids baked first)
fleet = "sim/fleets/swarm-saturation-bay-region.toml"
contacts = "sim/scenarios/swarm-saturation-bay-region.toml"
events = ["sim/link-events/swarm-saturation-bay-region.toml"]
links = "sim/situations/links/swarm-saturation-bay-region.toml"   # its thirteen ground stations
policy = "sim/situations/policies/watch.toml" # the shipped tiers, an AI's tasking waits for you
areas = "sim/situations/areas/swarm-saturation-bay-region"   # the region's (illustrative boxes)
tidewater = "bay-region-2026-06"              # real tide, current and terrain over the region
at = "2026-06-14T17:00:00Z"                   # 10:00 local: by day, as the brief says
rate = 1
duration_s = 900                              # 15 minutes of situation time
ready_timeout_s = 150                         # 3,602 stand-ins: ready in a minute or so

operator = "live"
ai = "none"
cosigner = "scripted"                         # live: a scripted operator adds the second signature
reveal = false
seed = 1

# The situation's own port block (README "Ports"), the packed layout's: 3,602 vehicles need two UDP
# ranges that wide, and one for the stand-ins' source ports, all clear of the other situations'
# block (33000+, 34000+), the evaluation's (35000-36999), the default stack's (14560+, 15560+), a
# second stack's (24560+, 25560+), a 3,600-node load test's (20000-23599, 25000-28599) and the
# host's ephemeral range (39160 and up here). Its links run on 127.0.0.2 (`link_host`), off WSL's
# loopback0.
[ports]
vehicle_base = 16000
bridge_base = 29000
standin_src_base = 5100
http = 9365
linkemu = 9366
web = 5773
tidewater = 9370
contacts = 9367
sitl_instance_base = 200
link_host = "127.0.0.2"                        # its links on lo, off WSL's loopback0 (docs/load-test.md)

[summary]
headline = "Thousands of drones along a 200 km coast, one operator: work in swarms, catch what matters in the noise, and decide on any engagement yourself."
bullets = [
  "37 swarms, 3,602 drones from Bodega Bay to Monterey Bay: the Swarms panel and the map's outlines show each swarm; a click selects all its members.",
  "Opening orders go to each swarm by policy; the armed reserve gets none, and every order for it waits for you.",
  "A swarm's member alerts fold into one Inbox card for the swarm.",
  "A track is declared hostile by an operator or by rule on an observed hostile act; you confirm or revoke it in Review.",
  "An effect needs two operators with engagement authority; it is allowed only inside an engagement zone.",
]

