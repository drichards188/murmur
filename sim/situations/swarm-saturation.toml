text = "When many members of a swarm raise the same alert, the Inbox shows one card for the swarm, with how many of its members and why; open it to see them. A drone that loses its link runs its own lost-link procedure: an X10 after 10 seconds, a Puma after a minute."

[[watch]]
at_s = 250
headline = "Jammer at Half Moon Bay (truth)"
bullets = ["PICKET-9, -10 and -11 lose their links for three minutes", "Their lost-link failsafe sends them home to the airport"]
text = "A jammer over the coast approach at Half Moon Bay takes the links of PICKET-9, -10 and -11 (300 X10s) from 4:00 to 7:00; each one's failsafe sends it home to Half Moon Bay Airport after ten seconds."
director = true

[[watch]]
at_s = 300
headline = "Hundreds of unknowns among thousands of ours"
bullets = ["Tracks: a contact with no transponder is unknown until classified", "Which are new, where are they going, and which group is the distraction?"]
text = "Hundreds of new contacts among thousands of our own, in more than one place along the coast: the Tracks list shows each as our sensors see it; one with no transponder is unknown until a sensor classifies it. Which are new, where is each group going, and which one draws your eye from the others?"

[[watch]]
at_s = 450
headline = "After an outage: where are they now?"
bullets = ["Links back does not mean on station", "Check the swarm's task and where its outline is", "One order re-tasks the whole swarm"]
text = "After an outage, a link that is back does not mean a swarm is back on station: look at the swarm's task in the Swarms panel and at its outline on the map. One order re-tasks the whole swarm."

[[watch]]
at_s = 600
headline = "Hostile act: the engine may declare by rule"
bullets = ["Needs an observed act against one of ours, clearly attributed to one track", "The Review list shows it; you confirm or revoke", "Only then can an engagement be nominated"]
text = "When our sensors observe a hostile act against one of ours, clearly attributed to one track, the engine declares that track hostile by rule; the Review list shows the act, the sensors and the attribution, and you confirm or revoke it. An unsure case is flagged for review, never declared. Nothing can be nominated on a declaration nobody confirmed."

[[watch]]
at_s = 610
headline = "The shooter has fired (truth)"
bullets = ["One armed drone hovering over the bar, a missile at SURFACE-3's first USV", "The swarms are 7 km and more off; a lost track or the weapon check can still block"]
text = "The armed drone that came in with the recon swarm, hovering over the San Francisco Bar, has fired a missile at SURFACE-3's first USV (truth). From here: the act observed, the rule declaration, your confirmation, and your decision whether to nominate the reserve. Every swarm has been 7 km or more off since about 6:25; any drone our sensors lose still counts anywhere until accepted, and the reserve's weapons are for surface and ground targets."
director = true

[[watch]]
at_s = 660
headline = "An engagement is your decision"
bullets = ["The form's dry run: every check, and which vehicle or track blocks a keep-out", "Any aircraft not declared hostile counts anywhere it could fly to by the effect", "Two operators sign; a scripted cosigner adds the second"]
text = "Whether to nominate an engagement with the armed reserve is yours. The nomination form's dry run shows every check, and the keep-out explanation says which of our vehicles or which track blocks and what would clear it: an aircraft not declared hostile counts anywhere it could fly to by the effect, and a contact our sensors lost counts anywhere until you accept it. After your signature a scripted cosigner (op-2) adds the second."

[[watch]]
at_s = 780
headline = "Two minutes left"
bullets = ["The audit log holds every order, alert, act, declaration and signature", "The runner prints the replay command at the end"]
text = "Two minutes left. The audit log holds every order, act, declaration, nomination and signature; the runner prints the replay command at the end."

# ---- the scripted operator on autoplay (eval/proxy.py): it confirms the engine's rule
# declarations, read first; nothing in this situation nominates, so on autoplay the chain stops
# there. No [playbook]: its plays look with one free sensor at a time, and here every sensor is
# already tasked in a swarm.
[autoplay]
preset = "default"
confirm_rule_declarations = true
