# The fault drill: every fault of world v3's H4 once, on a timeline, in the headless simulator
# (docs/HEADLESS.md, "Faults and timelines"). Its smoke test runs it
# (eval/headless/tests/test_world_v3.py); a run:
#   .venv/bin/python -m eval.headless.batch --situation fault-drill --seeds 1-3
# The live runner refuses it: its gnss, battery, reboot, stop and current steps are faults only
# the simulator makes (a live GNSS jammer or spoofer is an events file's gnss table).
title = "Fault drill"
brief = """
You have the watch at the Golden Gate. HUNTER 1 patrols the channel east of the bridge, PUMA 1
waits in reserve west of the bridge, a drifting buoy reports from the strait, and a recon UGV
patrols Crissy Field. Traffic is normal. Expect equipment trouble this morning: keep our vehicles safe and on task, and
judge what the C2 can and cannot tell you about each of them.
"""
director = """
The timeline, all truth: a current sets east through the Gate from 1:00 for two minutes; a
GNSS jammer over Crissy Field takes the UGV's fix from 1:30 for a minute and a half (its EKF
failsafe holds it); PUMA 1 loses 30 % of its pack at 2:30 and drains three times as fast from
2:40 for two minutes; a spoofer walks HUNTER 1's position north from 3:20 (it believes it); HUNTER
1's autopilot reboots at 6:20 (silent 5 s, then disarmed in MANUAL, ArduRover's boot mode); PUMA
1's link is cut at 7:00 for 15 s; the timeline proposes an orbit for PUMA 1 at 7:30; the UGV
stops making way at 7:50.
"""

world = "golden-gate"                         # sim/worlds/golden-gate.toml: the land/water grid and the currents
fleet = "sim/fleets/fault-drill.toml"
contacts = "sim/scenarios/harbor-watch.toml"  # the ordinary traffic, the boat drifting off Mile Rock
events = []
policy = "sim/situations/policies/watch.toml"
at = "2026-06-14T10:00:00Z"
duration_s = 540
ai_start_s = 45
operator = "autoplay"
ai = "playbook"
seed = 1

# the headless simulator takes the world's land/water grid and its water (the defaults, said)
[headless]
domain_rule = "grid"
currents = "world"

[[order]]
id = "channel-patrol"
task = "patrol"
vehicles = { platform = "seahunter" }
route = [[-122.4720, 37.8135], [-122.4720, 37.8250]]
note = "Opening order: patrol the channel east of the bridge"

[[order]]
id = "crissy-patrol"
task = "patrol"
vehicles = { platform = "ugv_recon" }
route = [[-122.4500, 37.8058], [-122.4440, 37.8062]]
note = "Opening order: patrol Crissy Field"

[[step]]
id = "set-east"
at_s = 60
kind = "current"
east_mps = 1.0
north_mps = 0.0
duration_s = 120
text = "A current sets east through the Gate (truth)"
director = true

[[step]]
id = "jammer"
at_s = 90
kind = "gnss"
effect = "jam"
circle = { lat = 37.8058, lon = -122.4470, radius_m = 800 }
duration_s = 90
text = "A GNSS jammer over Crissy Field (truth)"
director = true

[[step]]
id = "cell-lost"
at_s = 150
kind = "battery"
vehicles = { platform = "puma" }
drop_pct = 30
text = "PUMA 1 loses 30 % of its pack (truth)"
director = true

[[step]]
id = "heavy-draw"
at_s = 160
kind = "battery"
vehicles = { platform = "puma" }
rate = 3.0
duration_s = 120
text = "PUMA 1 draws three times its power (truth)"
director = true

[[step]]
id = "spoofer"
at_s = 200
kind = "gnss"
effect = "spoof"
vehicles = { platform = "seahunter" }
walk_mps = 3.0
bearing_deg = 0.0
max_offset_m = 400.0
duration_s = 150
text = "A spoofer walks HUNTER 1's position north (truth)"
director = true

[[step]]
id = "reboot"
at_s = 380
kind = "reboot"
vehicles = { platform = "seahunter" }
down_s = 5
text = "HUNTER 1's autopilot reboots (truth)"
director = true

[[step]]
id = "cut"
at_s = 420
kind = "link"
vehicles = { platform = "puma" }
cut = true
duration_s = 15
text = "PUMA 1's link is cut for 15 s (truth)"
director = true

[[step]]
id = "reposition"
at_s = 450
kind = "propose"
task = "orbit"
vehicles = { platform = "puma" }
center = [-122.4700, 37.8200]
radius_m = 400
rationale = "Timeline: move {callsign} over the channel"
text = "The timeline proposes an orbit for PUMA 1"

[[step]]
id = "ugv-stops"
at_s = 470
kind = "stop"
vehicles = { platform = "ugv_recon" }
text = "The UGV stops making way (truth)"
director = true

[[watch]]
at_s = 100
text = "What the C2 shows of the UGV's navigation."

[playbook]
sensor_platform = "puma"
[[playbook.watch_area]]
name = "the Golden Gate approaches"
center = [-122.4783, 37.8199]
radius_m = 3000
[[playbook.protected]]
name = "the Golden Gate Bridge"
point = [-122.4783, 37.8199]

[autoplay]
preset = "default"
