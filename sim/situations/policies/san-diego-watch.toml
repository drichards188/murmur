# figure comes from San Diego's own currents (a known gap, docs/SCENARIO-SETTINGS.md section 3).

extends = "watch.toml"

[watch.area]
name = "the bay entrance off Ballast Point"
center = [-117.2290, 32.6860]               # [lon, lat]
radius_m = 3000
