# The watch policy for sim/situations/san-diego-watch.toml: the situations' watch policy
# (watch.toml: sim/policy.toml and the agent-tasking tier) and this scenario's circle
# (docs/SCENARIO-SETTINGS.md section 3). The circle is v0's for the world (sim/policy-v0-watch.toml
# `[area.san-diego]`: sim/worlds/san-diego.toml's `[mission]`), so a run of older rules is briefed
