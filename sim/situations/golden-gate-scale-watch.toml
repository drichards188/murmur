# Golden Gate scale watch: the scale world (sim/worlds/golden-gate-scale.toml) on a busy day,
# nothing scripted: 100 of ours in every domain, Golden Gate v3's traffic plus a heavier day, the
# physical sensing model, the world's land/water grid and currents, and each episode's conditions
# drawn from the world's ranges by its seed. For load and allocation under many simultaneous needs
# (WORLD-V3-PLAN H6, family F17), and the world's smoke and real-time factor
# (eval/headless/tests/test_worlds_v3.py):
#   .venv/bin/python -m eval.headless.batch --situation golden-gate-scale-watch --seeds 1-2 --agent none playbook
# Headless only. The opening orders (54) were laid out on the world's grids from the fleet as
# planned: the MQ-9Bs and RQ-4s on wide and far orbits, eight Pumas, ten X10s, three FVR-90s and
# the airships on station, four Sea Hunters and half the Corsairs on patrol, the Saildrones on
# their stations, the AUVs on survey lines, the ROVs inspecting their piers, the recon UGVs on
# patrol; the rest wait (the armed Maguras tied up: no opening order may move an armed platform).
title = "Golden Gate scale watch"
brief = """
You have the watch at the Golden Gate with a hundred of ours in the air, on and under the water
and ashore, on a busy day: ferries, ships in the channel, a crab fleet off Point Bonita, a yacht
race off the Cityfront, powerboats, the Coast Guard, sightseeing aircraft and helicopters, a news
helicopter over the bridge, cars and walkers ashore. Keep the picture and our vehicles in order.
"""
director = """
Nothing is scripted: the world's ordinary traffic only, heavier than Golden Gate v3's. The
conditions are drawn per episode from the world's ranges.
"""

world = "golden-gate-scale"
policy = "sim/situations/policies/watch.toml"
duration_s = 1800
ai_start_s = 45
ready_timeout_s = 300
operator = "autoplay"
ai = "playbook"
seed = 1

[headless]
domain_rule = "grid"
currents = "world"
conditions = "world"

