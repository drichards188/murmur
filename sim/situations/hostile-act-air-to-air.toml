# Hostile act to engagement air to air: the engagement decision chain end to end with the CCA's
# AIM-120C AMRAAM against an aircraft (sim/situations/README.md).
#   make situation NAME=hostile-act-air-to-air                        (autoplay, playbook AI: watch it)
#   make situation NAME=hostile-act-air-to-air OPERATOR=live          (you confirm and sign)
#   make situation NAME=hostile-act-air-to-air AI=claude              (the AI may nominate first)
#
# Two of ours at the Golden Gate, by day, one of them armed (FURY 1, a CCA with two AIM-120C, air
# targets only), and normal surface traffic, with no other aircraft. A large drone (a VTOL UAS)
# without a transponder comes in from the sea at 300 m, hovers over mid-strait west of the bridge
# and fires on HUNTER 1. Our sensors observe the act; the engine declares the drone hostile by
# rule (rules 9); op-auto confirms the declaration (live: you). The timeline nominates FURY 1 naming
# the AIM-120C (agent-scripted, a script, saying so) unless a nomination already stands; op-2 and
# op-3 sign (live: you, and a scripted cosigner); the engine releases the missile once FURY 1 is
# within its 1 to 90 km of slant range and its flight lands inside the plan's time, the picture
# still holding (rules 20 and 24); the truth side draws the hit and the damage (rules 25); our
# sensors assess the point.
#
# The airspace is honest about what an air engagement needs (bd murmur-e3b): the only aircraft are
# the drone and ours. An air track not declared hostile counts in the keep-out anywhere it
# could reach while it is out of view (rules 14 and 16), so a sky with airliners or other drones
# in it blocks an air engagement until they are far enough off (Saturation's reserve waits for its
# swarms to be 7 km off). The target hovers once on station, so the engine's constant-velocity
# prediction holds for a signed plan; a target that kept turning would void it.
#
# By day (17:00Z, 10:00 local) and with HUNTER 1 0.9 to 1.2 km from the target, as the tutorial,
# so the target is identified before it is nominated (bd murmur-9sxm).
#
# Clock: every `at_s` here, like the contacts' `start_s` and acts' `at_s`, counts from the stack's
# start (the link emulator's); the contacts come a few seconds later. The fleet is ready and on
# its opening order some 10 to 30 s in.
title = "Hostile act to engagement (air to air)"
brief = """
You have the watch at the Golden Gate on a June morning. Intelligence warns of a possible attack on
our vessels by unmanned aircraft. Two of ours are on station: HUNTER 1, a sensor ship patrolling
the channel just west of the bridge; and FURY 1, a collaborative combat aircraft circling high off
the coast to the southwest, armed with two AIM-120C AMRAAM air-to-air missiles, for air targets
only. Surface traffic is normal: ferries, a ship in the lane, fishing boats, a sailing yacht.

The opening order comes from the setup script (op-setup, not a person) and goes out by policy. An
armed platform gets no opening order: every order for one waits for a person.

The rules of engagement authorize an effect against a contact declared hostile, inside the
engagement zone west of the bridge, clear of every no-strike area and of anyone we protect. A
track is declared hostile by an operator, or by the engine's rule when our sensors observe a
hostile act against one of ours clearly attributed to it; an operator confirms or revokes such a
declaration, and until it is confirmed no engagement can be nominated on it. Any engagement needs
two operators with engagement authority, neither of them its proposer; the AI watch officer may
nominate one and can never sign it. An AI's proposal to move one of our vehicles (an orbit, a
patrol, a track) waits for the operator in the Inbox.

A nomination names its weapon from the platform's loadout, and the form's weapon check shows what
it is expected to do against the target before anyone signs. Any weapon can miss, and a hit can
leave a target damaged rather than destroyed: our sensors' assessment afterwards says which.
"""
director = """
Truth: a large VTOL drone some 3 m across, with no transponder (truth affiliation: hostile, kind
unknown_uas) comes in from the sea at 300 m and 30 m/s from about 0:08 and hovers over mid-strait
at [-122.4950, 37.8120], 1.5 km west of the bridge and inside the engagement zone, from about
1:35. At about 2:05 it fires on HUNTER 1, patrolling 0.9 to 1.2 km east of it (an abstract act),
and again every minute to 5:05. Nothing else is hostile, and nothing else flies but ours.
What should happen: HUNTER 1's panoramic camera holds the drone (it observed every act on the
run of 2026-11-03), and FURY 1's camera from far off; the engine attributes the first act to its
track at 0.9 or more and declares it hostile by rule (a loose fix is flagged instead, and the next
act is another chance); op-auto confirms the declaration on autoplay (live: you, in the Review
list). At 3:20 the timeline nominates FURY 1 with the AIM-120C AMRAAM (agent-scripted), unless a
nomination stands; op-2 and op-3 sign the plan within seconds; FURY 1 is dispatched, and the
engine releases the missile once FURY 1 is within its slant range and its flight lands inside the
plan's time (on that run 6.6 km out on the ground, 12.6 km of slant range, 13 s of flight); the
contacts' seed 127 makes the strike a hit that destroys the drone for any intent from 1 to 8 (on
the default run the nomination is intent 2); the drone leaves the picture and the assessment
reads "ceased" some 15 s later, our sensors covering the point. FURY 1 has one AIM-120C left.
What should not: a nomination before the declaration is confirmed (refused by target_declared), a
signature by the proposer or by an agent, or an effect released with a neutral or one of ours
inside the keep-out (the surface traffic stays a kilometre or more clear, HUNTER 1 some 500 m or
more).
"""

world = "golden-gate"                         # sim/worlds/golden-gate.toml
fleet = "sim/fleets/hostile-act-air-to-air.toml"
contacts = "sim/scenarios/hostile-act-air-to-air.toml"
events = []                                   # no comms or GNSS events: the situation is the chain
policy = "sim/situations/policies/watch.toml" # the shipped tiers and [identification], as
                                              # hostile-act-engagement's
tidewater = "golden-gate-2026-06"             # real tide, current and terrain (tidewater/)
at = "2026-06-14T17:00:00Z"                   # 10:00 local, by day (bd murmur-9sxm)
rate = 1
duration_s = 720                              # 12 minutes of situation time
ai_start_s = 30

operator = "autoplay"
ai = "playbook"                               # no account needed; the playbook has no engagement
                                              # play, so the timeline nominates
cosigner = "scripted"                         # live: a scripted operator adds the second signature
reveal = false
seed = 1

[summary]
headline = "Watch for a hostile act from the air; an engagement with FURY 1's AIM-120C takes two operators, and the AI can only nominate."
bullets = [
  "Two of ours on station: HUNTER 1 (sensor ship) and FURY 1 (armed jet drone: two AIM-120C, air targets only).",
  "A track is declared hostile by an operator or by rule on an observed hostile act; you confirm or revoke it.",
  "The nomination names its weapon; the weapon check shows its odds against the target before anyone signs.",
  "An effect needs two operators with engagement authority, neither its proposer, in the zone west of the bridge.",
  "Any weapon can miss: our sensors' assessment afterwards says what the strike did.",
]

[[order]]
id = "gate-patrol"
task = "patrol"
vehicles = { callsign = "HUNTER 1" }
route = [[-122.4850, 37.8130], [-122.4850, 37.8190]]
note = "Opening order: patrol the channel west of the bridge"

[[step]]
id = "drone-comes-in"
at_s = 10
kind = "note"
text = "A large drone without a transponder comes in from the sea toward the Gate (truth: hostile)"
director = true

[[step]]
id = "drone-fires"
at_s = 125
kind = "note"
text = "The drone fires on HUNTER 1 (truth; again every minute)"
director = true

# The nomination naming the AIM-120C, unless one stands on the track by 3:20 (whoever made it, the
# AI's included), once the form's dry run says FURY 1 passes every check with that weapon (waiting
# up to 4 minutes). In autoplay op-2 and op-3 sign it; live, you sign first and a scripted
# cosigner second. Its rationale begins "situation timeline (scripted, not a person)".
[[step]]
id = "amraam-nomination"
at_s = 200
kind = "engage"
track = { select = "most_suspicious", affiliation = ["hostile"], near = [-122.4950, 37.8120], radius_km = 3, domain = "air" }
vehicles = { callsign = "FURY 1" }
weapon = "AIM-120C AMRAAM"
effect_radius_m = 75
window_s = 600
fallback = "return"                           # a fixed wing's only lost-link action
unless_nominated = true
wait_s = 240
retry_s = 20
rationale = "{track} is declared hostile ({kind}, {affiliation} {confidence}, seen {age} ago): an aircraft, so FURY 1's AIM-120C AMRAAM. {callsign} passes every nomination check with it now (the form's dry run): effect radius 75 m, fallback return."
text = "At 3:20 agent-scripted nominates FURY 1 with the AIM-120C unless a nomination stands"

[[watch]]
at_s = 0
headline = "Stack up: two of ours at the Gate"
bullets = ["HUNTER 1 patrols just west of the bridge (order by policy)", "FURY 1 is armed: no script orders it, it circles high to the southwest"]
text = "The stack comes up: two of ours at the Gate. The setup script's opening order goes out by policy: HUNTER 1 on patrol just west of the bridge. FURY 1 is armed: no script orders it, so it circles high off the coast to the southwest."

[[watch]]
at_s = 40
headline = "Normal traffic"
bullets = ["Ferries, the lane, fishing boats, a yacht", "No AIS or transponder means unknown until a sensor classifies it"]
text = "Normal surface traffic: ferries, the shipping lane, fishing boats and a sailing yacht. A contact without AIS or a transponder is unknown until a sensor classifies it; the Tracks drawer says why each is shown as it is."

[[watch]]
at_s = 100
headline = "Hostile act: the engine may declare by rule"
bullets = ["Needs an observed act against one of ours, clearly attributed to one track", "Review list shows the act, sensors and attribution; you confirm or revoke"]
text = "Hostile acts: when our sensors observe a hostile act against one of ours, clearly attributed to one track, the engine declares that track hostile by rule; the Review list shows the act, the sensors and the attribution, and an operator confirms or revokes it. An unsure case is flagged for review, never declared."

[[watch]]
at_s = 170
headline = "Engagement: the weapon is named in the nomination"
bullets = ["The weapon check shows the named weapon's odds against the track's estimated kind", "An air-to-air missile is refused against anything but an air track", "Two operators sign one frozen plan, never its proposer"]
text = "An engagement names its weapon from the platform's loadout, or the engine picks the first usable one and says why; the weapon check refuses a weapon meant for another domain. It shows the weapon's chance of a hit and of each kind of damage against the track's estimated kind. Two operators with engagement authority sign one frozen plan, never its proposer; on autoplay op-2 and op-3 sign (scripted)."

[[watch]]
at_s = 230
headline = "After two signatures: release, flight, hit or miss, assessment"
bullets = ["The missile is released only within its slant range, its flight landing inside the plan's time", "A hit and the damage are drawn on the truth side; the C2 learns of them only from its sensors", "Then sensor coverage decides: ceased, persists or unknown"]
text = "After the second signature FURY 1 is dispatched. The engine releases the AIM-120C only when FURY 1 is within its slant range of the point and the missile's flight lands inside the plan's time, the picture still holding, every keep-out judged at the strike. The hit and the damage are drawn on the truth side; the C2 learns of them only from its sensors: our coverage of the point decides the assessment, ceased, persists or unknown. The Platforms panel shows FURY 1's rounds left."

[[watch]]
at_s = 600
headline = "Two minutes left"
bullets = ["The audit log holds the act, declaration, nomination with its weapon, signatures, release and assessment"]
text = "Two minutes left. The audit log holds every act, declaration, nomination (with its weapon), signature, the release and the assessment; the runner prints the replay command at the end."

[[watch]]
at_s = 130
headline = "The drone has fired on HUNTER 1 (truth)"
bullets = ["The chain from here: act observed, rule declaration, confirmation", "Then the AIM-120C nomination, two signatures, release, flight, assessment"]
text = "The drone has fired on HUNTER 1 (truth). The chain from here: the act observed, the rule declaration, a confirmation, the nomination with the AIM-120C, two signatures, the release, the missile's flight, the hit draw, the assessment."
director = true

# ---- the playbook engine (AI=playbook, the default, and the shadow beside a model)
[playbook]

[[playbook.watch_area]]
name = "the Golden Gate approaches"
center = [-122.4783, 37.8199]                 # the Golden Gate Bridge, mid-span
radius_m = 3000

[[playbook.protected]]
name = "the Golden Gate Bridge"
point = [-122.4783, 37.8199]                  # mid-span

# ---- the scripted operator on autoplay (eval/proxy.py), as hostile-act-engagement's
[autoplay]
preset = "default"
attend_s = 4.0
read_s = 3.0
read_per_check_s = 0.3
grant_agents = ["agent-watch", "agent-playbook"]
confirm_rule_declarations = true
