# San Diego watch: world v3's San Diego (sim/worlds/san-diego.toml) on an ordinary day,
# nothing scripted: 24 of ours in every domain, the world's background traffic in every domain,
# the physical sensing model, the world's land/water grid and currents, and each episode's
# conditions (start time, so day or night, visibility, wind, sea state) drawn from the world's
# ranges by its seed. The headless base the world v3 families build on in San Diego, and the
# world's smoke (eval/headless/tests/test_worlds_v3.py):
#   .venv/bin/python -m eval.headless.batch --situation san-diego-watch --seeds 1-3 --agent none playbook
# Headless only (the live runner has no conditions draw and no San Diego stack).
title = "San Diego watch"
brief = """
You have the watch at the entrance to San Diego Bay with twenty-four of ours: REAPER 1 orbits
over the approaches and HAWK 1 far offshore; PUMA 2 holds station over the entrance, PUMA 3 over
the central bay, KESTREL 1 over the approaches, SKY 2 over Shelter Island and the airship over
North Island; PUMA 1, PUMA 4 and SKY 1 wait at North Island. HUNTER 1 patrols the outer channel,
MARLIN 1 the channel past North Island, MARLIN 2 the central bay; MARLIN 3 waits at the carrier
piers and VIPER 1 waits armed off the Naval Amphibious Base. ALBATROSS 1 sails its station off
Point Loma. REMUS 1 surveys the entrance channel, three buoys drift in it, EEL 1 inspects the
carrier piers. FERRET 1 patrols North Island, MULE 1 waits by the piers. Traffic is normal for
the place: the Coronado ferry and harbor cruises, Navy ships and a car carrier in the channel,
fishing and sailing boats, the Coast Guard and the Harbor Police, airliners on the airport's
approach and departures, a Navy helicopter, light aircraft, cars and walkers ashore. Keep the
picture and our vehicles in order.
"""
director = """
Nothing is scripted: the world's ordinary traffic only. The conditions (time of day, visibility,
wind, sea state) are drawn per episode from the world's ranges.
"""

world = "san-diego"                           # its fleet and traffic (contacts) and space snapshot
policy = "sim/situations/policies/watch.toml"
duration_s = 1800
ai_start_s = 45
ready_timeout_s = 240
operator = "autoplay"
ai = "playbook"
seed = 1

[headless]
domain_rule = "grid"
currents = "world"
conditions = "world"

# ---- the opening orders (op-setup: by policy, or through agent-setup to the inbox). A patrol
# loops (its last waypoint back to its first), so a patrol along a channel retraces its way back.
[[order]]
id = "approaches-wide-orbit"
task = "orbit"
vehicles = { callsign = "REAPER 1" }
center = [-117.2400, 32.6700]
radius_m = 4000
note = "Opening order: orbit wide over the entrance and the approaches"

[[order]]
id = "far-orbit"
task = "orbit"
vehicles = { callsign = "HAWK 1" }
center = [-117.5500, 32.5500]
radius_m = 15000
note = "Opening order: the far orbit offshore"

[[order]]
id = "entrance-station"
task = "orbit"
vehicles = { callsign = "PUMA 2" }
center = [-117.2300, 32.6800]
radius_m = 300
note = "Opening order: launch from North Island and hold station over the entrance"

[[order]]
id = "bay-station"
task = "orbit"
vehicles = { callsign = "PUMA 3" }
center = [-117.1850, 32.7050]
radius_m = 300
note = "Opening order: launch from North Island and hold station over the central bay"

[[order]]
id = "approaches-orbit"
task = "orbit"
vehicles = { callsign = "KESTREL 1" }
center = [-117.2700, 32.6500]
radius_m = 800
note = "Opening order: orbit over the approaches"

[[order]]
id = "shelter-station"
task = "orbit"
vehicles = { callsign = "SKY 2" }
center = [-117.2200, 32.7100]
radius_m = 150
note = "Opening order: hold over the channel off Shelter Island"

[[order]]
id = "airship-station"
task = "orbit"
vehicles = { callsign = "ZEP 1" }
center = [-117.2050, 32.7000]
radius_m = 400
note = "Opening order: the airship holds over North Island"

[[order]]
id = "outer-patrol"
task = "patrol"
vehicles = { callsign = "HUNTER 1" }
route = [[-117.2310, 32.6850], [-117.2310, 32.6700], [-117.2330, 32.6600], [-117.2550, 32.6350], [-117.2330, 32.6600], [-117.2310, 32.6700]]
note = "Opening order: patrol the outer channel and the approaches"

[[order]]
id = "channel-patrol"
task = "patrol"
vehicles = { callsign = "MARLIN 1" }
route = [[-117.1960, 32.7140], [-117.2150, 32.7140], [-117.2260, 32.7060], [-117.2300, 32.6960], [-117.2260, 32.7060], [-117.2150, 32.7140]]
note = "Opening order: patrol the channel past North Island"

[[order]]
id = "bay-patrol"
task = "patrol"
vehicles = { callsign = "MARLIN 2" }
route = [[-117.1800, 32.7080], [-117.1680, 32.6990], [-117.1540, 32.6900], [-117.1680, 32.6990]]
note = "Opening order: patrol the central bay"

[[order]]
id = "point-loma-station"
task = "patrol"
vehicles = { callsign = "ALBATROSS 1" }
route = [[-117.2700, 32.6600], [-117.2800, 32.6800]]
note = "Opening order: sail the station off Point Loma"

[[order]]
id = "channel-survey"
task = "patrol"
vehicles = { callsign = "REMUS 1" }
route = [[-117.2320, 32.6720], [-117.2315, 32.6880]]
note = "Opening order: survey the entrance channel"

[[order]]
id = "pier-inspection"
task = "patrol"
vehicles = { callsign = "EEL 1" }
route = [[-117.1995, 32.7116], [-117.1975, 32.7118]]
note = "Opening order: inspect the carrier piers"

[[order]]
id = "north-island-patrol"
task = "patrol"
vehicles = { callsign = "FERRET 1" }
route = [[-117.2230, 32.6950], [-117.2150, 32.6960]]
note = "Opening order: patrol North Island's west shore"

[playbook]
sensor_platform = "puma"
[[playbook.watch_area]]
name = "the San Diego Bay entrance"
center = [-117.2320, 32.6860]
radius_m = 3000
[[playbook.protected]]
name = "the bay entrance channel"
point = [-117.2320, 32.6860]

[autoplay]
preset = "default"
