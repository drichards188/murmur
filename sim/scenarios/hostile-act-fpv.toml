# FPV strike traffic (sim/situations/hostile-act-fpv.toml): the tutorial's fast boat without AIS,
# here firing its machine gun at our sensor ship, and the tutorial's Golden Gate traffic around it
# (sim/scenarios/tutorial.toml says how it is kept clear of the holding area). Run by
# crates/murmur-contacts; format in crates/murmur-contacts/src/scenario.rs. Points are [lon, lat].
# Fictional names and MMSIs. Everything here is truth: the console only ever sees what our sensors
# make of it.
#
# The target is a fast inshore attack craft (sim/contacts.toml `armed_fast_boat`, looking like a
# small fast boat: `small_fast_boat`'s figures), what an FPV strike drone with a PG-7VL-class
# warhead is used against at sea. Against it the FPV hits 0.30 of the time and, given a hit,
# destroys it 0.41, stops it (propulsion lost) 0.32 and puts its weapons out 0.09 (sim/platforms.toml
# `fpv`, docs/research/weapons.md 10.3 and 10.4: 20 to 40 % of FPV strikes effective, a tenth of
# the hits failing to detonate; all estimates). It holds still once on station, so the speed
# penalty a fast target takes does not apply.
#
# Seed 108504 (the damage draw, crates/murmur-contacts damage.rs, depends on the run's seed and the
# strike's intent only): an FPV strike by any engagement intent from 1 to 6 hits the boat and
# destroys it (hit draws 0.01 to 0.28 against 0.30, damage draws 0.07 to 0.35 against 0.41), so the
# default run (the opening order is intent 1, the timeline's nomination intent 2) and a run where an
# AI's proposals come first both show it. Most FPV strikes do not do that: past intent 6, or with
# another seed, it most often misses, and the situation's brief says so. The boat's own strikes on
# HUNTER 1 draw on their acts' streams (`act:fastboat-raider-<n>:<burst>`), which the seed was not
# chosen for (docs/AUTONOMOUS-NODES.md decision D4: nothing is chosen to spare ours).
#
# The boat fires by its own fire control (docs/AUTONOMOUS-NODES.md, bd murmur-y85j.6); this file
# orders it, as hostile-act-engagement's, to fire two bursts of its 12.7 mm machine gun at HUNTER 1
# a minute, four times (each burst a hit 0.25 of the time; of its hits 0.03 sink HUNTER 1 and 0.17
# stop it). Its missiles are not ordered (sim/scenarios/hostile-act-engagement.toml says why).
#
# Times (`start_s`, an order's `at_s`) count from the contacts process's start, a few seconds after
# the situation's clock (the link emulator's start). uids are the fleet's
# (sim/fleets/hostile-act-fpv.toml): 1 is HUNTER 1.
title = "FPV strike traffic"
seed = 108504

[sensing]
misclassification_rate = 0.0     # deterministic identities: the situation is about the chain

# ---------------------------------------------------------------- the hostile
# As the tutorial's: a short run in at 15 m/s (29 kn), no AIS, from 800 m west of its holding point
# mid-strait, 1.5 km west of the bridge inside the engagement zone (sim/areas: ez-gate-west), where
# it stops at about 1:17, slowing from about 1:08 at its kind's 1.5 m/s² (sim/contacts.toml, bd
# murmur-2of4). At 1:25 it is ordered to open fire on HUNTER 1, patrolling 0.9 to 1.2 km
# east of it (inside its gun's 2 km), from where it holds, and again every minute: each firing
# episode is one act, another chance for our sensors to observe it.
[[contact]]
id = "fastboat-raider"
name = "Fast inshore attack craft without AIS, holding mid-strait west of the bridge"
affiliation = "hostile"
domain = "surface"
kind = "armed_fast_boat"
speed_mps = 15
motion = "transit"
route = [[-122.5040, 37.8105], [-122.4950, 37.8120]]
start_s = 5

[[order]]
at_s = 85
node = "fastboat-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "opens fire on the sensor ship (HUNTER 1)"

[[order]]
at_s = 145
node = "fastboat-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "fires on HUNTER 1 again"

[[order]]
at_s = 205
node = "fastboat-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "fires on HUNTER 1 a third time"

[[order]]
at_s = 265
node = "fastboat-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "fires on HUNTER 1 a fourth time"

