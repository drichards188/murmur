# Golden Gate traffic for the rules 5 keep-out demo (murmur-der.3, with
# sim/fleets/engage-keepout-demo.toml): the suspect fast boat comes in from Richardson Bay and
# holds west of the bridge (the target, as in golden-gate-engage.toml), and three neutrals
# that rules 4 counted as in the way and rules 5 tells apart:
# - a fast ferry shuttling at 20 m/s 1.4 km west of the holding point: under rules 4 its
#   2-sigma grew at 0.3 x 20 m/s (about 1.3 km two minutes out) and it blocked; under rules 5
#   it is predicted with acceleration noise (about 0.3 km) and is clear;
# - a fast ferry that runs to a landing 300 m south of the holding point and waits there four
#   minutes, then runs 4.9 km east and waits again (its legs take 4 minutes): near, it still
#   blocks; far, it does not;
# - an aircraft crossing over the holding point at 3,000 m: in 2D it blocks whenever it
#   passes overhead. It stays 2D here: no sensor of the demo fleet measures an aircraft's
#   height (the USVs' radars are 2D navigation radars, EO/IR has no range), and a 3D keep-out
#   counts a track's altitude only from a recent ranged measurement.
# Timeline from the start (scenario seconds): the target holds from about 375 s; the near
# ferry waits by the holding point 243 to 483 s, leaves, waits 4.9 km east 726 to 966 s,
# comes back (in the way from about 1,100 s) and waits by the holding point 1,209 to 1,449 s.
# Truth only: the C2 sees what our sensors make of it. An effect is an abstract event.
title = "Golden Gate traffic, rules 5 keep-out demo"
seed = 11

[sensing]
misclassification_rate = 0.0     # deterministic identities for the demo

# ---------------------------------------------------------------- the suspect
[[contact]]
id = "fastboat-richardson"
name = "Fast boat out of Richardson Bay with a spoofed fishing-vessel AIS"
affiliation = "hostile"
domain = "surface"
kind = "small_fast_boat"
speed_mps = 15
motion = "route"
route = [[-122.4760, 37.8560], [-122.4740, 37.8360], [-122.4790, 37.8230], [-122.4950, 37.8120]]
reverse = true
dwell_s = 1500                   # 25 minutes holding west of the bridge
ais = { mmsi = "366999302", name = "F/V PACIFIC DAWN", ship_type = "fishing", spoofed = true }

# ---------------------------------------------------------------- a distant fast ferry
[[contact]]
id = "ferry-fast-west"
name = "Fast ferry shuttling 1.4 km west of the holding point (AIS)"
affiliation = "neutral"
domain = "surface"
kind = "ferry"
speed_mps = 20
motion = "route"
route = [[-122.5109, 37.8065], [-122.5109, 37.8235]]
reverse = true
ais = { mmsi = "366999151", name = "MV GOLDEN SWIFT", ship_type = "passenger" }

# ---------------------------------------------------------------- a fast ferry that comes near
[[contact]]
id = "ferry-fast-near"
name = "Fast ferry to a landing 300 m south of the holding point (AIS)"
affiliation = "neutral"
domain = "surface"
kind = "ferry"
speed_mps = 20
motion = "route"
route = [[-122.4400, 37.8130], [-122.4950, 37.8093]]
reverse = true
dwell_s = 240                    # four minutes at each end
ais = { mmsi = "366999152", name = "MV BAY SPRINTER", ship_type = "passenger" }

# ---------------------------------------------------------------- an aircraft high overhead
[[contact]]
id = "aircraft-high"
name = "Aircraft crossing over the Gate at 3,000 m (transponder)"
affiliation = "neutral"
domain = "air"
kind = "light_aircraft"
speed_mps = 60
alt_m = 3000
signature = 1.5
motion = "route"
route = [[-122.4950, 37.7600], [-122.4950, 37.8700]]
reverse = true
