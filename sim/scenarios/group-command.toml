# Group command's contacts (sim/situations/group-command.toml): the day's weather and a quiet
# harbor. A situation about supervising our own fleet, so nothing here is hostile, unknown or
# armed: three ferries on their usual runs, each with its AIS (copied from
# sim/scenarios/golden-gate.toml), away from the groups' stations. They are here for two reasons:
# the contacts process needs a contact to run, and it is what serves the map its weather. (A car
# carrier at anchor south of the Bay Bridge, also tried, was shown suspect: too far for its AIS to
# be heard, a ship our sensors classified on their own; not what this situation is about.)
# Format: crates/murmur-contacts/src/scenario.rs; points are [lon, lat].
title = "Group command: a quiet harbor"
seed = 34

[sensing]
model = "physical"
misclassification_rate = 0.02
terrain = "sim/headless/terrain/golden-gate.grid.gz"

[sensing.weather]
# The archive's hourly rows for 14 June 2026, 19:00 and 20:00 UTC, at the Golden Gate's 20 points
# (HRRR through Open-Meteo, pinned for Fog watch: sim/headless/weather/README.md), as they were:
# no timeline, so no scripted fog. 19:00 UTC (noon local) is the archive's clearest hour that day
# at the Gate: 13 km of visibility, 38 % cloud, a 4.5 m/s west wind.
archive = "sim/headless/weather/fog-watch.json"

