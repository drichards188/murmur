# Golden Gate v3's background traffic (sim/worlds/golden-gate-v3.toml; docs/WORLD-V3-PLAN.md
# section 5): what moves at the Gate on an ordinary day, in every domain but under the water
# (subsurface contacts come with situations), under the physical sensing model. Format:
# crates/murmur-contacts/src/scenario.rs; points are [lon, lat]. Everything here is truth: the
# console and the AI only ever see what our sensors make of it. A situation in the world takes
# this file unless it names its own contacts; a family adds its elements to a copy.
#
# Sources (approximations, not schedules): the ferry runs are the Golden Gate Ferry's Sausalito
# and Larkspur routes, Blue & Gold's Pier 41 to Angel Island and Tiburon, Alcatraz City Cruises
# from Pier 33 and Red & White's bay cruise under the bridge from Pier 43 1/2; the deep-water
# traffic follows the main ship channel over the San Francisco Bar and through the Gate (the VTS
# traffic separation scheme's inbound and outbound lanes); fishing out of Fisherman's Wharf and
# Sausalito to the Potato Patch and Mile Rock; sailing off the Cityfront and Crissy Field; the
# Coast Guard's Station Golden Gate at Horseshoe Bay. Air: sightseeing light aircraft and tour
# helicopters along the shoreline at 1,000 to 2,000 ft (the published Bay Tour routes run below
# the SFO Class B shelf, 300 to 600 m here), a hobby drone off Baker Beach below 400 ft. Ground:
# Mason Street along Crissy Field, Marine Drive to Fort Point, Lincoln Boulevard through the
# Presidio, Conzelman Road and Alexander Avenue in the Marin Headlands; walkers on the Crissy
# Field promenade, at Fort Point and at Battery Spencer. Routes are drawn to stay on water or on
# land on the world's baked grid (checked: eval/headless/tests/test_worlds_v3.py).
#
# AIS by class, as carriage rules have it: ferries, the cruise boat, the ships and the Coast
# Guard boat carry class A (SOLAS ships, passenger vessels, the 65 ft commercial rule); the
# trawler class A; the charter boat and one daysailer class B; the sport fishing boats and the
# other yachts none. Names and MMSIs are fictional.
title = "Golden Gate v3 traffic"
seed = 31

[sensing]
misclassification_rate = 0.05
model = "physical"
terrain = "sim/headless/terrain/golden-gate.grid.gz"
bathymetry = "sim/headless/terrain/golden-gate.bathy.grid.gz"

# What the sensing model senses in when a situation draws nothing (`[headless] conditions =
# "world"` draws visibility, wind and sea state per episode and puts them here); the sun comes
# from the scenario clock. Shipping noise for sonar: a busy harbour entrance.
[conditions]
visibility_m = 20000
sea_state = 2
wind_mps = 5
shipping = 0.7

