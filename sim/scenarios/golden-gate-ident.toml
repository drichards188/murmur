# Golden Gate traffic for rule-based identification (rules 9): hostile acts, clear and ambiguous.
# Run with the engagement demo fleet (stand-ins; uids in file order:
# 1 switchblade, 2 magura, 3 ugv_armed, 4 corsair, 5 x10):
#   make goldengate GG_FLEET=engage-demo CONTACTS=sim/scenarios/golden-gate-ident.toml
#   (with MURMUR_OPERATORS=op-1,op-2,op-3 MURMUR_ENGAGE_OPERATORS=op-2,op-3 for two approvers)
# and `[identification] rule_declaration = true` in the policy (sim/policy.toml has it).
#
# - the clear case: the fast boat (a fast inshore attack craft, sim/contacts.toml
#   `armed_fast_boat`), alone and holding west of the bridge, is ordered to fire a missile at our
#   USV (magura, uid 2), and a second two minutes later. The corsair's EO/IR sees the launch; the
#   engine attributes it to the fast boat's track, usually above the threshold, and declares it
#   hostile by rule (a review item: confirm or revoke).
# - the ambiguous case: a skiff with a machine gun (`armed_skiff`) tied up 25 m from a stopped crab
#   boat is ordered to fire a burst at the corsair (uid 4). Both are tracked; the act's observed
#   position can't tell them apart, so the engine attributes it below the threshold and flags it
#   for review, declaring nothing.
#
# Each node fires by its own fire control (docs/AUTONOMOUS-NODES.md, bd murmur-y85j.6): this file
# only times its orders. The magura holds off Horseshoe Bay some 2.8 km from the fast boat's
# holding point, beyond its machine gun's 2 km and inside its ATGM-class missile's 5.5 km, so the
# boat fires a missile (one each order). The crab boat and the skiff lie some 780 m west of the
# corsair, inside the skiff's machine gun's 1 km (its RPG reaches 330 m): they were 2 km off, where
# the skiff would have held its fire and the ambiguous case would never have come; the author moved
# them, never the weapon's figures. Their shots fly and strike as truth and each strike is drawn by
# the damage model: a missile can stop or sink the magura (of its hits, 0.75 sink a USV and 0.15
# stop it; the stand-ins act damage out). Truth only: the C2 learns of an act through its sensors
# (the bridge's sensing model decides which of ours observe it and where they place its author).
# Identities fictional.
title = "Golden Gate traffic, identification demo"
seed = 13

[sensing]
misclassification_rate = 0.0     # deterministic identities for the demo

# ---------------------------------------------------------------- the clear case
[[contact]]
id = "fastboat-gate"
name = "Fast inshore attack craft coming down from Lime Point to hold west of the bridge (no AIS)"
affiliation = "hostile"
domain = "surface"
kind = "armed_fast_boat"
speed_mps = 12
motion = "route"
route = [[-122.4790, 37.8230], [-122.4950, 37.8120]]
dwell_s = 3000

[[order]]
at_s = 240
node = "fastboat-gate"
do = "attack"
target = { vehicle = 2 }
weapon = "ATGM-class missile"
rounds = 1
stay = true
label = "fires a missile at the patrol USV (magura)"

# It fires again two minutes later. If the first was attributed below the threshold (the
# sensors place an act's author with their own error, and the track has its own: in the first
# live run, 2026-10-05, the clear act came in 78 m from the track at 29 m 1-sigma, attribution
# 0.84, and was flagged), this one is a second chance; if the first declared the boat, the
# engine only records it.
[[order]]
at_s = 360
node = "fastboat-gate"
do = "attack"
target = { vehicle = 2 }
weapon = "ATGM-class missile"
rounds = 1
stay = true
label = "fires a missile at the patrol USV again"

# ---------------------------------------------------------------- the ambiguous case
[[contact]]
id = "crab-boat"
name = "Crab boat stopped mid-channel east of the bridge, pots out (no AIS)"
affiliation = "neutral"
domain = "surface"
kind = "fishing_vessel"
motion = "station"
at = [-122.4741, 37.8195]

[[contact]]
id = "skiff"
name = "Skiff with a machine gun tied up alongside the crab boat (no AIS)"
affiliation = "hostile"
domain = "surface"
kind = "armed_skiff"
motion = "station"
at = [-122.47382, 37.8195]       # 25 m east of the crab boat

[[order]]
at_s = 300
node = "skiff"
do = "attack"
target = { vehicle = 4 }
weapon = "7.62 mm GPMG (PKM-class)"
rounds = 16
stay = true
label = "fires on the sensor ship (corsair) from alongside the crab boat"

# ---------------------------------------------------------------- the rest of the picture
[[contact]]
id = "ferry-sausalito"
name = "Sausalito ferry (Ferry Building to Sausalito)"
affiliation = "neutral"
domain = "surface"
kind = "ferry"
speed_mps = 10
motion = "route"
route = [[-122.3905, 37.7960], [-122.4120, 37.8130], [-122.4400, 37.8220], [-122.4620, 37.8390], [-122.4770, 37.8560]]
reverse = true
dwell_s = 600
ais = { mmsi = "366999101", name = "MV GOLDEN BEAR", ship_type = "passenger" }

[[contact]]
id = "uscg-cutter"
name = "Coast guard patrol boat on station in the central bay (AIS)"
affiliation = "assumed_friend"
domain = "surface"
kind = "patrol_boat"
speed_mps = 6
motion = "loiter"
center = [-122.4350, 37.8200]
radius_m = 1200
ais = { mmsi = "366999401", name = "CGC TERN", ship_type = "law_enforcement" }
