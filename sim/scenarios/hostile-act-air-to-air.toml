# Air-to-air traffic (sim/situations/hostile-act-air-to-air.toml): a large armed hostile drone
# without a transponder that fires on our picket ship, and the tutorial's Golden Gate surface
# traffic (sim/scenarios/tutorial.toml says how it is kept clear of the holding area). No other
# aircraft: an air track not declared hostile counts in an engagement's keep-out anywhere it could
# reach while it is out of view (rules 14 and 16), so a sky with airliners or other drones in it
# blocks an air engagement until they are far enough off (bd murmur-e3b; Saturation's reserve waits
# for its swarms to be 7 km off). Run by crates/murmur-contacts; format in
# crates/murmur-contacts/src/scenario.rs. Points are [lon, lat]. Fictional names and MMSIs.
# Everything here is truth: the console only ever sees what our sensors make of it.
#
# The target is a large armed VTOL drone, some 3 m across (sim/contacts.toml `armed_uas`, looking
# like an `unknown_uas`: the physical model's small drone signature made larger, `dc_m` 3,
# `height_m` 1, `rcs_m2` 0.5 and `thermal_k` 10, all [E] for a Group 3 rotorcraft with a combustion
# engine; its hit and damage figures are the small drone's: crates/murmur-decide catalog.rs
# KIND_ALIASES). Against it the CCA's AIM-120C hits 0.60 of the time and, given a hit, destroys it
# 0.95 (sim/platforms.toml `cca`, docs/research/weapons.md 10.3 and 10.4, all estimates). It is a
# drone rather than a helicopter or a light aircraft because the tracker reads those, without a
# transponder, as neutral (they need not carry one), and the engine then flags an act by one for
# review instead of declaring it by rule; a UAS without a transponder reads as suspect. It hovers
# once on station, so the engine's constant-velocity prediction holds for a signed plan.
#
# Seed 127 (the damage draw, crates/murmur-contacts damage.rs, depends on the run's seed and the
# strike's intent only): an AIM-120C strike by any engagement intent from 1 to 8 hits and destroys
# the drone (hit draws 0.02 to 0.49 against 0.60, damage draws 0.12 to 0.76 against 0.95), so the
# default run (the opening orders are intents 1 and 2, the timeline's nomination intent 3) and a run
# where an AI's proposals come first both show a hit. Past intent 8, or with another seed, the
# missile can miss, and the situation's brief says it can. The drone's own strikes on HUNTER 2 draw
# on their acts' streams (`act:drone-raider-<n>`), which the seed was not chosen for
# (docs/AUTONOMOUS-NODES.md decision D4: nothing is chosen to spare ours); on seed 127 the first
# sinks it.
#
# The drone fires by its own fire control (docs/AUTONOMOUS-NODES.md, bd murmur-y85j.6): it carries
# two LMM-class light missiles (510 m/s, 400 m to 6 km, from or at the air), its whole loadout. This
# file orders it to fire one at HUNTER 2, and the other a minute later. Each is one act, and each
# is dangerous: against a fishing-vessel-sized sensor ship it hits 0.90 of the time and of its hits
# 0.20 sink HUNTER 2 and 0.45 stop it. Out of missiles it turns for home along its way in (its
# kind's `on_empty`).
#
# Its target is HUNTER 2, the picket 3.5 to 3.9 km off, not HUNTER 1, the sensor ship 1 km off (bd
# murmur-qese): the chain needs HUNTER 1's camera on the drone, and a sunk HUNTER 1 counts in the
# keep-out until a person accepts its loss, so missiles at HUNTER 1 stopped the chain after the
# declaration whenever one sank it (7 of seeds 1 to 20 headless, and seed 127, whose first missile
# sank it). A sunk HUNTER 2 reaches the keep-out only some nine minutes later at its cruise speed:
# the chain ran to its assessment on all 20. The geometry is the author's; the drone's figures and
# the seed are as they were.
#
# Times (`start_s`, an order's `at_s`) count from the contacts process's start, a few seconds after
# the situation's clock (the link emulator's start). uids are the fleet's
# (sim/fleets/hostile-act-air-to-air.toml): 1 is HUNTER 1, 3 HUNTER 2.
title = "Air-to-air traffic"
seed = 127

[sensing]
misclassification_rate = 0.0     # deterministic identities: the situation is about the chain

# ---------------------------------------------------------------- the hostile
# The drone comes in from the sea at 300 m and 30 m/s, from 2.7 km west of its station over
# mid-strait, 1.5 km west of the bridge inside the engagement zone (sim/areas: ez-gate-west), and
# hovers there from about 1:35. At 1:55 it is ordered to fire a missile at HUNTER 2, on picket 3.5
# to 3.9 km southwest of it, from where it hovers, and a minute later its second.
[[contact]]
id = "drone-raider"
name = "Large armed VTOL drone without a transponder, hovering over mid-strait west of the bridge"
affiliation = "hostile"
domain = "air"
kind = "armed_uas"
alt_m = 300
dc_m = 3.0
height_m = 1.0
rcs_m2 = 0.5
thermal_k = 10.0
speed_mps = 30
motion = "transit"
route = [[-122.5250, 37.8080], [-122.4950, 37.8120]]
start_s = 5

[[order]]
at_s = 115
node = "drone-raider"
do = "attack"
target = { vehicle = 3 }
weapon = "LMM-class light missile"
rounds = 1
stay = true
label = "fires a missile at the picket ship (HUNTER 2)"

[[order]]
at_s = 175
node = "drone-raider"
do = "attack"
target = { vehicle = 3 }
weapon = "LMM-class light missile"
rounds = 1
stay = true
label = "fires its second missile at HUNTER 2"

