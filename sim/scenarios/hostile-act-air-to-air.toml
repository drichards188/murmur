# Air-to-air traffic (sim/situations/hostile-act-air-to-air.toml): a large hostile drone without a
# transponder that fires on our sensor ship, and the tutorial's Golden Gate surface
# traffic (sim/scenarios/tutorial.toml says how it is kept clear of the holding area). No other
# aircraft: an air track not declared hostile counts in an engagement's keep-out anywhere it could
# reach while it is out of view (rules 14 and 16), so a sky with airliners or other drones in it
# blocks an air engagement until they are far enough off (bd murmur-e3b; Saturation's reserve waits
# for its swarms to be 7 km off). Run by crates/murmur-contacts; format in
# crates/murmur-contacts/src/scenario.rs. Points are [lon, lat]. Fictional names and MMSIs.
# Everything here is truth: the console only ever sees what our sensors make of it.
#
# The target is a large VTOL drone, some 3 m across (kind `unknown_uas`, the physical model's
# small drone signature made larger: `dc_m` 3, `height_m` 1, `rcs_m2` 0.5 and `thermal_k` 10, all
# [E] for a Group 3 rotorcraft with a combustion engine; its hit and damage figures are the small
# drone's: crates/murmur-decide catalog.rs KIND_ALIASES). Against it the CCA's AIM-120C hits 0.60 of
# the time and, given a hit, destroys it 0.95 (sim/platforms.toml `cca`, docs/research/weapons.md
# 10.3 and 10.4, all estimates). It is a drone rather than a helicopter or a light aircraft because
# the tracker reads those, without a transponder, as neutral (they need not carry one), and the
# engine then flags an act by one for review instead of declaring it by rule; a UAS without a
# transponder reads as suspect. It hovers once on station, so the engine's constant-velocity
# prediction holds for a signed plan.
#
# Seed 127 (the damage draw, crates/murmur-contacts damage.rs, depends on the run's seed and the
# strike's intent only): an AIM-120C strike by any engagement intent from 1 to 8 hits and destroys
# the drone (hit draws 0.02 to 0.49 against 0.60, damage draws 0.12 to 0.76 against 0.95), so the
# default run (the opening order is intent 1, the timeline's nomination intent 2) and a run where an
# AI's proposals come first both show a hit. Past intent 8, or with another seed, the missile can
# miss, and the situation's brief says it can.
#
# Times (`start_s`, an act's `at_s`) count from the contacts process's start, a few seconds after
# the situation's clock (the link emulator's start). uids are the fleet's
# (sim/fleets/hostile-act-air-to-air.toml): 1 is HUNTER 1.
title = "Air-to-air traffic"
seed = 127

[sensing]
misclassification_rate = 0.0     # deterministic identities: the situation is about the chain

# ---------------------------------------------------------------- the hostile
# The drone comes in from the sea at 300 m and 30 m/s, from 2.7 km west of its station over
# mid-strait, 1.5 km west of the bridge inside the engagement zone (sim/areas: ez-gate-west), and
# hovers there from about 1:35. It fires on HUNTER 1, patrolling 0.9 to 1.2 km east of it, from
# about 2:00 and again every minute (an abstract act: each one is another chance for our sensors
# to observe it).
[[contact]]
id = "drone-raider"
name = "Large VTOL drone without a transponder, hovering over mid-strait west of the bridge"
affiliation = "hostile"
domain = "air"
kind = "unknown_uas"
alt_m = 300
dc_m = 3.0
height_m = 1.0
rcs_m2 = 0.5
thermal_k = 10.0
speed_mps = 30
motion = "transit"
route = [[-122.5250, 37.8080], [-122.4950, 37.8120]]
start_s = 5

[[act]]
id = "act-1"
at_s = 120
by = "drone-raider"
against_vehicle = 1
label = "fires a missile at the sensor ship (HUNTER 1)"

[[act]]
id = "act-2"
at_s = 180
by = "drone-raider"
against_vehicle = 1
label = "fires at HUNTER 1 again"

[[act]]
id = "act-3"
at_s = 240
by = "drone-raider"
against_vehicle = 1
label = "fires at HUNTER 1 a third time"

[[act]]
id = "act-4"
at_s = 300
by = "drone-raider"
against_vehicle = 1
label = "fires at HUNTER 1 a fourth time"

