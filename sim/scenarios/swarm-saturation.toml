# Saturation's contacts (sim/situations/swarm-saturation.toml): the harbor's ordinary traffic and
# 500 hostile quadcopters in five swarms. GENERATED by scripts/threat_swarms.py (seed 23): change
# the script and run `.venv/bin/python scripts/threat_swarms.py` rather than editing this file. The
# script's docstring says where the speeds, heights and spacing come from. Run by
# crates/murmur-contacts; points are [lon, lat]; everything here is truth (the console only
# ever sees what our sensors make of it).
#
# Times (`start_s`, an act's `at_s`) count from the contacts process's start, a few seconds
# after the situation's clock (the link emulator's). The swarms, and when each passes its
# waypoints at its own speed (m:ss on the contacts' clock):
# - recon (59, 25 m/s, 60 to 110 m): comes in past Point Bonita, probes the Gate's picket rings (PICKET-1 over Lime Point, PICKET-9 in the strait), runs on past the jammed north approach and holds over Belvedere and Tiburon; 0:30, 3:25, 6:07, 8:24, 11:12.
# - wave (180, 25 m/s, 30 to 120 m): comes in from the sea in one wave, crosses the bridge at about 6:00 and runs on into the bay to hold over the Bay Bridge's west approach; 0:32, 4:04, 6:01, 8:19, 11:36.
# - decoy (80, 24 m/s, 40 to 100 m): circles over the jammed north approach (Fort Baker, Sausalito) while the wave crosses the bridge, then holds over Richardson Bay's north shore; 0:50, 3:30, 4:48, 5:43, 6:37, 7:32, 10:53.
# - attack-east (90, 20 m/s, 20 to 50 m): launched from the East Bay shore, comes in low over the USVs' lane north of Alcatraz and holds over its east end; 2:00, 5:26, 8:02.
# - attack-west (90, 20 m/s, 20 to 50 m): comes in low from the sea to the south-west and holds off the Saildrones' ring off Ocean Beach; 0:50, 4:05, 6:10.
# - recon-shooter: one of the recon swarm that stops in the engagement zone 1.5 km west of the
#   bridge, at -122.495, 37.812, 40 m up, and fires on SURFACE-3's first USV (uid 3201,
#   on its ring 2 km east) at about 10:00, 11:00 and 12:00 (abstract acts: no weapon modelled).
#
# By 11:30 every swarm is 7 km or more from the shooter, over our pickets and surface groups
# where our sensors keep seeing it, so an engagement on the shooter can pass its keep-out (the
# script's docstring says why that distance).
