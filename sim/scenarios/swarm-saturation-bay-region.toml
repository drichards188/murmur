[[contact]]
id = "recon-shooter"
name = "Armed drone flying with the recon swarm that stops over the bar and fires (no transponder)"
affiliation = "hostile"
domain = "air"
kind = "armed_uas"
speed_mps = 25.0
alt_m = 40
motion = "transit"
route = [[-122.56500, 37.82800], [-122.52000, 37.83200], [-122.55610, 37.79790]]
start_s = 30

[[order]]
at_s = 595
node = "recon-shooter"
do = "attack"
target = { vehicle = 3201 }
weapon = "LMM-class light missile"
rounds = 1
stay = true
label = "fires a missile at a USV of SURFACE-3 on the bar"

[[order]]
at_s = 655
node = "recon-shooter"
do = "attack"
target = { vehicle = 3201 }
weapon = "LMM-class light missile"
rounds = 1
stay = true
label = "fires its second missile at the same USV"

