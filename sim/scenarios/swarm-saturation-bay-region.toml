# Saturation's contacts over the region from Bodega Bay to Monterey Bay (sim/situations/
# swarm-saturation.toml): the ordinary traffic and 500 hostile drones in five swarms. GENERATED by
# scripts/threat_swarms.py (layout region, seed 29): change the script and run
# `.venv/bin/python scripts/threat_swarms.py` rather than editing this file. The script's docstring
# says where the speeds, heights, spacing and kinds come from. Run by crates/murmur-contacts; points
# are [lon, lat]; everything here is truth (the console only ever sees what our sensors make of it).
#
# Times (`start_s`, an order's `at_s`) count from the contacts process's start, a few seconds
# after the situation's clock (the link emulator's). The swarms, and when each passes its
# waypoints at its own speed (m:ss on the contacts' clock; each also takes some 25 s to reach
# its speed and slows onto its hold at its kind's rate, sim/contacts.toml):
# - recon (59 small_drone, 25 m/s, 60 to 110 m): comes in from the inner gulf, probes the Golden Gate's rings (PICKET-3 over the Gate's mouth, PICKET-4 in the strait), crosses the Gate north of the bridge, runs through PICKET-2's ring over Richardson Bay and holds over Belvedere and Tiburon; 0:30, 3:09, 5:03, 6:43, 8:26, 10:05.
# - wave (180 small_drone, 25 m/s, 30 to 120 m): comes in from the gulf in one wave, crosses the bridge at about 6:00 and runs on into the bay past the city front to hold over the Bay Bridge's west approach; 0:32, 3:46, 5:42, 7:59, 10:56.
# - decoy (80 small_drone, 24 m/s, 40 to 100 m): comes in from the sea off Half Moon Bay, circles over the jammed approach (round the airport the PICKET-9 to -11 rings launched from) while the wave crosses the Golden Gate, then holds over the mouth of Pillar Point Harbor; 0:50, 3:42, 5:14, 6:48, 8:17.
# - attack-east (90 oneway_drone, 20 m/s, 20 to 50 m): launched from the East Bay shore off Berkeley, comes in low over the central bay and holds over the east side of SURFACE-4's ring; 1:00, 2:50, 5:02.
# - attack-west (90 oneway_drone, 20 m/s, 20 to 50 m): comes in low from the sea to the south-west and holds over the south-west of the Saildrones' ring mid-gulf (SURFACE-1); 0:50, 2:59, 5:23.
# - recon-shooter (armed_uas: an armed VTOL drone with two light missiles, flying with the recon
#   swarm): turns back off Point Bonita and stops in the engagement zone over the San
#   Francisco Bar, at -122.5561, 37.7979, 40 m up, 1.6 km outside SURFACE-3's ring, and is
#   ordered to attack SURFACE-3's first USV (uid 3201, within 5.6 km wherever it is on its ring)
#   from where it hovers: it fires one missile at about 10:00 and its second at about 11:00 (its own
#   fire control, docs/AUTONOMOUS-NODES.md); each strike is drawn by the damage model and can stop
#   or sink the USV. Out of missiles it turns for home along its way in (its kind's `on_empty`).
#
# By 11:30 every swarm is 7 km or more from the shooter (the nearest, the recon swarm over
# Tiburon, 12 km), over our pickets and surface groups where our sensors keep seeing it, so an
# engagement on the shooter can pass its keep-out (the script's docstring says why that distance).
title = "Saturation: 500 hostile drones in five swarms over the Bay region, and its traffic"
seed = 29

[sensing]
misclassification_rate = 0.0     # deterministic identities: the situation is about the load

