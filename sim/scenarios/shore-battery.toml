# Shore battery traffic (sim/situations/shore-battery.toml): ordinary traffic at the Golden Gate and
# two fast boats that fire on one of ours, one after the other. Run by crates/murmur-contacts;
# format in crates/murmur-contacts/src/scenario.rs. Points are [lon, lat]. Routes and identities
# as in sim/scenarios/hostile-act-engagement.toml (fictional names and MMSIs), without the inbound
# container ship, whose lane crosses both holding points during the watch.
#
# Times (`start_s`, an order's `at_s`) count from the contacts process's start, a few seconds after
# the situation's clock (the link emulator's). uids are the fleet's (sim/fleets/shore-battery.toml):
# 1 is HUNTER 1, 2 is BULL 1.
#
# Each boat is a fast inshore attack craft (sim/contacts.toml `armed_fast_boat`: four ATGM-class
# missiles and a 12.7 mm heavy machine gun; it looks like a small fast boat to our sensors until it
# fires) and fires by its own fire control (docs/AUTONOMOUS-NODES.md, bd murmur-y85j.6): this file
# orders each, as hostile-act-engagement's boat, to fire two bursts of its machine gun at HUNTER 1
# a minute, three times (each burst a hit 0.25 of the time; of its hits 0.03 sink HUNTER 1 and 0.17
# stop it), and sim/scenarios/hostile-act-engagement.toml says why its missiles are not ordered.
# Each two-burst episode is one act: the engine learns of it only through our sensors and declares
# its author hostile by rule when it is attributed to one track at the policy's threshold (0.9) or
# more.
#
# The seed: every hit and damage draw of our weapons is seeded by it and the strike (the intent's
# number, and a burst's: `effect:<intent>:target`, `effect:<intent>:<burst>:target`),
# crates/murmur-contacts damage.rs. 98921 is chosen so that on the default run (autoplay, no AI:
# the Javelin's nomination is intent 2, the M2's intent 3) the Javelin destroys the first boat and
# the M2's third burst destroys the second, and the same holds if one or two more orders come
# before them (intents 3 and 4, or 4 and 5). Another run, an AI's own nominations among them, may
# number them otherwise: the Javelin may miss or only stop the boat (the first run, on another
# seed, left it drifting without propulsion), and the gun may take many bursts. The boats' own
# strikes on HUNTER 1 draw on their acts' streams (`act:fastboat-first-<n>:<burst>`,
# `act:fastboat-second-<n>:<burst>`), which the seed was not chosen for (docs/AUTONOMOUS-NODES.md
# decision D4: nothing is chosen to spare ours).
title = "Shore battery traffic"
seed = 98921

[sensing]
misclassification_rate = 0.0     # deterministic identities: the situation is about the weapons

# ---------------------------------------------------------------- the hostiles
# RAIDER (truth label only; the C2 calls it by its track): runs in from the sea at 15 m/s (29 kn),
# no AIS, and holds mid-strait 1.5 km west of the bridge, inside the engagement zone
# (sim/areas: ez-gate-west), from about 3:00, 1,740 m from BULL 1. At 3:15 it is ordered to open
# fire on HUNTER 1, some 1 km east of it (inside its gun's 2 km), from where it holds, and again a
# minute later, and again, in case an act is attributed below the threshold.
[[contact]]
id = "fastboat-first"
name = "First fast inshore attack craft without AIS, holding mid-strait west of the bridge"
affiliation = "hostile"
domain = "surface"
kind = "armed_fast_boat"
speed_mps = 15
motion = "transit"
route = [[-122.5250, 37.8080], [-122.4950, 37.8120]]
start_s = 5

[[order]]
at_s = 195
node = "fastboat-first"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "opens fire on the sensor ship (HUNTER 1)"

[[order]]
at_s = 255
node = "fastboat-first"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "fires on HUNTER 1 again"

[[order]]
at_s = 315
node = "fastboat-first"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "fires on HUNTER 1 a third time"

# The second boat comes in from 5:00 along the south side of the strait and holds 1,190 m from
# BULL 1, nearer the shore, from about 7:30, some 900 m from HUNTER 1. At 7:45 it is ordered to
# open fire on HUNTER 1, and again a minute later, and again.
