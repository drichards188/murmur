# Tutorial traffic (sim/situations/tutorial.toml): hostile-act-engagement's Golden Gate with the
# dead time cut out, so a person walked through the engagement chain meets each step soon after
# they reach it. Run by crates/murmur-contacts; format in crates/murmur-contacts/src/scenario.rs.
# Points are [lon, lat]. Fictional names and MMSIs, as in sim/scenarios/hostile-act-engagement.toml.
# Everything here is truth: the console only ever sees what our sensors make of it.
#
# What differs from hostile-act-engagement's traffic, and why (the rules, the policy, the
# platforms, the daylight clock and HUNTER 1's patrol leg are the same, sim/fleets/tutorial.toml):
# - The fast boat starts 800 m short of its holding point instead of 2.7 km out at sea, and stops
#   on it at about 1:18 instead of 3:22 (slowing at its kind's 1.5 m/s², bd murmur-2of4).
# - It is a fast inshore attack craft (sim/contacts.toml `armed_fast_boat`: it looks like a small
#   fast boat to our sensors until it fires), and it fires what it carries, by its own fire control
#   (docs/AUTONOMOUS-NODES.md, bd murmur-y85j.6): four ATGM-class missiles (250 m/s, 100 m to 5.5
#   km, 30 s to reload) and a 12.7 mm heavy machine gun (500 rounds in bursts of 6, 2 km). This
#   file only times its orders: at 1:15 it attacks HUNTER 1 with one missile, and again every 90 s
#   (13 orders to 19:15): its four missiles first, then two-burst episodes of its machine gun, from
#   where it holds (`stay`). Whenever the person reaches the step that waits for an attack, one has
#   come or comes within a minute and a half, from a real magazine (it never runs out in 20
#   minutes: 108 of its 500 rounds). Each missile is one act; each gun episode is one act (its
#   bursts within 30 s of each other). Our sensors may see a launch (HUNTER 1's ring camera always
#   has the boat in view: by day it sees nearly every launch and muzzle flash from its 0.9 to 1.2
#   km), a missile in flight (REAPER 1's radar about two flights in five, HUNTER 1's camera about
#   one in three, mostly in its last second; a gun's rounds never), and HUNTER 1 knows it was struck
#   3.6 to 4.8 s after a missile's launch, a second or two after a burst. A seen launch is attributed
#   from where the camera placed it; one attributed below the policy's threshold is flagged for
#   review, not declared, and the next is another chance. Once the boat is declared, the engine only
#   records the rest; once it is destroyed it leaves the scenario (`on_effect = "out_of_play"`, the
#   default) and a node that does not exist fires nothing (a missile already in flight flies on).
# - Two training aids, here only (`[training]`, refused in any other situation; docs/DECISIONS.md
#   11-03 and docs/AUTONOMOUS-NODES.md decision D5):
#   - every strike on the boat destroys it (`strike_outcome`, the owner's "pin as full kill"): the
#     person nominates, so the intent and even the weapon (REAPER 1 carries Hellfires and GBU-12s)
#     vary, and no seed could pin the damage model's draws (with seed 17 the default run's
#     Hellfire only took the boat's propulsion, and on other intents a strike can miss). The truth
#     log marks the strike `pinned`; the collateral around it is drawn;
#   - every strike on HUNTER 1 is drawn by the damage model with the boat's own figures and
#     recorded, never applied (`spared`): HUNTER 1 learns it was struck and goes on, so a person
#     new to the chain is not first taught a lost sensor ship. In any other situation the same
#     strikes can stop or sink it.
# - The run is 20 minutes, not 12, for a slow reader, so the traffic that would come near the
#   boat inside that time is moved or left out: the inbound container ship starts 5.7 km further
#   out at sea (at the holding area after some 29 minutes, not 15), the trawler leaves Fisherman's
#   Wharf at 6:00 (at the bridge after some 25 minutes), and the outbound bulk carrier (at the
#   bridge at 16 minutes) is not in it.
#
# Times (`start_s`, an order's `at_s`) count from the contacts process's start, a few seconds after
# the situation's clock (the link emulator's start). uids are the fleet's
# (sim/fleets/tutorial.toml, in hostile-act-engagement's order): 1 is HUNTER 1.
title = "Tutorial traffic"
seed = 17

[sensing]
misclassification_rate = 0.0     # deterministic identities: the tutorial is about the chain

[training]
strike_outcome = { fastboat-raider = "destroyed" }   # every strike on the boat destroys it
spared = [1]                                         # HUNTER 1: struck, drawn, never applied

# ---------------------------------------------------------------- the hostile
# A short run in at 15 m/s (29 kn), no AIS, to its holding point mid-strait 1.5 km west of the
# bridge, inside the engagement zone (sim/areas: ez-gate-west), where it stops at about 1:18;
# HUNTER 1 patrols 0.9 to 1.2 km east of it, inside both its missile's band (100 m to 5.5 km) and
# its machine gun's (2 km), so it never holds its fire for range (tested:
# eval/tests/test_situation.py, the tutorial's test).
[[contact]]
id = "fastboat-raider"
name = "Fast inshore attack craft without AIS, holding mid-strait west of the bridge"
affiliation = "hostile"
domain = "surface"
kind = "armed_fast_boat"
speed_mps = 15
motion = "transit"
route = [[-122.5040, 37.8105], [-122.4950, 37.8120]]
start_s = 5

# Its orders: attack HUNTER 1 every 90 s from where it holds, a missile at a time while it has
# them, then two bursts of its machine gun (12 rounds) at a time. It fires once it perceives HUNTER
# 1 (within its 5 km lookout reach and the horizon) and its weapon is ready: a second or two after
# each order.
[[order]]
at_s = 75
node = "fastboat-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "ATGM-class missile"
rounds = 1
stay = true
label = "fires a missile at the sensor ship (HUNTER 1)"

