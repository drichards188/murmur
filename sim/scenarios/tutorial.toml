# Tutorial traffic (sim/situations/tutorial.toml): hostile-act-engagement's Golden Gate with the
# dead time cut out, so a person walked through the engagement chain meets each step soon after
# they reach it. Run by crates/murmur-contacts; format in crates/murmur-contacts/src/scenario.rs.
# Points are [lon, lat]. Fictional names and MMSIs, as in sim/scenarios/hostile-act-engagement.toml.
# Everything here is truth: the console only ever sees what our sensors make of it.
#
# What differs from hostile-act-engagement's traffic, and why (the rules, the policy and the
# platforms are the same; the situation runs by day and HUNTER 1 patrols nearer the boat,
# sim/fleets/tutorial.toml):
# - The fast boat starts 800 m short of its holding point instead of 2.7 km out at sea, and holds
#   from about 1:00 instead of 3:03.
# - It fires on HUNTER 1 from 1:20, then every minute to the end (19 acts instead of 3): whenever
#   the person reaches the step that waits for an act, one has come or comes within a minute.
#   An act is attributed from what our sensors see; one attributed below the policy's threshold
#   is flagged for review, not declared, and the next is another chance. Once the boat is
#   declared, the engine only records the rest; once it is struck it leaves the scenario
#   (`on_effect = "out_of_play"`, the default) and an author that does not exist commits nothing.
# - The run is 20 minutes, not 12, for a slow reader, so the traffic that would come near the
#   boat inside that time is moved or left out: the inbound container ship starts 5.7 km further
#   out at sea (at the holding area after some 29 minutes, not 15), the trawler leaves Fisherman's
#   Wharf at 6:00 (at the bridge after some 25 minutes), and the outbound bulk carrier (at the
#   bridge at 16 minutes) is not in it.
#
# Times (`start_s`, an act's `at_s`) count from the contacts process's start, a few seconds after
# the situation's clock (the link emulator's start). uids are the fleet's
# (sim/fleets/tutorial.toml, in hostile-act-engagement's order): 1 is HUNTER 1.
title = "Tutorial traffic"
seed = 17

[sensing]
misclassification_rate = 0.0     # deterministic identities: the tutorial is about the chain

# ---------------------------------------------------------------- the hostile
# A short run in at 15 m/s (29 kn), no AIS, to its holding point mid-strait 1.5 km west of the
# bridge, inside the engagement zone (sim/areas: ez-gate-west), where it holds from about 1:00;
# HUNTER 1 patrols 0.9 to 1.2 km east of it.
[[contact]]
id = "fastboat-raider"
name = "Fast boat without AIS, holding mid-strait west of the bridge"
affiliation = "hostile"
domain = "surface"
kind = "small_fast_boat"
speed_mps = 15
motion = "transit"
route = [[-122.5040, 37.8105], [-122.4950, 37.8120]]
start_s = 5

[[act]]
