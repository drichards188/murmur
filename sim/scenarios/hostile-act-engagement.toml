# Hostile act to engagement traffic (sim/situations/hostile-act-engagement.toml, and
# hostile-act-loitering-munition's): ordinary traffic at the Golden Gate and one fast boat that
# fires on one of ours. Run by crates/murmur-contacts; format in
# crates/murmur-contacts/src/scenario.rs. Points are [lon, lat]. Routes and identities as in
# sim/scenarios/harbor-watch.toml (fictional names and MMSIs). Everything here is truth: the
# console and the AI only ever see what our sensors make of it.
#
# Times (`start_s`, an order's `at_s`) count from the contacts process's start, which
# scripts/up.sh starts with the bridge, a few seconds after the link emulator: a situation's
# clock counts from the emulator's start, so each comes a few seconds after the same number on
# the situation's clock. uids are the fleet's (sim/fleets/hostile-act-engagement.toml): 1 is
# HUNTER 1.
#
# The boat is a fast inshore attack craft (sim/contacts.toml `armed_fast_boat`: four ATGM-class
# missiles and a 12.7 mm heavy machine gun; it looks like a small fast boat to our sensors until
# it fires) and fires by its own fire control (docs/AUTONOMOUS-NODES.md, bd murmur-y85j.6): this
# file only orders it, at a second, to attack HUNTER 1 with a weapon it carries and how much of it
# to fire. Its shots fly and strike as truth; our sensors may see a muzzle flash (HUNTER 1's ring
# camera has the boat in view), never a gun's rounds in flight; the engine learns of the attack
# only through them and declares the boat hostile by rule when the act is attributed to one track
# at the policy's threshold (0.9) or more. Each strike on HUNTER 1 is drawn by the damage model
# with the gun's own figures (the Sea Hunter reads as a fishing vessel: hit 0.25 a burst, and of
# its hits 0.03 sink it and 0.17 stop it), so HUNTER 1 can be stopped or sunk; no seed is chosen
# to spare it (docs/AUTONOMOUS-NODES.md decision D4). The orders are an author's choice for a
# harassing attack the chain can follow: two bursts a minute, three times. Its four missiles are
# not ordered: a salvo of them (each a 0.25 chance of sinking HUNTER 1 at this range) would sink
# the sensor ship in about two runs in three before an engagement could be signed, and with it the
# chain (a lost friendly blocks the keep-out until an operator accepts it as lost).

title = "Hostile act to engagement traffic"
seed = 17

[sensing]
misclassification_rate = 0.0     # deterministic identities: the situation is about the chain

# ---------------------------------------------------------------- the hostile
# Runs in from the sea at 15 m/s (29 kn), no AIS, and holds mid-strait 1.5 km west of the bridge,
# inside the engagement zone (sim/areas: ez-gate-west), from about 3:03. At 3:20 it is ordered to
# open fire on HUNTER 1, patrolling 0.9 to 1.2 km east of it (inside its gun's 2 km), from where
# it holds: two 6-round bursts five seconds apart (one act, a firing episode), and again a minute
# later, and again. Each act is observed by whichever of ours see a muzzle flash, so if one is
# attributed below the threshold (a loose fix: flagged for review, not declared) the next is
# another chance; once the boat is declared, the engine only records the rest.
[[contact]]
id = "fastboat-raider"
name = "Fast inshore attack craft without AIS, in from the sea, holding mid-strait west of the bridge"
affiliation = "hostile"
domain = "surface"
kind = "armed_fast_boat"
speed_mps = 15
motion = "transit"
route = [[-122.5250, 37.8080], [-122.4950, 37.8120]]
start_s = 5

[[order]]
at_s = 200
node = "fastboat-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "opens fire on the sensor ship (HUNTER 1)"

[[order]]
at_s = 260
node = "fastboat-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "fires on HUNTER 1 again"

[[order]]
at_s = 320
node = "fastboat-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "12.7 mm HMG (DShK/NSV-class)"
rounds = 12
stay = true
label = "fires on HUNTER 1 a third time"

