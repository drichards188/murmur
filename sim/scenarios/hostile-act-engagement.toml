# Hostile act to engagement traffic (sim/situations/hostile-act-engagement.toml): ordinary
# traffic at the Golden Gate and one fast boat that fires on one of ours. Run by
# crates/murmur-contacts; format in crates/murmur-contacts/src/scenario.rs. Points are [lon, lat].
# Routes and identities as in sim/scenarios/harbor-watch.toml (fictional names and MMSIs).
# Everything here is truth: the console and the AI only ever see what our sensors make of it.
#
# Times (`start_s`, an act's `at_s`) count from the contacts process's start, which
# scripts/up.sh starts with the bridge, a few seconds after the link emulator: a situation's
# clock counts from the emulator's start, so each comes a few seconds after the same number on
# the situation's clock. uids are the fleet's (sim/fleets/hostile-act-engagement.toml): 1 is
# HUNTER 1.
#
# An act is an abstract event: a time, an author and a victim. Nothing models a weapon or
# damage. The engine learns of it only through our sensors (the bridge's sensing model decides
# which of ours observe it and where they place its author) and declares its author hostile by
# rule when the act is attributed to one track at the policy's threshold (0.9) or more.
title = "Hostile act to engagement traffic"
seed = 17

[sensing]
misclassification_rate = 0.0     # deterministic identities: the situation is about the chain

# ---------------------------------------------------------------- the hostile
# Runs in from the sea at 15 m/s (29 kn), no AIS, and holds mid-strait 1.5 km west of the bridge,
# inside the engagement zone (sim/areas: ez-gate-west), from about 3:03. Then it fires on HUNTER
# 1, patrolling 2 km east of it, and fires again a minute later, and again: each act is observed
# by whichever of ours see the boat (HUNTER 1's EO/IR places it within a few tens of metres), so
# if one is attributed below the threshold (a loose fix: flagged for review, not declared) the
# next is another chance; once the boat is declared, the engine only records the rest.
[[contact]]
id = "fastboat-raider"
name = "Fast boat without AIS, in from the sea, holding mid-strait west of the bridge"
affiliation = "hostile"
domain = "surface"
kind = "small_fast_boat"
speed_mps = 15
motion = "transit"
route = [[-122.5250, 37.8080], [-122.4950, 37.8120]]
start_s = 5

[[act]]
id = "act-1"
at_s = 205
by = "fastboat-raider"
against_vehicle = 1
label = "fires on the sensor ship (HUNTER 1)"

[[act]]
id = "act-2"
at_s = 265
by = "fastboat-raider"
against_vehicle = 1
label = "fires on HUNTER 1 again"

[[act]]
id = "act-3"
at_s = 325
by = "fastboat-raider"
against_vehicle = 1
label = "fires on HUNTER 1 a third time"

