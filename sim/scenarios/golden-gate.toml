# Golden Gate traffic: contacts that are not ours, for the Phase C2 sensing and tracks work.
# Run by crates/murmur-contacts (up.sh starts it when MURMUR_CONTACTS names this file).
# Format: crates/murmur-contacts/src/scenario.rs. Points are [lon, lat] (GeoJSON order, as
# tasks and areas), unlike fleet spawns. Routes approximate the real ferry runs and the
# deep-water shipping lane through the Gate; identities (names, MMSIs) are fictional.
# Everything here is truth: the console and agents only ever see what our sensors make of it.
title = "Golden Gate traffic"
seed = 7

[sensing]
misclassification_rate = 0.05    # a classifier is wrong this often, per track

