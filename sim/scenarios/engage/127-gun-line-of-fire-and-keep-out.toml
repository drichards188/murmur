# Rules 26 (bd murmur-lbw8.3): every safeguard holds per burst. As scenario 123, but the boat
# persists. The release (burst 1, 25 s) and burst 2 (30 s) go out. At 31 s a sailboat, protected
# (not declared), sails into the line of fire halfway between the UGV and the target: the picture
# still holds, but the burst's line_of_fire check fails, so the gun holds fire while it is there.
# At 41 s it has passed, and the burst due since 35 s goes out (burst 3). At 44 s one of our
# boats is reported 100 m from the effect point, inside the keep-out: the picture fails and the
# fire is stopped (`engage.stopped`, cause picture, the fallback commanded: hold). The engagement
# stays effected and is assessed from its last burst: persists.
title = "A gun holds fire across its line of fire and stops for a keep-out"
invariant = "keep_out_friendly"
attack = "bursts across a protected boat, and on while one of ours is inside the keep-out"
expect = "done"
expect_rule = "keep_out_friendly"
expect_assessment = "persists"
expect_stop = "picture"
expect_bursts = 3
expect_fire_end = "stopped"
expect_rounds_left = 482
after_effect = "persists"
end_s = 70

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "bull-1"
platform = "ugv_armed"      # an M2 (500 rounds, 1,800 m) and a Javelin; its sight covers the point
at = [-122.4950, 37.7990]   # on the shore (the runner's land: south of 37.800)

[[vehicle]]
uid = "hunter-1"
platform = "seahunter"      # one of ours, well clear until 44 s
at = [-122.5400, 37.8200]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west, 1,450 m north
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "bull-1"
track = "T-0001"
radius_m = 75
fallback = "abort"          # hold where it is
window_s = 600
weapon = "M2 .50 HMG"

[[step]]
at_s = 2
action = "expect"
state = "pending_approval"
weapon = "named: M2 .50 HMG, a gun for ground and surface and air targets, 0 to 1800 m, bursts of 6 rounds every 5 s; 500 of 500 rounds left; against a small_fast_boat, as estimated: a hit 0.20 in good conditions"

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"

# a protected sailboat crosses the line of fire: fire held
[[step]]
at_s = 31
action = "track"
id = "T-0002"
at = [-122.4950, 37.8055]   # halfway along the line from the UGV to the target
affiliation = "neutral"
identity = "sailboat"
identity_confidence = 0.9

[[step]]
at_s = 41
action = "track"
id = "T-0002"
at = [-122.5150, 37.8055]   # past, 1.8 km west of the line

# one of ours inside the keep-out: the fire is stopped
[[step]]
at_s = 44
action = "vehicle"
uid = "hunter-1"
at = [-122.4939, 37.8120]   # 100 m east of the effect point
