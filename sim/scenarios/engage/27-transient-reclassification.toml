# One plan for every signature (second review, P4). The target is reclassified as a ferry
# for two seconds while op-2's signature waits: the plan was frozen on a small fast boat,
# so the signatures are dropped, and op-2 signs again once it is a small fast boat again.
# Afterwards the reset is cut from the log; replay catches op-2 signing twice. (Cutting
# op-2's first signature, its picture and the reset all together leaves a consistent log:
# only an external anchor of the head hash shows that rewrite, docs/DECISIONS.md.)
title = "A transient reclassification while a signature waits"
invariant = "signed_picture"
attack = "the identity flips and back while one signature waits; the log hides the reset"
expect = "done"
expect_assessment = "ceased"
expect_reset = true
tamper = "drop_reset"
end_s = 260

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[agent]]
id = "agent-planner"

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.495, 37.812]
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 900

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 6
action = "track"
id = "T-0001"
identity = "ferry"

[[step]]
at_s = 7
action = "expect"
state = "pending_approval"
concurrences = 0

[[step]]
at_s = 8
action = "track"
id = "T-0001"
identity = "small_fast_boat"

[[step]]
at_s = 10
action = "approve"
by = "op-2"

[[step]]
at_s = 12
action = "approve"
by = "op-3"

[[step]]
at_s = 13
action = "expect"
state = "dispatched"
