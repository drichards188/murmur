# Rules 34, stage 4 (docs/SWARMS.md section 4.3; bd murmur-4nik): a member back after a drop
# rejoins at the next re-form, never by itself. Ten quadcopters orbit a 150 m ring on op-1's
# order (the minimum eight). SKY 3 and SKY 8 fall silent; their drops settle and the group
# re-forms round the eight left. Then both are heard again: back once heard thirty seconds
# running, they wait for the next re-form (at most one a minute, once their return has settled),
# which places each in a gap on a member order of its own. The log is then attacked: the first
# re-form's first moved member's altitude raised 200 m, out of its band, in the re-form, its
# member order and its dispatch alike; replay, which lays every re-form out again from its facts,
# must catch it.
title = "Two members back after a drop rejoin at the next re-form, not before"
invariant = "group_order"
attack = "a re-formed share outside the band (reform_outside_envelope)"
expect = "dispatched"
tamper = "reform_outside_envelope"
end_s = 125
min_rules = 34
expect_groups = ['re-formed 1: moved ["sky-10", "sky-6"]', 're-formed 2: moved ["sky-3", "sky-8"]']

