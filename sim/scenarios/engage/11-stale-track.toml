# Recency: the sensors lost the target 30 s ago (its uncertainty has grown since); the
# nomination is rejected (target_recency, target_uncertainty).
title = "Nominate on a stale track"
invariant = "target_recency"
attack = "nominate on a track nobody has detected for 30 s"
expect = "rejected"
expect_rule = "target_recency"
end_s = 20

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
age_s = 30
silent = true
sources = ["3:radar"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
