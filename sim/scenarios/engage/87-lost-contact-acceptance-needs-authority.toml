# Rules 16: accepting a lost contact is an engagement decision. A fishing boat 1.5 km north of
# the target goes out of view; op-1 nominates while its stale track does not block yet; the
# tracker drops it. op-4 (no engagement authority, not the proposer) tries to accept the lost
# contact for the waiting nomination: refused (the engine takes only an EngagementAuthority;
# the bridge answers 403). op-4's own nomination accepting it is refused whole. op-2 then signs
# on the picture as it is: the lost contact's reach, grown since its last fix, covers the effect
# point, and the approval is void (keep_out_tracks).
title = "An acceptance of a lost contact needs engagement authority"
invariant = "keep_out_tracks"
attack = "op-4 (no engagement authority) accepts a lost contact for a waiting nomination, and nominates accepting it"
expect = "voided"
expect_rule = "keep_out_tracks"
expect_refusals = ["op-4: accepting a lost contact needs engagement authority", "op-4: accepting a lost contact needs engagement authority (nomination refused)"]
end_s = 200

[[operator]]
id = "op-1"
engage = true
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true
[[operator]]
id = "op-4"                 # no engagement authority

[[vehicle]]
uid = "blade-1"
platform = "switchblade"
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[track]]
id = "T-0002"
at = [-122.4950, 37.8255]   # 1.5 km north of the target
affiliation = "neutral"
identity = "fishing_vessel"
identity_confidence = 0.8
sources = ["3:radar"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "track"
id = "T-0002"
silent = true

[[step]]
at_s = 2
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 3
action = "expect"
state = "pending_approval"

[[step]]
at_s = 181
action = "drop_track"
track = "T-0002"

[[step]]
at_s = 185
action = "accept"
by = "op-4"
track = "T-0002"

[[step]]
at_s = 186
action = "nominate"
by = "op-4"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
accept_lost = ["T-0002"]

[[step]]
at_s = 190
action = "approve"
by = "op-2"
