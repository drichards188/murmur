# One plan for every signature. op-2 looks at the picture at s=2 and signs at s=20 on that
# token: expired (15 s), refused. Signing on a fresh one freezes the plan (effect point and
# time). op-3 looks at it; then the target jumps about 880 m west (still a valid
# nomination where it is now): the frozen plan no longer holds (the track is predicted far
# from the plan's point at its time), so every signature is dropped with the plan
# (approval.reset). op-3's signature on the token from before the reset is refused; on a
# fresh one it freezes a new plan, and op-2 signs that one. Afterwards the reset is cut
# from the log with a recomputed chain; replay must catch signatures on two plans.
title = "The target moves between signatures"
invariant = "signed_picture"
attack = "a signer quotes an expired picture; the track moves between signatures; a signer quotes a picture of the dropped plan; the log hides the reset"
expect = "done"
expect_assessment = "ceased"
expect_refusals = ["expired", "dropped"]
expect_reset = true
tamper = "drop_reset"
end_s = 260

