# Keep-out, all domains: one of our AUVs is working 150 m from the target. The nomination is
# rejected (keep_out_friendly) before anyone can approve it.
title = "A friendly submarine is near the target"
invariant = "keep_out_friendly"
attack = "nominate while our own AUV is inside the keep-out"
expect = "rejected"
expect_rule = "keep_out_friendly"
end_s = 20

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km
at = [-122.4700, 37.8160]

[[vehicle]]
uid = "remus-1"
platform = "remus"
at = [-122.4950, 37.8133]   # 150 m north of the target, under water

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
