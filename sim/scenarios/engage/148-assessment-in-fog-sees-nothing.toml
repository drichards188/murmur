# Rules 32 (bd murmur-ahss): scenario 131's engagement in fog of 50 m visibility. The armed UGV on
# the shore south of the bridge launches its Javelin at a boat 1,450 m north, declared hostile. On
# a clear day its sight covers the effect point for the assessment (the catalog's clear-day reach,
# 13,310 m for a surface contact), and the strike is assessed ceased. In this fog its reach now
# (the vehicle fact `reach_now`, as the bridge computes it from the physical model where it
# stands) is about 156 m: no sensor of ours covers the point, nothing is seen there, and after the
# assessment window the strike is assessed unknown, never ceased. Rules 31 (`--rules 31`) read the
# clear-day reach and assessed it ceased, the point counted covered by a sight that saw nothing in
# the fog. The engagement's other decisions log no reach now (they do not read it); its observation
# steps log it, so replay recomputes each from the reaches it read. The tamper makes every reach
# now in the log a hundred times as long: replay recomputes the observations and catches it.
title = "An assessment in fog counts no cover from a sight that sees nothing"
invariant = "assessment"
attack = "the effect point covered only by a sight the fog blinds"
expect = "done"
expect_assessment = "unknown"
reaches = "physical"
min_rules = 32
tamper = "edit_reach"
end_s = 180

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "bull-1"
platform = "ugv_armed"      # an M2 and one Javelin
callsign = "BULL 1"
at = [-122.4950, 37.7990]   # on the shore (the runner's land: south of 37.800)
alt_m = 20                  # its altitude, for the missile's slant range
# in fog of 50 m visibility (the bridge's figures for the armed UGV 20 m up)
reach_now = { alt_m = 20, visibility_m = 50, sun_elevation_deg = 30, sensors = [{ type = "eo_ir", detect_m = { air = 0, ground = 156, surface = 156 }, identify_m = { air = 0, ground = 157, surface = 157, size_class = { small_air = 0, large_air = 0, small_surface = 157, large_surface = 158, small_ground = 157, large_ground = 157 } }, thermal = true }] }

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west, 1,450 m north
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "bull-1"
track = "T-0001"
radius_m = 75
fallback = "abort"          # hold where it is
window_s = 600
weapon = "FGM-148 Javelin"

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
