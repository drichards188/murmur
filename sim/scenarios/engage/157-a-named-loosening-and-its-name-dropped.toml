# Rules 33 (docs/SCENARIO-SETTINGS.md, "a floor no scenario loosens silently"): a drill's policy
# lowers the engagement bar to 0.5 and names that loosening with its reason (`loosened`,
# policies/drill-bar-050.toml), logged with the policy in run.started. A boat identified at 0.55 is
# declared hostile and nominated: under this policy it passes the identity check, its words naming
# the bar it met, and the engagement runs to its assessment. The tamper drops `loosened` from the
# logged policy, as if the policy held the bar without saying it was loosened: replay checks the
# logged policy's loosenings against the code's own values and catches it.
title = "A named loosening of the engagement bar, and its name dropped from the log"
invariant = "audit"
attack = "the policy's named loosening cut from run.started"
expect = "done"
expect_assessment = "ceased"
policy = "sim/scenarios/engage/policies/drill-bar-050.toml"
min_rules = 33
tamper = "drop_loosened"
end_s = 200

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.55
sources = ["3:radar", "blade-1:eo_ir"]
level = "identify"
level_by = ["blade-1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
