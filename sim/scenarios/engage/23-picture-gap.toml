# The picture is held every second or not at all. Dispatched, the bridge's loop stalls for
# 10 s (no engagement step): at the next step the gap is beyond max_picture_gap_s (5 s) and
# the engagement aborts with its fallback (picture_gap), before anything else is looked at.
# Replay recomputes the gap from the logged picture times.
title = "The picture is not held for 10 s"
invariant = "picture_gap"
attack = "the loop that holds the picture stops for 10 s after dispatch"
expect = "aborted"
expect_rule = "picture_gap"
end_s = 60

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[agent]]
id = "agent-planner"

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"

[[step]]
at_s = 15
action = "stall"
seconds = 10

[[step]]
at_s = 30
action = "expect"
state = "aborted"
