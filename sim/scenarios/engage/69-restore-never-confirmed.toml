# Rules 7 (murmur-85l), the bound: a restore that never confirms holds a mission no longer
# than any order waits for an unreachable vehicle. As 68, but the platform never answers the
# restore of its own lost-link values. The operator's orbit waits in the queue; a human's
# approval is held there at most 120 s, then it goes back to the inbox saying why (its own
# failsafe not confirmed back), never silently stuck. A hold the operator gives meanwhile is
# never held for the restore: it goes out at once.
title = "A restore that never confirms sends the waiting mission back to a human"
invariant = "restore_owed"
attack = "a platform that never confirms its own lost-link values back"
expect = "aborted"
expect_stop = "operator"
expect_preload = ["set confirmed"]
restore_after_s = 100000
end_s = 170

[[operator]]
id = "op-1"                 # nominates, aborts, orders the orbit and the hold
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "viper-1"
platform = "magura"         # armed USV (ArduRover), LEO SATCOM: a 30 s lost-link timer
at = [-122.4700, 37.8160]
lost_link_s = 30

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "viper-1"
track = "T-0001"
radius_m = 75
fallback = "loiter"
window_s = 600

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 30
action = "abort"
by = "op-1"

[[step]]
at_s = 35
action = "task"
by = "op-1"
task = "orbit"
uids = ["viper-1"]
center = [-122.4600, 37.8160]
radius_m = 150

[[step]]
at_s = 154
action = "expect"
task_state = "queued"

[[step]]
at_s = 156                  # 120 s after the approval: back to a human, saying why
action = "expect"
task_state = "pending_approval"
task_reason = "lost-link failsafe"

[[step]]
at_s = 160
action = "task"
by = "op-1"
task = "hold"
uids = ["viper-1"]

[[step]]
at_s = 161
action = "expect"
task_state = "dispatched"
