# Rules 6: a protected track is predicted along its velocity with its tracker's 1-sigma, a
# 1 m/s velocity error and acceleration noise (0.2 m/s^2 on the surface), not the tracker's
# 0.3 x speed growth. A 20 m/s ferry crossing 1.4 km north of the effect point at about the
# effect time blocked under rules 4 (2-sigma of 15 + 6 m/s x 104 s: 1.28 km) and is clear
# under rules 6 (2-sigma about 320 m); the hold after approval and the release still read it
# every second.
title = "A distant fast ferry no longer blocks"
invariant = "keep_out_tracks"
attack = "a 20 m/s ferry passes 1.4 km from the effect point near the effect time"
expect = "done"
expect_assessment = "ceased"
end_s = 200

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]
# no altitude estimate for it

[[track]]
id = "T-0002"
at = [-122.4711, 37.8246]   # 1.4 km north of the target's latitude, 2.1 km east
velocity = [-20.0, 0.0]     # west at 20 m/s (39 kt): over the target's longitude in ~105 s
affiliation = "neutral"
identity = "ferry"
identity_confidence = 0.9
sources = ["ais"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
