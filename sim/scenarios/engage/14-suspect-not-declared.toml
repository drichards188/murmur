# Hostile is declared, never inferred: the tracker estimates the fast boat as suspect (no
# AIS, implausible speed), but no operator declared it hostile; the nomination is rejected
# (target_declared).
title = "Nominate an inferred suspect"
invariant = "target_declared"
attack = "nominate a track only the tracker calls suspect"
expect = "rejected"
expect_rule = "target_declared"
end_s = 20

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
