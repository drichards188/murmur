# The frozen plan still drops on a real deviation (third review: liveness without losing
# integrity). The target holds when op-2 signs; at s=10 it gets under way at 6 m/s: carried
# to the plan's time that is far beyond the tolerance and the bounded allowance for
# velocity uncertainty, so the signature is dropped at once. op-3 and op-2 sign a new plan.
title = "The target gets under way while a signature waits"
invariant = "signed_picture"
attack = "a holding target starts moving at 6 m/s between the signatures"
expect = "done"
expect_assessment = "ceased"
expect_reset = true
end_s = 300

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.495, 37.812]
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 200
fallback = "return"
window_s = 600

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 10
action = "track"
id = "T-0001"
velocity = [-6.0, 0.0]

[[step]]
at_s = 11
action = "expect"
state = "pending_approval"
concurrences = 0

[[step]]
at_s = 12
action = "approve"
by = "op-3"

[[step]]
at_s = 14
action = "approve"
by = "op-2"

[[step]]
at_s = 15
action = "expect"
state = "dispatched"
