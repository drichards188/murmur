# Rules 26 (bd murmur-lbw8.3): a gun's rounds run out inside its approved window. The armed UGV
# stands 2,000 m south of a boat holding west of the bridge, declared hostile, beyond its M2's reach
# less the effect radius (1,725 m): the plan sends it 275 m north to its firing position, where it
# holds and fires. The boat persists (no burst hurts it here): a 6-round burst every 5 s, each
# re-checked, until the 84th fires the last 2 of its 500 rounds. The fire ends on its own
# (`engage.fire_ended`, rounds_out) long before the window closes, and the assessment from the
# last burst says persists. The rounds stay spent: a nomination naming the M2 is then refused.
title = "A gun's rounds run out inside its window"
invariant = "weapon"
attack = "bursts fired beyond the rounds the magazine holds"
expect = "rejected"
expect_rule = "weapon"
expect_bursts = 84
expect_fire_end = "rounds_out"
expect_rounds_left = 0
after_effect = "persists"
end_s = 560

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "bull-1"
platform = "ugv_armed"      # an M2 (500 rounds, 1,800 m) and a Javelin; its sight covers the point
at = [-122.4950, 37.7940]   # on the shore, 2,000 m south of the boat (the runner's land)

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "bull-1"
track = "T-0001"
radius_m = 75
fallback = "abort"          # hold where it is
window_s = 600
weapon = "M2 .50 HMG"

[[step]]
at_s = 2
action = "expect"
state = "pending_approval"
weapon = "named: M2 .50 HMG, a gun for ground and surface and air targets, 0 to 1800 m, bursts of 6 rounds every 5 s; 500 of 500 rounds left; against a small_fast_boat, as estimated: a hit 0.20 in good conditions"

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"

[[step]]
at_s = 540
action = "expect"
state = "done"

# the magazine is empty: a new nomination naming the gun is refused
[[step]]
at_s = 541
action = "nominate"
by = "op-1"
platform = "bull-1"
track = "T-0001"
radius_m = 75
fallback = "abort"
window_s = 600
weapon = "M2 .50 HMG"

[[step]]
at_s = 542
action = "expect"
state = "rejected"
rule = "weapon"
weapon = "M2 .50 HMG has no round left (500 of 500 released): the nomination names it"
