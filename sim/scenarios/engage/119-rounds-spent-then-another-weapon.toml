# Rules 24 (bd murmur-lbw8.1): the armed MQ-9B's loadout is four AGM-114R Hellfire II and two
# GBU-12 Paveway II. op-1 nominates it against three boats holding west of the bridge, each
# declared hostile, naming the GBU-12 for the first two: each is released within the bomb's slant
# range (1,000 to 14,800 m) and strikes a flight of some 40 s later (200 m/s), and each spends a
# round (2 of 2, then 1 of 2 left, logged with the engage.effect). A third nomination naming the
# GBU-12 is refused: no round left. The same nomination naming none is taken: the engine picks
# the Hellfire, the first of the loadout (in the catalog's order) usable against a surface target
# with a round left, and says so. Then the log is forged so that each release left one more round than it
# spent; replay recomputes the rounds from the releasing picture and catches it.
title = "Rounds spent, then the engine picks another weapon"
invariant = "audit"
attack = "a release logged as if it had not spent its round"
expect = "pending_approval"
tamper = "edit_rounds"
end_s = 230

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "reaper-1"
platform = "mq9b_armed"     # 4 x AGM-114R, 2 x GBU-12; EO/IR 40 km covers each point
at = [-122.5250, 37.8000]   # off Lands End, west of the bridge
alt_m = 7600                # its cruise altitude

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[track]]
id = "T-0002"
at = [-122.5050, 37.8200]   # holding 1.3 km north-west of it
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[track]]
