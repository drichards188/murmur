# Rules 34 (docs/SWARMS.md section 3.3, the separation rule): where the layout cannot keep members
# apart inside their band, the group is refused with the most that fit. Twelve quadcopters on an
# 8 m ring at 100 m are 4 m apart; to keep 15 m apart five neighbours in a row need five layers 10 m
# apart (six round the wrap from the last to the first), but their band ends at 120 m above the
# ground: three layers, two a layer, six in all. Section 8 sets this case with fixed-wing stations
# along a route, whose transit kind is a later stage's; the rule is the same.
title = "A ring too tight for its band is refused with the most that fit"
invariant = "separation"
attack = "more members than the band's layers hold"
expect = "rejected"
expect_rule = "separation"
end_s = 3
min_rules = 34

