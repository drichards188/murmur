# Rules 30 (docs/NODE-LOSS.md section 3, bd murmur-zb1d.2): as 137, HUNTER 1 falls silent on its
# patrol leg 1.3 km east of a hostile boat, but its home is 0.9 km west of the boat. Its own
# lost-link failsafe is an rtl: if it lost us too, it steers straight home from wherever it was on
# its way, across the effect point. The patrol alone would clear the keep-out by 0.9 km; its way
# home does not, so the nomination is refused, the check saying which way of its blocks (its
# failsafe's way home), and the keep-out's explanation saying waiting clears nothing while it is
# silent (tests/rules30_prediction.rs reads it).
title = "A silent patroller's way home crosses the keep-out"
invariant = "keep_out_friendly"
attack = "one of ours falls silent on a patrol whose way home crosses the target"
expect = "rejected"
expect_rule = "keep_out_friendly"
min_rules = 30
end_s = 70

[[operator]]
id = "op-1"
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"
at = [-122.4700, 37.8160]

[[vehicle]]
uid = "hunter-1"
platform = "seahunter"
at = [-122.4800, 37.8130]   # the patrol leg's south end
home = [-122.5050, 37.8120] # west of the target, in the strait's mouth
callsign = "HUNTER 1"
lost_link = { action = "rtl", timer_s = 5, source = "read" }

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 0
action = "task"
by = "op-1"
task = "patrol"
uids = ["hunter-1"]
route = [[-122.4800, 37.8175], [-122.4800, 37.8130]]

[[step]]
at_s = 1
action = "expect"
task_state = "dispatched"

[[step]]
at_s = 3
action = "vehicle"
uid = "hunter-1"
silent = true

[[step]]
at_s = 60
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
