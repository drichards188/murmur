# Rules 35 (docs/SALVO.md, section 4): as scenario 174, then the policy in run.started is forged
# with a ceiling six rounds higher (as if the file had allowed what the signers' plan was not
# signed under). Replay holds each plan to the ceiling it was signed under and the logged
# policy's, and they no longer agree.
title = "A ceiling edited in the logged policy"
invariant = "audit"
attack = "a policy logged with a higher ceiling than the plan was signed under"
expect = "done"
expect_assessment = "ceased"
expect_rounds = 3
cease_at_round = 3
tamper = "edit_ceiling"
policy = "sim/scenarios/engage/policies/salvo-ceiling-6.toml"
min_rules = 35
end_s = 300
[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "hive-1"
platform = "ugv_launcher"   # 18 rounds of the HIV3-class launcher; its sight covers the point
autopilot = "ugv"           # a stand-in rover: the heartbeat says so, the catalog's stand-in entry does not
at = [-122.4950, 37.7960]   # on the shore, 1,800 m south of the boat (the runner's land)
alt_m = 10

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "hive-1"
track = "T-0001"
radius_m = 75
fallback = "abort"          # hold where it is
window_s = 600
weapon = "HIV3-class launcher"
rounds = 3

[[step]]
at_s = 2
action = "expect"
state = "pending_approval"

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
