# Rules 5: the same lost quadcopter, but the nominating operator accepts, explicitly, that its
# position is unknown since its last report (engage.accepted, logged before the checks with
# the report it names). The friendly keep-out leaves it out, says so, and two signers sign
# the plan that shows it. Afterwards the acceptance is cut from the log; replay finds every
# decision reading an acceptance that was never made.
title = "An operator accepts a lost friendly's unknown position"
invariant = "keep_out_friendly"
attack = "the operator's acceptance is cut from the log"
expect = "done"
expect_assessment = "ceased"
tamper = "drop_acceptance"
end_s = 260

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[vehicle]]
uid = "drone-1"
platform = "x10"            # one of ours, 12 m/s cruise
at = [-122.4723, 37.8120]   # 2 km east of the target

[[step]]
at_s = 0
action = "vehicle"
uid = "drone-1"
silent = true               # its link is cut: lost from here on

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]
# no altitude estimate for it

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 60
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
accept = ["drone-1"]      # "drone-1 position unknown since its last report: accept"

[[step]]
at_s = 64
action = "approve"
by = "op-2"

[[step]]
at_s = 67
action = "approve"
by = "op-3"

[[step]]
at_s = 68
action = "expect"
state = "dispatched"
