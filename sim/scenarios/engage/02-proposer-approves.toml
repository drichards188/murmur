# Two-person rule: an operator with engagement authority nominates, then tries to approve
# their own nomination (refused, logged as approval.refused); the first other approver signs
# (1 of 2) and tries to sign again (refused: already signed); a second distinct approver
# completes it. Afterwards the log is forged so the final approval names the proposer;
# replay must flag the two-person violation.
title = "The proposer approves their own nomination"
invariant = "two_person"
attack = "the proposer signs their own nomination; one approver signs twice; the log is forged to name the proposer as approver"
expect = "done"
expect_assessment = "ceased"
expect_refusals = ["may not approve it", "has already signed it"]
tamper = "proposer_approval"
end_s = 200

[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true
[[operator]]
id = "op-4"
engage = true

[[vehicle]]
