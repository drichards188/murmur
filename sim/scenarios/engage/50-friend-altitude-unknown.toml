# Rules 5, fail closed on missing data: the same MALE aircraft circling over the target,
# but its altitude is not reported. A 3D keep-out needs both altitudes; with one unknown it
# stays 2D (no ceiling) for that vehicle, which blocks.
title = "A friendly above the effect with an unknown altitude blocks"
invariant = "keep_out_friendly"
attack = "one of our aircraft circles over the target without reporting its altitude"
expect = "rejected"
expect_rule = "keep_out_friendly"
end_s = 20

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[vehicle]]
uid = "reaper-1"
platform = "mq9b"           # one of ours, MALE; its altitude is not reported
at = [-122.4950, 37.8255]   # on a 1.5 km circle around the target
velocity = [60.0, 0.0]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]
alt_m = 0                   # on the surface (radar, EO/IR)

[[step]]
at_s = 0
action = "vehicle"
uid = "reaper-1"
circling = [-122.4950, 37.8120, 1500]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
