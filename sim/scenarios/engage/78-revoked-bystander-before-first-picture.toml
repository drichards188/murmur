# Rules 9: a revoked bystander before the engagement's first picture (review of 10-05, fix
# 5). As scenario 77: op-1 declares the fast boat T-0001 hostile; T-0002, 250 m from it, is
# declared hostile by rule on an act against our patrol USV and confirmed by op-2, which
# exempts it from the keep-out of the second nomination on T-0001. This time op-3 revokes
# T-0002's declaration in the same second the second signature approves the engagement,
# before any picture of it was logged: the revocation names it and stops it in its own step,
# cause revoked (before the fix it was not named, and a later picture stopped it, cause
# picture). Afterwards the stop is cut from the log; replay must catch it.
title = "A bystander revoked before the engagement's first picture stops it, cause revoked"
invariant = "keep_out_tracks"
attack = "a keep-out-exempt bystander's declaration revoked as the engagement is approved, before its first picture; the stop cut from the log"
expect = "voided"
expect_rule = "keep_out_tracks"
expect_stop = "revoked"
expect_ident = [
    "declared T-0001 hostile by op-1",
    "declared T-0002 hostile by rule:hostile_act",
    "confirmed T-0002 by op-2",
    "revoked T-0002 by op-3 (stopping [i2])",
]
tamper = "drop_revocation_stop"
end_s = 200

[[operator]]
id = "op-1"                 # declares and nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"
at = [-122.4700, 37.8160]

[[vehicle]]
uid = "usv-1"
platform = "seahunter"
at = [-122.4820, 37.8090]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
truth = "hostile"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["usv-1:radar", "blade-1:eo_ir"]

[[track]]
id = "T-0002"
at = [-122.4950, 37.81425]  # 250 m north of it, holding
affiliation = "suspect"
truth = "hostile"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["usv-1:radar", "blade-1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 2
action = "act"
by_track = "T-0002"
against_vehicle = "usv-1"
sensors = ["blade-1:eo_ir", "usv-1:radar"]
sigma_m = 26

[[step]]
at_s = 4
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 5
action = "expect"
state = "rejected"
rule = "keep_out_tracks"

[[step]]
at_s = 7
action = "confirm_declaration"
by = "op-2"
track = "T-0002"

[[step]]
at_s = 9
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 13
action = "approve"
by = "op-2"

[[step]]
at_s = 16
action = "approve"
by = "op-3"

[[step]]
at_s = 16
action = "revoke_declaration"
by = "op-3"
track = "T-0002"
note = "T-0002 is a ferry; the act was misattributed"
