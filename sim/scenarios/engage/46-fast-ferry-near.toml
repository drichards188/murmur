# Rules 6: the same 20 m/s ferry crossing 500 m north of the effect point still blocks: its
# 2-sigma (about 320 m) reaches inside the 275 m keep-out. The tuning narrows how far a
# predictable track blocks; it does not let one through the keep-out.
title = "A nearby fast ferry still blocks"
invariant = "keep_out_tracks"
attack = "a 20 m/s ferry passes 500 m from the effect point near the effect time"
expect = "rejected"
expect_rule = "keep_out_tracks"
end_s = 20

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]
# no altitude estimate for it

[[track]]
id = "T-0002"
at = [-122.4711, 37.8165]   # 500 m north of the target's latitude, 2.1 km east
velocity = [-20.0, 0.0]
affiliation = "neutral"
identity = "ferry"
identity_confidence = 0.9
sources = ["ais"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
