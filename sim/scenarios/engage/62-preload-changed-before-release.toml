# Rules 5: the preload is read again near the release. The platform confirmed its lost-link
# action as the fallback at dispatch, but by the re-read (every 5 s from 30 s before the
# release window opens) another station has changed its lost-link action. The re-read does
# not confirm (engage.preload verify): the engagement stops with its fallback, nothing is
# released, and the platform's own values go back. Afterwards the re-read is cut from the
# log; replay finds a stop quoting a change the platform never reported.
title = "A preload changed before the release stops the engagement"
invariant = "fallback_preload"
attack = "the platform's lost-link action is changed after the preload confirmed; the re-read is cut from the log"
expect = "aborted"
expect_preload = ["set confirmed", "verify changed", "restore confirmed"]
preload = "changed"
tamper = "drop_verify"
end_s = 200

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"
