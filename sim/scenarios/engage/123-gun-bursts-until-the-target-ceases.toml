# Rules 26 (bd murmur-lbw8.3): a gun fires bursts from its counted magazine until the target
# ceases. The armed UGV stands on the shore south of the bridge, 1,450 m from a boat holding inside
# ez-gate-west, declared hostile. op-1 nominates it naming its M2: the plan's firing position is
# where the UGV stands (within the gun's 1,800 m less the 75 m effect radius), so it holds there.
# Two signatures, and the release is the first burst (6 rounds); a burst follows every 5 s while
# the picture holds, each spending its 6 rounds. The boat stops being detected at the third burst
# (out of play): the next picture holds fire on a target unseen, nothing more goes out, and the
# assessment, judged from the last burst, says ceased once the UGV's sight has covered the point
# 15 s. 3 bursts, 18 rounds, 482 of 500 left. Then the log is forged so that every burst left one
# more round than it fired: replay recomputes the rounds from each burst's picture and catches it.
title = "A gun fires bursts until the target ceases"
invariant = "audit"
attack = "bursts logged as if they had not spent their rounds"
expect = "done"
expect_assessment = "ceased"
expect_bursts = 3
expect_fire_end = "ceased"
expect_rounds_left = 482
cease_at_burst = 3
tamper = "edit_rounds"
end_s = 90

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "bull-1"
platform = "ugv_armed"      # an M2 (500 rounds, 1,800 m) and a Javelin; its sight covers the point
at = [-122.4950, 37.7990]   # on the shore (the runner's land: south of 37.800)

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west, 1,450 m north
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "bull-1"
track = "T-0001"
radius_m = 75
fallback = "abort"          # hold where it is
window_s = 600
weapon = "M2 .50 HMG"

[[step]]
at_s = 2
action = "expect"
state = "pending_approval"
weapon = "named: M2 .50 HMG, a gun for ground and surface and air targets, 0 to 1800 m, bursts of 6 rounds every 5 s; 500 of 500 rounds left; against a small_fast_boat, as estimated: a hit 0.20 in good conditions"

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
