# Rules 6: the nominal chain with the preload: set and read back a second after dispatch,
# the effect released, the platform's own values put back. Then the log is forged to drop
# the preload report (as if the release had not needed it); replay recomputes the release
# picture without a confirmed preload and catches it.
title = "The preload report is cut from the log"
invariant = "fallback_preload"
attack = "drop the platform's preload report from the log of a released engagement"
expect = "done"
expect_assessment = "ceased"
expect_preload = ["set confirmed", "restore confirmed"]
tamper = "drop_preload"
end_s = 200

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]
# no altitude estimate for it

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
