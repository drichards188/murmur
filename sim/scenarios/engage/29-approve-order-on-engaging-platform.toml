# An approval that would stop an engagement says so (second review, item 6). With
# blade-1's engagement waiting for its second signature, an agent's hold on blade-1 waits
# for a human (an engagement is in play). op-1 approves it without acknowledging that its
# dispatch stops the engagement: refused. Acknowledging it, the hold is dispatched and the
# engagement is superseded. Afterwards the acknowledgement is cut from the log; replay
# catches an approval that stops an engagement it did not acknowledge.
title = "Approving an order that would stop an engagement"
invariant = "engagement_in_play"
attack = "an operator approves an agent's order on the engaging platform without acknowledging it stops the engagement"
expect = "voided"
expect_refusals = ["acknowledge"]
tamper = "drop_ack"
end_s = 30

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[agent]]
id = "agent-planner"

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.495, 37.812]
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 900

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 6
action = "task"
agent = "agent-planner"
rationale = "hold blade-1 where it is"
task = "hold"
uids = ["blade-1"]

[[step]]
at_s = 7
action = "expect"
task_state = "pending_approval"

[[step]]
at_s = 8
action = "approve_task"
by = "op-1"

[[step]]
at_s = 9
action = "expect"
task_state = "pending_approval"
state = "pending_approval"

[[step]]
at_s = 10
action = "approve_task"
by = "op-1"
acknowledge = true

[[step]]
at_s = 11
action = "expect"
task_state = "dispatched"
state = "voided"
