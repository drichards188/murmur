# Rules 17 (murmur-k8i item 2): the armed USV waits in Richardson Bay, north-east of the Marin
# shore's corner (the runner's land: Marin north of 37.832 and west of -122.46). Its straight way
# to the strait west of the bridge runs across the Marin shore. Before rules 17 the domain rule
# judged only waypoints: the orbit west of the bridge went out (`--rules 16`: dispatched) and the
# nomination waited for its signers, and a boat sent so drives ashore (the F7-F13 dev check's
# Magura ran aground in 34 to 39 of each family's 40 episodes). From rules 17 the rule judges
# land or water every 20 m along each leg: the orbit is refused for its transit leg, and so is the
# nomination, each saying where the leg reaches land.
# From rules 22 the transit is routed round the shore (crate::plan), but its return home, the
# autopilot's own straight line, still crosses it: the orbit is refused for that leg instead.
title = "A boat's straight way to the task crosses land"
invariant = "domain"
attack = "an orbit and a nomination whose waypoints and effect point are on water, the straight way to them across the shore"
expect = "rejected"
expect_rule = "domain"
end_s = 10

[[operator]]
id = "op-1"
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "viper-1"
platform = "magura"         # armed USV (ArduRover), 12 m/s
at = [-122.4500, 37.8450]   # Richardson Bay, east of the Marin shore's corner

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1                    # an orbit west of the bridge, every waypoint on the water
action = "task"
by = "op-1"
task = "orbit"
uids = ["viper-1"]
center = [-122.4950, 37.8200]
radius_m = 150

[[step]]
at_s = 2
action = "expect"
task_state = "rejected"
task_reason = "crosses land at"

[[step]]
at_s = 3
action = "nominate"
by = "op-1"
platform = "viper-1"
track = "T-0001"
radius_m = 75
fallback = "loiter"
window_s = 600

[[step]]
at_s = 4
action = "expect"
state = "rejected"
rule = "domain"
