# Rules 6: at dispatch the platform's lost-link action is set to the fallback and read back.
# Here the platform never answers the parameter protocol: the preload is reported
# unconfirmed (engage.preload, with the bridge's error), the engagement stops at once
# (system: the platform's lost-link action could not be preloaded) with its fallback, and
# nothing is ever released. Afterwards the log is forged to show the preload confirmed;
# replay recomputes the confirmation from the read-back and catches it.
title = "The platform never confirms its lost-link preload"
invariant = "fallback_preload"
attack = "the platform does not answer its preload; the log is forged to show it confirmed"
expect = "aborted"
expect_preload = ["set unconfirmed"]
preload = "no_answer"
tamper = "forge_preload"
end_s = 60

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]
# no altitude estimate for it

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
