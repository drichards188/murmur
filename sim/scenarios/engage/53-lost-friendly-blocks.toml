# Fail closed: one of our quadcopters went silent 2 km from the target a minute before the
# nomination. Without a position since, it could be anywhere it reaches at cruise speed by
# the effect time, which covers the effect point: the nomination is rejected
# (keep_out_friendly), and the detail says since when its position is unknown, which an
# operator may accept.
title = "A lost friendly's reach blocks the nomination"
invariant = "keep_out_friendly"
attack = "nominate a minute after one of our vehicles went silent 2 km away"
expect = "rejected"
expect_rule = "keep_out_friendly"
end_s = 70

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[vehicle]]
uid = "drone-1"
platform = "x10"            # one of ours, 12 m/s cruise
at = [-122.4723, 37.8120]   # 2 km east of the target

[[step]]
at_s = 0
action = "vehicle"
uid = "drone-1"
silent = true               # its link is cut: lost from here on

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]
# no altitude estimate for it

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 60
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
