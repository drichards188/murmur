# Rules 5, from the second review (its probe P3): the operator who accepts a lost vehicle may
# also sign the engagement (two people still sign, the acceptor is one of them), but the
# signature records it (`self_accepted`, like `self_approved`), for the console and the
# evaluation to show. op-2 accepts the lost quadcopter and signs; op-3 signs too. Afterwards
# the flag is cleared in the log; replay recomputes it and catches the edit.
title = "An acceptor who signs is recorded as such"
invariant = "signed_picture"
attack = "the operator who accepted a lost vehicle signs; the log hides that they did both"
expect = "done"
expect_assessment = "ceased"
tamper = "hide_self_accepted"
end_s = 200

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"
at = [-122.4700, 37.8160]

[[vehicle]]
uid = "drone-1"
platform = "x10"
at = [-122.4950, 37.8264]   # 1.6 km north of the target; its link is cut at s=2

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 2
action = "vehicle"
uid = "drone-1"
silent = true

[[step]]
at_s = 15
action = "accept"
by = "op-2"
uid = "drone-1"

[[step]]
at_s = 17
action = "approve"
by = "op-2"

[[step]]
at_s = 19
action = "approve"
by = "op-3"

[[step]]
at_s = 20
action = "expect"
state = "dispatched"
