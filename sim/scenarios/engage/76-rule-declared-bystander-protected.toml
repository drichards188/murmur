# Rules 9: a rule-declared track that is not the target sits inside an engagement's keep-out.
# op-1 declares the fast boat T-0001 hostile. A second boat, T-0002, 250 m from it, commits an
# act against our patrol USV and is declared hostile by rule. Nominated on T-0001, the
# engagement is rejected: T-0002, declared by rule and not confirmed by an operator, stays
# protected in the keep-out (conservative; an operator's declaration, or a confirmed one, is
# exempt as before). op-2 confirms T-0002's declaration; the same nomination again passes the
# keep-out (T-0002 is now a confirmed declared hostile) and is signed and carried out.
# Afterwards the log is forged so T-0002's declaration looks confirmed in the first
# nomination's picture (which would have exempted it); replay must catch that no operator
# had confirmed it then.
title = "A rule-declared track that is not the target stays protected until confirmed"
invariant = "keep_out_tracks"
attack = "an unconfirmed rule declaration inside another engagement's keep-out; a confirmation forged into the picture"
expect = "done"
expect_assessment = "ceased"
expect_ident = [
    "declared T-0001 hostile by op-1",
    "declared T-0002 hostile by rule:hostile_act",
    "confirmed T-0002 by op-2",
]
tamper = "confirm_in_inputs"
end_s = 200

[[operator]]
id = "op-1"                 # declares and nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"
at = [-122.4700, 37.8160]

[[vehicle]]
uid = "usv-1"
platform = "seahunter"
at = [-122.4820, 37.8090]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
truth = "hostile"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["usv-1:radar", "blade-1:eo_ir"]

[[track]]
id = "T-0002"
at = [-122.4950, 37.81425]  # 250 m north of it, holding
affiliation = "suspect"
truth = "hostile"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["usv-1:radar", "blade-1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 2
action = "act"
by_track = "T-0002"
against_vehicle = "usv-1"
sensors = ["blade-1:eo_ir", "usv-1:radar"]
sigma_m = 26

[[step]]
at_s = 4
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 5
action = "expect"
state = "rejected"
rule = "keep_out_tracks"

[[step]]
at_s = 7
action = "confirm_declaration"
by = "op-2"
track = "T-0002"

[[step]]
at_s = 9
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 13
action = "approve"
by = "op-2"

[[step]]
at_s = 16
action = "approve"
by = "op-3"

[[step]]
at_s = 17
action = "expect"
state = "dispatched"
