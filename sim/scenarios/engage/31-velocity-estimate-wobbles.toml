# Liveness of the frozen plan (third review, Q3). The target holds, but the tracker's
# velocity estimate wobbles (0.8 m/s east between op-2's look and signature, then another
# way while the signature waits): carried 90 s to the plan's time on today's estimate, the
# prediction moves 70 m or more. The plan holds: the track is where its path puts it now,
# and the tolerance at the plan's time grows with the track's uncertainty over the lead
# time (bounded). A real turn still drops it (26-target-reverses, 35-real-course-change).
title = "The velocity estimate wobbles while the target holds"
invariant = "signed_picture"
attack = "the tracker's velocity estimate changes by 0.8 m/s between a look and a signature, and while a signature waits"
expect = "done"
expect_assessment = "ceased"
end_s = 220

