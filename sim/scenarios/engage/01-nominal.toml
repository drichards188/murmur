# The chain end to end: declare, nominate, two approvers with engagement authority (neither
# the proposer), dispatch, the picture held every second, the abstract effect at the
# predicted point and time, the assessment ("ceased": no detection while our sensor covers
# the point). Then the log is attacked: the approval's snapshot (the picture the approvers
# saw) is moved 300 m, consistently in the dispatch order, with a recomputed hash chain;
# replay must catch it by recomputing the snapshot from the approval's re-check inputs.
title = "Nominal engagement, snapshot edited afterwards"
invariant = "audit"
attack = "edit the approval's track snapshot (and the dispatch order to match) after the fact"
expect = "done"
expect_assessment = "ceased"
tamper = "edit_snapshot"
end_s = 200

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600

[[step]]
at_s = 2
action = "expect"
state = "pending_approval"

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 6
action = "expect"
state = "pending_approval"
concurrences = 1

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
