# Rules 28 (bd murmur-9001): a missile on a ground platform too close to its target opens to its
# minimum range before it launches. A hostile truck holds on the shore inside ez-gate-west (this
# file's land reaches 37.806), 55 m north of the armed UGV. op-1 nominates the UGV naming its
# Javelin (65 to 4,750 m) with a 50 m effect radius: the band starts at 115 m, so the plan's firing
# position is on the line from the truck through the UGV, 115 m from the truck, 60 m south of where
# the UGV stands. It drives there (some 15 s at 4 m/s), launches, and the missile strikes some
# 0.8 s later; the UGV's sight covers the point: ceased. Rules 27 (`--rules 27`) drove the UGV onto
# the truck, inside the missile's minimum range the whole way in: never released, stopped late by
# `engage_window` with its fallback.
title = "A missile's platform opens to its minimum range"
invariant = "weapon"
attack = "a missile released from inside its minimum range"
expect = "done"
expect_assessment = "ceased"
end_s = 120
land = [[[-122.52, 37.77], [-122.46, 37.77], [-122.46, 37.806], [-122.52, 37.806]]]

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "bull-1"
platform = "ugv_armed"      # an M2 and one Javelin; its sight covers the point
at = [-122.4950, 37.8045]   # on the shore, 55 m south of the truck
alt_m = 20

[[track]]
id = "T-0001"
at = [-122.4950, 37.80500]  # holding on land inside ez-gate-west
domain = "ground"
affiliation = "suspect"
identity = "truck"
identity_confidence = 0.9
sources = ["1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "bull-1"
track = "T-0001"
radius_m = 50
fallback = "abort"          # hold where it is
window_s = 600
weapon = "FGM-148 Javelin"

[[step]]
at_s = 2
action = "expect"
state = "pending_approval"

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
