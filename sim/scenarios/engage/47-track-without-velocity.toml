# Rules 6, fail closed on missing data: a new protected track 2.5 km from the effect point
# has no velocity estimate yet (the tracker takes one from fixes 10 s apart). It is not held
# where it is: it could be anywhere it reaches at its domain's top speed (25 m/s on the
# surface) by the effect time, so it blocks.
title = "A track with no velocity estimate blocks by its reach"
invariant = "keep_out_tracks"
attack = "a protected track with no velocity estimate 2.5 km from the effect point"
expect = "rejected"
expect_rule = "keep_out_tracks"
end_s = 20

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km: it also covers the point for the assessment
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]
# no altitude estimate for it

[[track]]
id = "T-0002"
at = [-122.4950, 37.8345]   # 2.5 km north of the target
affiliation = "unknown"
identity = "small_craft"
identity_confidence = 0.5
sources = ["3:radar"]
no_velocity_estimate = true

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"
window_s = 600
