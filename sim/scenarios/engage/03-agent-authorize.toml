# Agents nominate, never authorize: an agent nominates (with a rationale), then "tries" to
# approve; its whole surface is the engine's AgentPort, which has no approve method (the
# compile_fail doctests prove it can't be written), so the attempt is recorded and nothing
# moves. An operator without engagement authority tries next and is refused. Two operators
# with authority then approve. Afterwards the log is forged so the final approval is the
# agent's; replay must flag it (no operator session behind it).
title = "An agent tries to authorize its own nomination"
invariant = "agent_cannot_authorize"
attack = "an agent approves its nomination; an operator without engagement authority approves; the log is forged to show the agent approving"
expect = "done"
expect_assessment = "ceased"
expect_refusals = ["no approve method on AgentPort", "only an operator with engagement authority"]
tamper = "agent_approval"
end_s = 200

[[operator]]
id = "op-1"                 # nominates; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[agent]]
id = "agent-planner"

[[vehicle]]
uid = "blade-1"
platform = "switchblade"    # armed, EO/IR 3 km
at = [-122.4700, 37.8160]

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
agent = "agent-planner"
rationale = "T-0001 is declared hostile and holding inside the engagement zone; blade-1 is the closest armed platform"
platform = "blade-1"
track = "T-0001"
radius_m = 75
fallback = "return"

[[step]]
at_s = 2
action = "agent_approve"
agent = "agent-planner"

[[step]]
at_s = 3
action = "approve"
by = "op-1"

[[step]]
at_s = 4
action = "expect"
state = "pending_approval"
concurrences = 0
[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"
