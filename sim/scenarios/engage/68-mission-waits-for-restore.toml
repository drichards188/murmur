# Rules 7 (murmur-85l): a mission is not sent to a platform still carrying an ended
# engagement's lost-link action. An operator aborts the USV's engagement (its fallback,
# loiter, is commanded); its own lost-link values are owed back, but its parameter protocol
# answers the restore only 25 s later. Meanwhile the operator orders it on an orbit: the link
# reaches it, yet the orbit waits in the queue (its reach says its own failsafe is not
# confirmed back), and goes out the second the restore confirms. Until rules 7 the orbit went
# out at once, flown with the engagement's 5 s lost-link timer and action. The log is then
# forged to drop the fact from every decision; replay must catch it.
title = "A mission waits for its platform's own lost-link values"
invariant = "restore_owed"
attack = "order a mission while an ended engagement's lost-link action is still preloaded"
expect = "aborted"
expect_stop = "operator"
expect_preload = ["set confirmed", "restore confirmed"]
restore_after_s = 60
tamper = "drop_restore_owed"
end_s = 80

[[operator]]
id = "op-1"                 # nominates, aborts and orders the orbit; no engagement authority
[[operator]]
id = "op-2"
engage = true
[[operator]]
id = "op-3"
engage = true

[[vehicle]]
uid = "viper-1"
platform = "magura"         # armed USV (ArduRover), LEO SATCOM: a 30 s lost-link timer
at = [-122.4700, 37.8160]
lost_link_s = 30

[[track]]
id = "T-0001"
at = [-122.4950, 37.8120]   # holding west of the bridge, inside ez-gate-west
affiliation = "suspect"
identity = "small_fast_boat"
identity_confidence = 0.9
sources = ["3:radar", "1:eo_ir"]

[[step]]
at_s = 0
action = "declare"
track = "T-0001"
affiliation = "hostile"
by = "op-1"

[[step]]
at_s = 1
action = "nominate"
by = "op-1"
platform = "viper-1"
track = "T-0001"
radius_m = 75
fallback = "loiter"
window_s = 600

[[step]]
at_s = 5
action = "approve"
by = "op-2"

[[step]]
at_s = 8
action = "approve"
by = "op-3"

[[step]]
at_s = 9
action = "expect"
state = "dispatched"

[[step]]
at_s = 30
action = "abort"
by = "op-1"

[[step]]
at_s = 35                   # an orbit east of where it is, on the water
action = "task"
by = "op-1"
task = "orbit"
uids = ["viper-1"]
center = [-122.4600, 37.8160]
radius_m = 150

[[step]]
at_s = 36
action = "expect"
state = "aborted"
task_state = "queued"
task_reason = "lost-link failsafe"

[[step]]
at_s = 59
action = "expect"
task_state = "queued"

[[step]]
at_s = 61
action = "expect"
task_state = "dispatched"
