# Rules 34, stage 4 (docs/SWARMS.md decision 4 and section 4.3; bd murmur-4nik): below its
# minimum a group stops and asks. Twenty quadcopters orbit a 150 m ring on op-1's order (the
# minimum sixteen); twelve fall silent, six and then six more ten seconds later, as a jammer would
# take them. Once the drops have settled the eight left are under the minimum: the group is
# suspended (`group.suspended`, eight of a minimum of sixteen), never re-formed, and when the
# twelve are heard again it does not resume on its own: re-forming it is the person's to do.
title = "Twelve of twenty drop: suspended below the minimum, no re-form, no resume"
invariant = "group_order"
attack = "a re-form or a resume past the minimum the person set for being asked"
expect = "dispatched"
end_s = 130
min_rules = 34
expect_groups = ["i1 suspended"]

[[operator]]
id = "op-1"

