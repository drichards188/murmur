# Rules 34, stage 4 (docs/SWARMS.md section 4.3; bd murmur-4nik): a group re-forms itself when
# members drop. Twenty quadcopters orbit a 150 m ring together on op-1's order (the minimum
# sixteen). Three fall silent ten seconds apart (SKY 4, SKY 11, SKY 17): each drops once its
# position has been stale twenty seconds past its link's limit, and once no member has dropped for
# fifteen seconds the group re-forms itself, once, under the same approval: only a neighbour of
# each gap moves (SKY 2, SKY 8, SKY 18), each on a member order of its own, and the rest keep the
# shares they fly. SKY 5, on the far side of SKY 4's gap, reports only every ten seconds by then
# (its link too slow for a mission upload): it keeps its slot, and SKY 2 closes that gap from its
# side alone. The log is then attacked: the drops' facts made fresh in the re-form's inputs, as if
# the group re-formed with nobody gone; replay, which recomputes every drop from the logged facts,
# must catch it.
title = "A ring of twenty re-forms once after three drop, moving only the gaps' neighbours"
invariant = "group_order"
attack = "a re-form whose facts show no drop (forge_reform)"
expect = "dispatched"
tamper = "forge_reform"
end_s = 90
min_rules = 34
expect_groups = ['re-formed 1: moved ["sky-18", "sky-2", "sky-8"]']

