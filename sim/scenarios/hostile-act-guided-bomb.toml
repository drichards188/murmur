# Guided bomb traffic (sim/situations/hostile-act-guided-bomb.toml): a hostile coaster (a small
# freighter) without AIS, armed with a deck-mounted rocket launcher, that fires on our sensor ship,
# and the tutorial's Golden Gate traffic around it (the ships and the trawler from the wharf moved
# or held off so nothing neutral comes within some 1.5 km of the holding area in the situation's 12
# minutes; sim/scenarios/tutorial.toml says how). Run by crates/murmur-contacts; format in
# crates/murmur-contacts/src/scenario.rs. Points are [lon, lat]. Fictional names and MMSIs.
# Everything here is truth: the console only ever sees what our sensors make of it.
#
# The target is ship-sized (sim/contacts.toml `armed_coaster`, looking like a `cargo_ship`), which
# is what the GBU-12 Paveway II is for here. Against it the MQ-9B's AGM-114R hits 0.95 of the time
# but its 9 kg warhead never sinks it and stops it (propulsion lost) only 0.45 of its hits; the
# GBU-12's 241 kg Mk 82 hits 0.90 and, given a hit, sinks it 0.10 and stops it 0.60
# (sim/platforms.toml `mq9b_armed`, docs/research/weapons.md 10.3 and 10.4, all estimates). The
# weapon check shows the operator both before anyone signs. Only a ship-sized target without AIS
# reads as suspect to the tracker: a fishing vessel or a sailboat without AIS reads as neutral
# (small craft need not carry it), and the engine then flags an act by it for review instead of
# declaring it ("conflicting evidence": a trawler here, 2026-11-03).
#
# Seed 76818 (the damage draw, crates/murmur-contacts damage.rs, depends on the run's seed and the
# strike's intent only): a GBU-12 strike by any engagement intent from 1 to 6 hits the coaster and
# sinks it (hit draws 0.04 to 0.72 against 0.90, damage draws 0.01 to 0.10 against 0.10), so the
# default run (the opening order is intent 1, the timeline's nomination intent 2) and a run where
# an AI's proposals come first both show the bomb sinking it. Past intent 6, or with another seed,
# the bomb most often only stops the ship, and it can miss; the situation's brief says so. The
# coaster's own strikes on HUNTER 1 draw on their acts' streams (`act:coaster-raider-<n>`), which
# the seed was not chosen for (docs/AUTONOMOUS-NODES.md decision D4: nothing is chosen to spare
# ours).
#
# The coaster fires by its own fire control (docs/AUTONOMOUS-NODES.md, bd murmur-y85j.6): a 12-tube
# 107 mm rocket launcher (300 m to 8 km, unguided) and a 23 mm twin cannon. This file orders it to
# fire one rocket at HUNTER 1 a minute, four times (each rocket a hit 0.10 of the time against a
# fishing-vessel-sized sensor ship; of its hits 0.05 sink HUNTER 1 and 0.35 stop it). Each rocket
# is one act.
#
# Times (`start_s`, an order's `at_s`) count from the contacts process's start, a few seconds after
# the situation's clock (the link emulator's start). uids are the fleet's
# (sim/fleets/hostile-act-guided-bomb.toml): 1 is HUNTER 1.
title = "Guided bomb traffic"
seed = 76818

[sensing]
misclassification_rate = 0.0     # deterministic identities: the situation is about the chain

# ---------------------------------------------------------------- the hostile
# A coaster without AIS steams in from some 630 m west of its holding point mid-strait, 1.5 km west
# of the bridge inside the engagement zone (sim/areas: ez-gate-west): up to 4.9 m/s by 0:14, then
# slowing at its kind's 0.02 m/s² (sim/contacts.toml, bd murmur-2of4) the whole way in, and stops
# on the point at about 4:18, creeping the last few metres while the nomination is signed (well
# inside the effect's radius). At 2:35 it is ordered to fire a rocket at HUNTER 1, patrolling 0.9
# to 1.2 km east of it, from where it is (still coming in at some 2 m/s), and again every minute:
# each rocket is another chance for our sensors to observe an act.
[[contact]]
id = "coaster-raider"
name = "Coaster without AIS (a small freighter) with a deck-mounted rocket launcher, anchored mid-strait west of the bridge"
affiliation = "hostile"
domain = "surface"
kind = "armed_coaster"
speed_mps = 5
motion = "transit"
route = [[-122.5020, 37.8108], [-122.4950, 37.8120]]
start_s = 5

[[order]]
at_s = 155
node = "coaster-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "107 mm rocket launcher (Type 63-class, 12 tubes)"
rounds = 1
stay = true
label = "fires a rocket at the sensor ship (HUNTER 1)"

[[order]]
at_s = 215
node = "coaster-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "107 mm rocket launcher (Type 63-class, 12 tubes)"
rounds = 1
stay = true
label = "fires a rocket at HUNTER 1 again"

[[order]]
at_s = 275
node = "coaster-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "107 mm rocket launcher (Type 63-class, 12 tubes)"
rounds = 1
stay = true
label = "fires a rocket at HUNTER 1 a third time"

[[order]]
at_s = 335
node = "coaster-raider"
do = "attack"
target = { vehicle = 1 }
weapon = "107 mm rocket launcher (Type 63-class, 12 tubes)"
rounds = 1
stay = true
label = "fires a rocket at HUNTER 1 a fourth time"

