# Harbor watch traffic (sim/situations/harbor-watch.toml): ordinary traffic at the Golden Gate
# and one unknown fast boat. Run by crates/murmur-contacts; format in
# crates/murmur-contacts/src/scenario.rs. Points are [lon, lat]. Routes and identities as in
# sim/scenarios/golden-gate.toml (fictional names and MMSIs). Everything here is truth: the
# console and the AI only ever see what our sensors make of it.
#
# Times (`start_s`) count from the contacts process's start, which scripts/up.sh starts with
# the bridge, a few seconds after the link emulator: a situation's clock (its `at_s`) counts
# from the emulator's start, so a contact appears a few seconds after the same number on the
# situation's clock.
#
# The ordinary traffic all carries AIS (neutral, named), so the one track without it near the
# Gate stands out; a sport fishing boat without AIS drifts off Mile Rock, 5 km from the bridge,
# as a distractor (a small craft not required to carry AIS: shown neutral once classified).
title = "Harbor watch traffic"
seed = 11

[sensing]
misclassification_rate = 0.02
model = "legacy"                 # pinned: v1 and v2 situations (and their records) are the legacy model's

# ---------------------------------------------------------------- ferries (AIS, neutral)
[[contact]]
id = "ferry-sausalito"
name = "Sausalito ferry (Ferry Building to Sausalito)"
affiliation = "neutral"
domain = "surface"
kind = "ferry"
speed_mps = 10
motion = "route"
route = [[-122.3905, 37.7960], [-122.4120, 37.8130], [-122.4400, 37.8220], [-122.4620, 37.8390], [-122.4770, 37.8560]]
reverse = true
dwell_s = 600
ais = { mmsi = "366999101", name = "MV GOLDEN BEAR", ship_type = "passenger" }

