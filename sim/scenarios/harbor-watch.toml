id = "fastboat-west"
name = "Fast boat without AIS, in from the west, holding west of the bridge"
affiliation = "unknown"
domain = "surface"
kind = "small_fast_boat"
speed_mps = 15
motion = "transit"
route = [[-122.5300, 37.8030], [-122.5100, 37.8090], [-122.4950, 37.8120]]
start_s = 150
