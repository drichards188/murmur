# ---------------------------------------------------------------- the unknown
# Comes in from the west at about 2:30 on the situation's clock, at 15 m/s (29 kn), no AIS,
# no lights, and holds 1.5 km west of the bridge from about 6:10. Nothing hostile happens: the
# situation is the detection, the AI's proposal and who decides on it.
