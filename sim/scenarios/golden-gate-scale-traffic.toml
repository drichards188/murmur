# The scale world's background traffic (sim/worlds/golden-gate-scale.toml; docs/WORLD-V3-PLAN.md
# H6): Golden Gate v3's traffic (sim/scenarios/golden-gate-v3-traffic.toml), every contact of it
# copied unchanged, and a heavier day on top (the section at the end). Sources and AIS carriage
# as Golden Gate v3's file says. Routes stay on water or on land on the world's baked grid
# (checked: eval/headless/tests/test_worlds_v3.py).
title = "Golden Gate scale traffic"
seed = 31

[sensing]
misclassification_rate = 0.05
model = "physical"
terrain = "sim/headless/terrain/golden-gate.grid.gz"
bathymetry = "sim/headless/terrain/golden-gate.bathy.grid.gz"

# What the sensing model senses in when a situation draws nothing (`[headless] conditions =
# "world"` draws visibility, wind and sea state per episode and puts them here); the sun comes
# from the scenario clock. Shipping noise for sonar: a busy harbour entrance.
[conditions]
visibility_m = 20000
sea_state = 2
wind_mps = 5
shipping = 0.7

