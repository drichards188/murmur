# San Diego's background traffic (sim/worlds/san-diego.toml; docs/WORLD-V3-PLAN.md section 5):
# what moves around the bay entrance, the bay and the approaches on an ordinary day, in every
# domain but under the water (subsurface contacts come with situations), under the physical
# sensing model. Format: crates/murmur-contacts/src/scenario.rs; points are [lon, lat].
# Everything here is truth: the console and the AI only ever see what our sensors make of it.
# A situation in the world takes this file unless it names its own contacts.
#
# Sources (approximations, not schedules): the Coronado ferry between Broadway Pier and the
# Coronado ferry landing and the harbor cruises from the Embarcadero; Navy ships in the entrance
# channel to and from Naval Base San Diego (the bay's deep-draft channel past Ballast Point and
# North Island, under the Coronado Bridge) and a car carrier to the National City Marine
# Terminal; a tanker at anchor off Point Loma; sportfishing out of the Point Loma landings to the
# kelp beds, a commercial boat to Tuna Harbor; sailing off Harbor Island and in the south bay;
# the Coast Guard (Sector San Diego, Harbor Drive) and the Harbor Police. Air: airliners on the
# final approach to San Diego International's runway 27 over downtown (450 m about 6 to 10 km
# out on a 3 degree path; a contact keeps one altitude, so each flies the segment and leaves at
# its end) and departing west over Point Loma, a Navy MH-60 from North Island, a coastal
# sightseeing flight, a banner tow along the beaches, a hobby drone by the Hotel del Coronado.
# Ground: Harbor Drive by the airport, Rosecrans Street, Cabrillo Memorial Drive along the Point
# Loma ridge, Orange Avenue in Coronado, Pacific Highway downtown, a Navy truck on North Island;
# walkers on the Embarcadero and Coronado Beach, visitors at Cabrillo National Monument. Routes
# are drawn to stay on water or on land on the world's baked grid (checked:
# eval/headless/tests/test_worlds_v3.py). An airliner is a `light_aircraft` contact (the kinds
# have no airliner) with an airliner's size, radar cross-section and heat; a Navy ship is a
# `patrol_boat` (what AIS's ship type "military" means to the tracker) with a warship's.
#
# AIS by class: the ferry, the cruise boats, the ships, the Navy ships (in harbour), the Coast
# Guard and the commercial fishing boat class A; the sportfisher, the Harbor Police and one
# sailboat class B; the other small craft none. Names and MMSIs are fictional.
title = "San Diego traffic"
seed = 37

[sensing]
misclassification_rate = 0.05
model = "physical"
terrain = "sim/headless/terrain/san-diego.grid.gz"
bathymetry = "sim/headless/terrain/san-diego.bathy.grid.gz"

# What the sensing model senses in when a situation draws nothing (`[headless] conditions =
# "world"` draws visibility, wind and sea state per episode); the sun from the scenario clock.
# Shipping noise for sonar: a busy naval harbour.
[conditions]
visibility_m = 15000
sea_state = 2
wind_mps = 4
shipping = 0.7

