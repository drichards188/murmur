# Link profiles for the user-space link emulator (crates/murmur-linkemu, Phase D).
#
# A vehicle's profile is its platform's `link` class from sim/platforms.toml (los, mesh,
# satcom, acoustic, tether), unless [platform_profile] below names another profile for that
# platform. Numbers are rough, plausible defaults, not measurements. Where a figure comes
# from a public spec or physics it says so; everything marked GUESS is an invented starting
# point to be tuned (the 30%-loss study varies loss, not these).
#
# Fields (all optional; `extends` inherits from another profile):
#   loss          long-run average loss, 0..1, from a Gilbert-Elliott chain
#   burst_len     mean consecutive packets lost per burst (<= 1/(1-loss) means independent)
#   latency_ms    one-way base latency; jitter_ms is uniform +- around it (no reordering)
#   bandwidth_bps per-direction cap, 0 = unlimited; queue_bytes is the drop-tail queue
#   duplicate     chance a delivered packet arrives twice
#   range_ok_km / range_max_km / range_exp   loss from the ground station position:
#                 0 up to ok, rising as ((d-ok)/(max-ok))^exp to 1 at max. Also turns on the
#                 terrain line-of-sight check.
#   down_when     "submerged" or "surfaced": link is down for vehicles in that state
#   terrain       "block" (default for profiles with a range), "ramp" or "off": what an
#                 obstructed path to the ground station does. Needs `--tidewater URL` (or
#                 MURMUR_TIDEWATER_URL) on the emulator; without it terrain is not checked.
#                 block: drop everything; ramp: loss rises from 0 at the ray to 1 at
#                 terrain_ramp_m (default 30) of obstruction.
#   gs_antenna_m / antenna_m   antenna heights above the ground station altitude and above the
#                 vehicle's reported altitude (default 0)
#   k_factor      effective Earth radius factor for the radio horizon (default 4/3)
#   fresnel_mhz / fresnel_clear   if fresnel_mhz is set, also keep fresnel_clear (default 0.6)
#                 of the first Fresnel zone clear of terrain
#   propagation_mps  adds slant range to the ground station / this speed to the latency
#   space_class   SATCOM profiles only: a murmur-space constellation class (starlink, iridium,
#                 wgs, ku-geo; see sim/space/constellations.toml). The link then follows real
#                 satellite visibility for the vehicle's position on the scenario clock: down
#                 when no satellite is above the mask (cause no_sat), one-way latency from the
#                 best satellite's slant range plus the class's network latency, handovers
#                 when the best satellite changes. latency_ms stays as the fallback (no element
#                 sets, class unusable, no latency model). Needs `murmur-space fetch` once;
#                 without it the profile uses its static numbers and says so in the log and
#                 in /stats.
#   handover_outage_ms   how long the link drops at a handover (default 0: only counted)

seed = 1

# Vehicles at or below this depth (from GLOBAL_POSITION_INT altitude, negative = depth) count
# as submerged. 1 m matches the stand-ins' own definition.
submerged_depth_m = 1.0

# Where the operator's radios are: Crissy Field, the Golden Gate fleets' launch site. alt_m is
# the ground height there in metres above MSL (the DEM says 4.8 m at this spot); the antenna
# heights in the profiles (gs_antenna_m, the mast) are added to it. With tidewater configured
# the emulator samples the DEM at the station at startup and warns if alt_m is more than 5 m
# off; alt_m = "dem" uses the DEM height instead of a number.
[ground_station]
lat = 37.8068
lon = -122.4460
alt_m = 5.0

# SATCOM from real satellites (murmur-space). Element sets: `murmur-space fetch` once (cached
# in sim/space/cache, not in git). Each SATCOM vehicle is refreshed every interval_s scenario
# seconds (at least min_wall_s wall seconds apart, so a high MURMUR_RATE does not spin) in a
# background task; the packet path reads the latest answer. The look-ahead for the next
# outage or pass (/stats/<uid>) covers outlook_s scenario seconds, refreshed every
# outlook_every_s. `epoch` is murmur-space's epoch mode: public element sets are current but
# scenarios are dated, so "auto" propagates on the same time of day of the day whose
# satellites are known (see crates/murmur-space/README.md, "Epoch honesty").
[space]
catalog = "sim/space/constellations.toml"
cache = "sim/space/cache"
epoch = "auto"
interval_s = 5.0
min_wall_s = 0.5
outlook_s = 1800.0
outlook_every_s = 60.0

# Terrain line of sight client (tidewater's DEM over HTTP). The packet path never waits for
# it: each vehicle's position is rounded to a cell_m grid cell and an altitude band, one
# profile per cell is sampled every interval_s (all cells in few requests) and cached, and
# until the first answer a link counts as open (counted in /stats as unknown_pkts).
[terrain]
interval_s = 1.0
cell_m = 250
alt_step_m = 10
sample_spacing_m = 50      # the DEM is about 15 m
max_points = 500

# ---- LOS radio (small UAS datalinks: Puma, Switchblade, FVR-90, CCA control link)
# Latency 5-30 ms is typical of digital datalinks (vendor sheets for Microhard, Silvus,
# Doodle Labs). Range: AeroVironment quotes ~20 km LOS for Puma 3 AE. The rest is GUESS.
[class.los]
loss = 0.005               # GUESS
burst_len = 3              # GUESS
latency_ms = 15
jitter_ms = 5
bandwidth_bps = 500000     # GUESS: between a SiK telemetry radio (250 kbps air rate) and a Mbps datalink
queue_bytes = 16384
range_ok_km = 15           # GUESS, from the ~20 km figure above
range_max_km = 25
range_exp = 2
gs_antenna_m = 10          # GUESS: a mast on the ground station
antenna_m = 0

# ---- Mesh (relay-dependent: FPV, tactical UGVs). Several hops at ~5-10 ms each; capacity
# shared across the mesh. All GUESS apart from the per-hop latency.
[class.mesh]
loss = 0.02
burst_len = 4
latency_ms = 25
jitter_ms = 15
bandwidth_bps = 300000
queue_bytes = 16384
range_ok_km = 5
range_max_km = 12
range_exp = 2
gs_antenna_m = 10          # GUESS
antenna_m = 1.5            # GUESS: a whip on a ground vehicle or boat

# ---- SATCOM, GEO (default for the satcom class: Global Hawk, Reaper). Follows WGS-class
# military GEO satellites (space_class "wgs"): up while one is above the 5 deg mask, latency
# from the slant range (about 250-275 ms one way from the Golden Gate, bent pipe, no network
# allowance known). latency_ms = 300 is the static fallback: ground -> GEO -> vehicle is about
# 240 ms one way before modem and processing, 300 ms gives the ~600 ms round trip operators
# quote. Loss from rain fade, GUESS. Bandwidth GUESS (Ku/Ka MALE links reach Mbps; WGS rates
# are terminal dependent). Down while a subsurface vehicle is submerged. Handover outage 0:
# a terminal stays on its GEO satellite, so changes of "best" (an aircraft moving between
# footprints) are only counted.
[class.satcom]
space_class = "wgs"
loss = 0.01
burst_len = 5
latency_ms = 300
jitter_ms = 40
bandwidth_bps = 256000
queue_bytes = 16384
down_when = "submerged"

# ---- SATCOM, commercial Ku-band GEO (Intelsat-class, "ku-geo" in the space catalog): what
# RQ-4 and MQ-9B-class aircraft also use. Documented alternative to the WGS mapping: map
# rq4 / mq9b to it under [platform_profile]. Only the operator's satellites above the mask
# count, so coverage depends on where its fleet sits (from the Golden Gate about 8 are in
# view). Latency includes the class's 20 ms gateway allowance (GUESS).
[class.satcom_ku_geo]
extends = "satcom"
space_class = "ku-geo"

# ---- SATCOM, LEO (Starlink-like, "starlink"): 25-60 ms round trip is the commonly published
# range. Follows the real constellation: one-way latency is the bent pipe (user and gateway
# legs at the user's range) plus 8 ms (GUESS) per direction, and a short outage at satellite
# handover (handover_outage_ms, GUESS; operationally a handover comes roughly every 15 s, and
# "best" here is the highest-elevation satellite, which changes at a similar or higher rate).
# The handover glitch used to be modelled as bursty loss (loss 0.01, burst 10); with real
# handovers that would count it twice, so the residual loss is small. Static fallback is
# therefore a cleaner link than the old profile.
[class.satcom_leo]
extends = "satcom"
space_class = "starlink"
handover_outage_ms = 100   # GUESS
loss = 0.003               # GUESS
burst_len = 3              # GUESS
latency_ms = 25
jitter_ms = 5              # GUESS
bandwidth_bps = 2000000    # GUESS
queue_bytes = 65536

# ---- SATCOM, Iridium-like ("iridium", SBD / PPP): low rate, ~1 s latency. GUESS throughout.
# Visibility is real (66 satellites, 8.2 deg mask: always at least one in view at the Golden
# Gate, so the link seldom drops); the class has no published network latency, so latency_ms
# = 700 stays as the total (GUESS) and /stats says latency_source = "profile". Handover
# outage 250 ms is a GUESS (satellites pass in about 9 minutes). The buoy maps here. The
# stand-ins do not decimate telemetry, so a 22 kbps link will drop most of what they send
# (which is also the honest result); link-aware telemetry is a separate issue, this
# mismatch is left visible on purpose.
[class.satcom_iridium]
extends = "satcom"
space_class = "iridium"
handover_outage_ms = 250   # GUESS
latency_ms = 700
jitter_ms = 200
bandwidth_bps = 22000
queue_bytes = 4096

# ---- Acoustic (AUVs and XLUUVs, JANUS-style). Modems run from tens of bps (JANUS baseline is
# 80 bps) to a few kbps (WHOI Micro-Modem 80-5400 bps); 300 bps is a GUESS in that band.
# Sound travels at ~1500 m/s, hence propagation_mps. Only works while submerged.
[class.acoustic]
loss = 0.10                # GUESS
burst_len = 4              # GUESS
latency_ms = 100           # modem processing and framing, GUESS; propagation is added below
jitter_ms = 150
bandwidth_bps = 300
queue_bytes = 256
down_when = "surfaced"
propagation_mps = 1500

# ---- Tether (ROV cable, antenna tracker mast): near perfect. GUESS.
[class.tether]
loss = 0.0001
latency_ms = 1
jitter_ms = 0.3
bandwidth_bps = 10000000
queue_bytes = 65536

# Platforms with `link = "satcom"` and the constellation they follow:
#   buoy                        Iridium (SBD messages)
#   magura, corsair, seahunter  Starlink-class (Magura V5 uses Starlink in the field)
#   saildrone                   Starlink-class here (it carries Iridium and Starlink; uncomment
#                               the Iridium line to see the narrow link)
#   rq4, mq9b                   WGS-class military GEO (the "satcom" profile); the commercial
#                               Ku GEO they also use is the documented alternative below
[platform_profile]
buoy = "satcom_iridium"
magura = "satcom_leo"
corsair = "satcom_leo"
seahunter = "satcom_leo"
saildrone = "satcom_leo"
# saildrone = "satcom_iridium"
rq4 = "satcom"
mq9b = "satcom"
# rq4 = "satcom_ku_geo"
# mq9b = "satcom_ku_geo"

# ---- Scripted events. `at_s` is seconds since the emulator started; `at_scenario` is an ISO
# time on the scenario clock (MURMUR_AT at emulator start, plus elapsed x MURMUR_RATE, as
# the stand-ins do), with duration_s in scenario seconds or `until_scenario`. Selectors
# (class, profile, platform, domain, uid, uids, circle) all must match; effects are loss
# (extra, independent of the profile's loss), cut, extra_latency_ms; dir = both | up | down.
# More events can live in a separate file passed as --scenario. Events are re-read while
# running on SIGHUP or when this file or the scenario file changes (profiles are not).
#
# [[event]]                  # the 30%-loss study: every LOS link, two minutes
# name = "30% loss on LOS"
# at_s = 300
# duration_s = 120
# class = "los"
# loss = 0.30
#
# [[event]]                  # one vehicle goes dark for a minute
# name = "cut uid 7"
# at_s = 60
# duration_s = 60
# uid = 7
# cut = true
#
# [[event]]                  # a jammer: loss 1.0 inside the circle (default for a circle)
# name = "jammer"
# at_s = 120
# duration_s = 300
# circle = { lat = 37.82, lon = -122.48, radius_m = 3000 }
#
# [[event]]                  # the same study, timed on the scenario clock
# name = "30% loss on LOS at 10:05"
# at_scenario = "2026-06-14T10:05:00Z"
# duration_s = 120           # scenario seconds
# class = "los"
# loss = 0.30
