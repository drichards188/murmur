# One node of every platform type in sim/platforms.toml, around the Golden Gate and its
# approaches: 15 ArduPilot SITL vehicles + 7 stand-ins. HALE/MALE/CCA start airborne.
# Run with tidewater conditions: make goldengate GG_FLEET=full-spectrum
# Ground spawns sit at the DEM's height (tidewater's terrain as fixed by murmur-cbjn; re-laid
# 2026-11-12: the squeezed grid had put the Presidio's slope under Crissy Field's UGVs, 7 to 15 m,
# where the airfield is 2 to 4 m, and the lagoon east of the station's flat strip under the
# switchblade's old spot).
title = "Full spectrum: air, ground, surface, subsurface"

