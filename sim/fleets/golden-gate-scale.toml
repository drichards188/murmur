# The scale world's fleet (sim/worlds/golden-gate-scale.toml; docs/WORLD-V3-PLAN.md H6): 100
# stand-ins at the Golden Gate in Golden Gate v3's domain mix (43 air, 20 surface, 25 subsurface,
# 10 ground, 2 antenna trackers), for load and allocation under many simultaneous needs. Laid
# out on the world's baked grids so each spawns validly (eval/headless/tests/test_worlds_v3.py
# checks it): aircraft on the ground at Crissy Field, Fort Baker's parade ground and Fort
# Mason's Great Meadow, 20 to 25 m apart, except the MQ-9Bs, the RQ-4s and the airships, on
# station at the start; boats tied up (`moored`) at Horseshoe Bay, off the Fort Mason piers and
# at moorings off the Marina, the Saildrones at sea; AUVs at the surface in the channel, ROVs at
# the piers, buoys across the strait in 15 m of water or more; the UGVs and trackers on land.
# A ground unit's altitude is the surface's height there, rounded. uids follow the unit order
# (sim/swarm.py). Opening orders: sim/situations/golden-gate-scale-watch.toml.
# Re-laid on 2026-11-12 on the grids baked after murmur-cbjn's terrain fix (the places had
# been chosen on a grid squeezed north-south): Crissy Field's units 487 m south onto the
# airfield and Fort Baker's 228 m north onto the parade ground, the same features the squeezed
# grid showed; Fort Mason's onto the Great Meadow's slope (18 to 31 m), and the craft tied up
# at Horseshoe Bay inside its breakwater (3.3 to 5 m of water).
title = "Golden Gate scale: 100 stand-ins across every domain"

