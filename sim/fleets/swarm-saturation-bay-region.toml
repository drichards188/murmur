# Saturation (sim/situations/swarm-saturation.toml): 3,602 stand-ins in 37 swarms over the region
# from Bodega Bay to Monterey Bay, one operator. Each [[swarm]] table is one swarm and its members
# (sim/swarm.py, "swarms"): uids follow the swarms in this order, each swarm's members in its
# layout's order, so SURFACE-3's first USV is uid 3201 as in the packed layout
# (sim/fleets/swarm-saturation.toml, kept for performance work). Every member is a stand-in
# (`sim = "standin"`), so the whole force runs in one engine process.
#
# The same force as the packed layout, laid out as a planner covering the region would: each
# group where its own radio reaches one of the situation's thirteen ground stations
# (sim/situations/links/swarm-saturation-bay-region.toml), guarding something, and launched or
# spawned close enough to be on station within a few minutes of its order. scripts/
# layout_reach.py checks every group's way against the stations, and the spacing and area.
#
# - PICKET-1 to -17, 1,700 X10-class quadcopters (EO/IR, mesh radio: 5 km clean, 12 km at most;
#   endurance_h 0.65, 39 min; cruise 12 m/s). Picket rings round the things a drone attack would
#   go for: Bodega Harbor; seven in San Francisco Bay (the Golden Gate's mouth, the strait, the
#   city front, the Bay Bridge, the Port of Oakland, Coast Guard Island, Richardson Bay); three
#   at Half Moon Bay (Montara, Pillar Point, the harbor: the approach the jammer takes); Santa Cruz
#   (the harbor, West Cliff); Moss Landing (the power plant and its battery store, the harbor and
#   MBARI); Monterey (Cannery Row, Point Pinos). Each ring is 1.3 to 1.8 km in radius, centred
#   within about 4 km of a station, so every point of it is within the mesh's 5 km or very near
#   it. Spacing: an X10's camera finds a small drone at about 1.5 km (the catalog's `range_m`;
#   its `physical_reach_m`, 15.8 km against the reference 3 m aircraft, scaled by a small drone's
#   0.35 m: about 1.8 km), so neighbouring rings a few kilometres apart overlap as pickets do.
#   Inside a ring, 100 members on a 1.3 to 1.8 km radius fly 80 to 115 m apart: one order per
#   swarm puts all of them on one circle, and the 39 minutes of endurance and the policy's 20 %
#   reserve keep the circle within a few kilometres of the launch field (transit, 15 minutes on
#   task and the way home: rules' `reserve`, at most 87 % of what it allows here; the packed
#   layout's reached 98 %). Copters start on the ground: each launches from a flat field near its
#   ring (a block 6 or 8 m apart), a known one (an airfield, a park, an old fort's parade ground), its
#   height a published or estimated figure, marked, which the live run's terrain confirms.
#   Each flies from 100 m, or higher where its ring passes over high ground (150 to 200 m: Bodega
#   Head, the Marin cliffs at the Gate's mouth, Sausalito and Belvedere, Pacific Heights, Yerba
#   Buena Island, the foothills above Montara and El Granada, New Monterey): the task layer
#   stacks the members upward from there.
# - SEARCH-1 to -10, 1,000 Puma 3 AE-class fixed wings (EO/IR, LOS radio: 15 km clean, 25 km at
#   most; endurance_h 2.5). Lanes over the sea within 15 km of a station from end to end, the
#   approaches a threat from the sea would take: off Bodega Head, off Point Reyes (the northern
#   traffic lane), west and east of the Farallones (the western lane), off the Golden Gate, the
#   southern approach off Pacifica and Montara, off Pescadero and Pigeon Point, and three over
#   Monterey Bay. A Puma's camera finds a 5 m boat at about 14 km (`physical_reach_m` surface,
#   14.5 km against the reference 5 m surface contact), so lanes 15 to 25 km apart overlap; along
#   a lane of 13 to 19 km 100 members fly 130 to 190 m apart (one patrol per swarm: every member
#   on the same lane). They start aloft along their lanes, 700 to 1,000 m up (a stand-in fixed wing
#   glides until its first order), and fly them from 300 m: most stations stand on headlands that
#   see the sea, where the packed layout's one station at Crissy Field needed 800 m.
# - RELAY-1 to -3, 300 more Pumas along a chain from Point Reyes to the Farallones (the island
#   station's back-up link to the mainland), each swarm a third of it, flown back and forth (a
#   patrol). A relay in role and place only: the link emulator links every vehicle to the best
#   station directly and carries no vehicle's traffic through another, so the chain's middle sits
#   16.5 km from either end's station, a little past the LOS radio's clean 15 km.
# - SURFACE-1 and -2, 200 Saildrone Explorer-class USVs (wind, 2 m/s, SATCOM: no station). Ocean
#   pickets far out: a ring on the western traffic lane in the middle of the Gulf of the
#   Farallones, and a ring on Cordell Bank, the northern lane's offshore approach. Each ring 5 km
#   in radius (100 members some 310 m apart; a Saildrone's camera finds a 5 m boat at about 6 km).
#   They start on their rings, each at its own place round it, so they are on station at once.
# - SURFACE-3 to -5, 300 Corsair-class USVs (EO/IR 8 km, AIS and ESM, 8 m/s, SATCOM). SURFACE-3
#   rings the San Francisco Bar, where the main ship channel crosses it (2 km radius); SURFACE-4
#   the central bay between Alcatraz, Angel Island and Treasure Island (1.5 km); SURFACE-5 flies a
#   lane across Monterey Bay from off Santa Cruz to off Moss Landing. They start on their rings or
#   along their lane.
# - UNDERSEA-1, 100 REMUS 600-class AUVs (active sonar, 2 m/s, acoustic modem): a ring of 2 km
#   radius over the head of the Monterey Canyon off Moss Landing, where MBARI runs its own, 1.3 to
#   5.3 km from the Moss Landing station (the acoustic link's propagation counts from it: under
#   4 s). They start at the surface on their ring (members some 125 m apart; the sonar's reach,
#   about 270 m, overlaps).
# - RESERVE, the two armed MQ-9Bs (mq9b_armed), loitering at 7,600 m over the gulf west of the
#   Gate, 5 km or more from where the armed drone holds (sim/situations/swarm-saturation.toml), so
#   their way to it crosses no no-go area. No script orders them; every task for them waits for a
#   person. SATCOM: no station.
#
# Opening orders (one per swarm but the reserve, to all its members as one intent):
# sim/situations/swarm-saturation.toml.
title = "Saturation: 3,602 stand-ins in 37 swarms from Bodega Bay to Monterey Bay"

