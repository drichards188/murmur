# Saturation (sim/situations/swarm-saturation.toml): 3,602 stand-ins in 37 swarms over the region
# from Bodega Bay to Monterey Bay, one operator. Each [[swarm]] table is one swarm and its members
# (sim/swarm.py, "swarms"): uids follow the swarms in this order, each swarm's members in its
# layout's order, so SURFACE-3's first USV is uid 3201 as in the packed layout
# (sim/fleets/swarm-saturation.toml, kept for performance work). Every member is a stand-in
# (`sim = "standin"`), so the whole force runs in one engine process.
#
# The same force as the packed layout, laid out as a planner covering the region would: each
# group where its own radio reaches one of the situation's thirteen ground stations
# (sim/situations/links/swarm-saturation-bay-region.toml), guarding something, and launched or
# spawned close enough to be on station within a few minutes of its order. scripts/
# layout_reach.py checks every group's way against the stations, and the spacing and area.
#
# - PICKET-1 to -17, 1,700 X10-class quadcopters (EO/IR, mesh radio: 5 km clean, 12 km at most;
#   endurance_h 0.65, 39 min; cruise 12 m/s). Picket rings round the things a drone attack would
#   go for: Bodega Harbor; seven in San Francisco Bay (the Golden Gate's mouth, the strait, the
#   city front, the Bay Bridge, the Port of Oakland, Coast Guard Island, Richardson Bay); three
#   at Half Moon Bay (Montara, Pillar Point, the harbor: the approach the jammer takes); Santa Cruz
#   (the harbor, West Cliff); Moss Landing (the power plant and its battery store, the harbor and
#   MBARI); Monterey (Cannery Row, Point Pinos). Each ring is 1.3 to 1.8 km in radius, centred
#   within about 4 km of a station, so every point of it is within the mesh's 5 km or very near
#   it. Spacing: an X10's camera finds a small drone at about 1.5 km (the catalog's `range_m`;
#   its `physical_reach_m`, 15.8 km against the reference 3 m aircraft, scaled by a small drone's
#   0.35 m: about 1.8 km), so neighbouring rings a few kilometres apart overlap as pickets do.
#   Each member has a slot of its own (`slots`): the 100 slots evenly round the circle 150 m
#   inside the ring, 72 to 104 m apart, each member orbiting its own at 150 m, so the ring's
#   orbits fill the band out to its radius; and the 39 minutes of endurance and the policy's 20 %
#   reserve keep the ring within a few kilometres of the launch field (transit, 15 minutes on
#   task and the way home: rules' `reserve`). The launch fields are each member's home, where a
#   lost link's failsafe brings it: a flat field near its ring (a block 6 or 8 m apart), a known
#   one (an airfield, a park, a lookout's lot), on land at the ground's height on tidewater's
#   terrain (eval/tests/test_swarm.py checks every member). Each ring's floor is 100 m, or higher
#   where it passes over high ground (150 to 350 m: Bodega Head, Hawk Hill's slopes at the Gate's
#   mouth, the hills above Sausalito, Pacific Heights, Yerba Buena Island, the foothills above
#   Montara and El Granada, New Monterey), at least 25 m over the highest ground under each
#   member's own orbit and its way home on that terrain; its members fly five levels 15 m apart
#   from it, slot k at level k mod 5, so orbits that overlap (a slot's next four on each side)
#   never share a height. Where two rings cross (PICKET-14 and -15 at Moss Landing) the second's
#   floor clears the first's top level.
# - SEARCH-1 to -10, 1,000 Puma 3 AE-class fixed wings (EO/IR, LOS radio: 15 km clean, 25 km at
#   most; endurance_h 2.5). Lanes over the sea within 15 km of a station from end to end, the
#   approaches a threat from the sea would take: off Bodega Head, off Point Reyes (the northern
#   traffic lane), west and east of the Farallones (the western lane), off the Golden Gate, the
#   southern approach off Pacifica and Montara, off Pescadero and Pigeon Point, and three over
#   Monterey Bay. A Puma's camera finds a 5 m boat at about 14 km (`physical_reach_m` surface,
#   14.5 km against the reference 5 m surface contact), so lanes 15 to 25 km apart overlap. Each
#   member has a stretch of its own (`lanes`): the group's lane cut into 10 stretches along it and
#   10 lanes across it 60 m apart (600 m in all), member k patrolling stretch k // 10, lane k % 10,
#   less a tenth of the stretch at each end, at one of four levels 30 m apart from 300 m (lane k %
#   10 at level (k % 10) mod 4), so side by side lanes never share a height. Each starts on its
#   stretch's first point at its level (sim/swarm.py `start_at`); its home is its place on the
#   group's line 700 to 1,000 m up, which a stand-in plane keeps on the sea's surface below it.
#   300 m and up: most stations stand on headlands that see the sea, where the packed layout's one
#   station at Crissy Field needed 800 m; every stretch is within 15 km of a station.
# - RELAY-1 to -3, 300 more Pumas along a chain from Point Reyes to the Farallones (the island
#   station's back-up link to the mainland), each swarm a third of it, flown back and forth in the
#   same stretches (`lanes`). A relay in role and place only: the link emulator links every
#   vehicle to the best station directly and carries no vehicle's traffic through another, so the
#   chain's middle sits 16.5 km from either end's station, a little past the LOS radio's clean
#   15 km.
# - SURFACE-1 and -2, 200 Saildrone Explorer-class USVs (wind, 2 m/s, SATCOM: no station). Ocean
#   pickets far out: a ring on the western traffic lane in the middle of the Gulf of the
#   Farallones, and a ring on Cordell Bank, the northern lane's offshore approach. Each ring 5 km
#   in radius (100 members some 310 m apart; a Saildrone's camera finds a 5 m boat at about 6 km).
#   Each holds its own place round its ring (a hold: station keeping where it spawns).
# - SURFACE-3 to -5, 300 Corsair-class USVs (EO/IR 8 km, AIS and ESM, 8 m/s, SATCOM). SURFACE-3
#   rings the San Francisco Bar, where the main ship channel crosses it (2 km radius); SURFACE-4
#   the central bay between Alcatraz, Angel Island and Treasure Island (1.5 km); SURFACE-5 a lane
#   across Monterey Bay from off Santa Cruz to off Moss Landing. Each holds its own place on its
#   ring (94 to 126 m apart: too close for boats' own orbits, which share the surface) or along
#   its lane (200 m apart).
# - UNDERSEA-1, 100 REMUS 600-class AUVs (active sonar, 2 m/s, acoustic modem): a ring of 1.5 km
#   radius over the head of the Monterey Canyon 3.5 km west of Moss Landing, 3.8 to 6.8 km from
#   the Moss Landing station (the acoustic link's propagation counts from it: under 5 s). Each
#   orbits its own slot (`slots`, 50 m round it, the slots some 91 m apart) at its 40 m depth,
#   with 50 m of water or more under every one at the window's lowest tide; the 2 km ring east of
#   it, which one order to all of them flew, had half its members over the shelf in 13 to 40 m.
#   They start at the surface on their slots, where the modem gives way to the mast's radio and
#   the order comes in before they dive (the sonar's reach, about 270 m, overlaps).
# - RESERVE, the two armed MQ-9Bs (mq9b_armed), loitering at 7,600 m over the gulf west of the
#   Gate, 5 km or more from where the armed drone holds (sim/situations/swarm-saturation.toml), so
#   their way to it crosses no no-go area. No starting task: no script orders them, and every task
#   for them waits for a person. SATCOM: no station.
#
# Starting tasks (decision rules 29, bd murmur-by3s; one order per vehicle, each with its own
# geometry, bd murmur-xlca): each group's `start` is its area as Saturation's group orders had it
# (a picket ring, a lane, the relay chain, the AUVs' ring), shared out so that every member has a
# station of its own (`slots`, `lanes`; sim/swarm.py "starting tasks"), or a hold where each
# boat spawns. Every vehicle starts on its station and the bridge hands its order over at the
# start. The groups are for display only (the Swarms panel, the fleet list, the Inbox's fold).
title = "Saturation: 3,602 stand-ins in 37 swarms from Bodega Bay to Monterey Bay"

# ---------------------------------------------------------------- air pickets (X10, rings)
# Each field: its name and its ground on tidewater's terrain (`bay-region-2026-06`, each cell from
# the finest DEM; its grids are 15 m at the Gate, 30 m in the Bay, 90 m outside it): every cell of
# the block above the highest water of the scenario's window (2.8 m NAVD 88, Redwood City), alt_m
# at or above its highest cell, so a copter at rest is never under the ground, and within 3 m of
# the ground under every member (eval/tests/test_swarm.py, from tidewater's cache).
[[swarm]]
id = "PICKET-1"
name = "Bodega Harbor"
role = "picket"
color = "#7fb8ff"
platform = "x10"
count = 100
sim = "standin"
cruise_alt_m = 150
layout = "block"                     # Doran Beach, the harbor's sand spit, by the park's entrance (2.9 to 3.6 m)
center = { lat = 38.31430, lon = -123.03720 }
columns = 10
spacing_m = 8
alt_m = 4
start = { task = "orbit", center = [-123.0480, 38.3080], radius_m = 1800 }   # picket ring over Bodega Harbor
slots = { radius_m = 150, levels = 5, level_step_m = 15 }

