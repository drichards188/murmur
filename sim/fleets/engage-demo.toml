# Engagement demo (Phase E): stand-in armed platforms and sensor platforms around the Golden
# Gate, for the engagement decision chain against sim/scenarios/golden-gate-engage.toml (a
# fast boat holding west of the bridge, a harbor tour boat circling nearby). Stand-ins
# only: no ArduPilot SITL needed.
#   MURMUR_CONTACTS=sim/scenarios/golden-gate-engage.toml make goldengate GG_FLEET=engage-demo
#   (with MURMUR_ENGAGE_OPERATORS=op-2,op-3 MURMUR_OPERATORS=op-1 for two approvers)
# The effect is an abstract event (a point, a radius, a time); see docs/PLAN.md, Phase E.
title = "Engagement demo: armed stand-ins and sensors at the Gate"

[[unit]]
platform = "switchblade"               # armed; EO/IR 3 km (it also covers the effect point)
sim = "standin"
count = 1
spawn = [37.8070, -122.4600, 80, 270]  # over the Presidio, airborne
[[unit]]
platform = "magura"                    # armed USV-S (catalog armed = true); radar, EO/IR, AIS
sim = "standin"
count = 1
spawn = [37.8280, -122.4700, 0, 180]   # off Horseshoe Bay
[[unit]]
platform = "ugv_armed"                 # armed UGV on land: can't reach a target on the water
sim = "standin"
count = 1
spawn = [37.8050, -122.4520, 5, 0]     # Crissy Field, near the ground station (line of sight)
[[unit]]
platform = "corsair"                   # sensor ship: radar 20 km, EO/IR 8 km, AIS
sim = "standin"
count = 1
spawn = [37.8200, -122.4650, 0, 270]   # east of the bridge, mid-channel
[[unit]]
platform = "x10"                       # quadcopter at Crissy Field (EO/IR 1.5 km): a vehicle of
sim = "standin"                        # ours the keep-out must account for. Behind terrain from
count = 1                              # the ground station (Fort Point) it would be lost, and a
spawn = [37.8055, -122.4480, 5, 0]     # lost vehicle counts as anywhere it could have reached
