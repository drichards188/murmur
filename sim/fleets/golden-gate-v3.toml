# Golden Gate v3 (sim/worlds/golden-gate-v3.toml; docs/WORLD-V3-PLAN.md section 5): 20 stand-ins
# across every domain at the Gate, the plan's list exactly (8 air, 4 surface, 5 subsurface, 2
# ground, the antenna tracker). Stand-ins only (the headless simulator runs nothing else).
#
# Where each starts, checked against the world's baked grids (eval/headless/tests/
# test_worlds_v3.py): aircraft on the ground at a launch site (Crissy Field, the old airfield
# beside the ground station, and Fort Baker's parade ground), except REAPER 1 and HAWK 1, which
# fly in from their bases outside the map and are on station at the start, and ZEP 1, aloft over
# the Marin Headlands; boats at the Coast Guard station's pier in Horseshoe Bay (Fort Baker) or
# at a mooring off the Marina; the Saildrone at sea (it lives there for months); REMUS 1 at the
# surface in the channel, the BlueROV at the Horseshoe Bay pier, the buoys in the channel's deep
# water (37 to 112 m); the UGVs and the tracker on land. A spawn's altitude is the surface's
# height there (the baked grid's, rounded), so the ground units sit on the ground.
#
# uids follow the unit order (sim/swarm.py): 1 REAPER 1, 2 HAWK 1, 3 PUMA 1, 4 PUMA 2, 5 SKY 1,
# 6 SKY 2, 7 KESTREL 1, 8 ZEP 1, 9 HUNTER 1, 10 MARLIN 1, 11 VIPER 1, 12 ALBATROSS 1, 13 REMUS 1,
# 14 EEL 1, 15-17 DRIFT 1-3, 18 FERRET 1, 19 MULE 1, 20 TRK 1. Opening orders:
# sim/situations/golden-gate-v3-watch.toml.
title = "Golden Gate v3: 20 stand-ins across every domain"

# ---- air
[[unit]]
platform = "mq9b"                      # MALE ISR, full kit (radar, EO/IR, AIS); on station from its base
sim = "standin"
spawn = [37.8050, -122.5400, 3000, 90] # west of the Gate, airborne at 3000 m

[[unit]]
platform = "rq4"                       # HALE ISR on a far orbit offshore
sim = "standin"
spawn = [37.7000, -122.8000, 18000, 0] # about 30 km west-south-west, airborne at 18,000 m

