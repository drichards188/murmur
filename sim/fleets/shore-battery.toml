# Shore battery (sim/situations/shore-battery.toml): a sensor ship and the armed UGV at the Golden
# Gate. Stand-ins only, so the situation starts in seconds and needs no ArduPilot build, and the
# stand-ins act out damage.
#
# uids follow the unit order (sim/swarm.py): 1 HUNTER 1, 2 BULL 1. The situation's contacts name
# HUNTER 1 by its uid (the hostile acts' victim); its opening order and timeline select them by
# callsign.
#
# Where each one is, and why (the engagement checks read every one of ours):
# - HUNTER 1, the sensor ship (radar 40 km, EO/IR 15 km), patrols a short leg mid-channel just west
#   of the bridge, 900 m to 1 km from the boats' holding points: near enough for its camera to
#   identify a small boat by day (the nomination's target-identity check wants 0.60; from 2 km, east
#   of the bridge, it reached about 0.45 on the first runs, and BULL 1's own sight, once it holds an
#   engagement's firing position, searches only round itself), far enough to stay out of every
#   keep-out there.
# - BULL 1, the armed UGV (ugv_armed: an EOS R400-class station with an M2 .50 and one FGM-148
#   Javelin; its sight a 640 px MWIR and a 1,920 px day camera), on the high ground at the bridge's
#   south end, some 90 m above the water and in line of sight of the radios at Crissy Field (its
#   mesh link is down wherever the Presidio's hills stand between: the bluff further west was, on
#   the first run): 1,740 m from the first boat's holding point and 1,190 m from the second's. Both
#   are inside the Javelin's band from rules 28 (its 65 m minimum range plus the effect radius, to
#   its 4,750 m less it), and the second inside the M2's reach less the effect radius (1,750 m), so
#   each engagement's firing position is where BULL 1 stands: it never moves. A script may not
#   move an armed platform: it has no opening order. Its spawn altitude is the ground's (the DEM's
#   93 m): a stand-in UGV follows the terrain from its home's altitude, and the link emulator
#   judges its line of sight from the altitude it reports (spawned at 0 m it read as under the hill).
#   make situation NAME=shore-battery   (or make up FLEET=shore-battery)
title = "Shore battery: a sensor ship and the armed UGV at the Gate"

[[unit]]
platform = "seahunter"                 # sensor ship (MUSV): radar 40 km, EO/IR 15 km, AIS 50 km; 1000 h
sim = "standin"
spawn = [37.8140, -122.4840, 0, 0]     # west of the bridge, mid-channel, at its patrol leg's south end

[[unit]]
platform = "ugv_armed"                 # armed UGV: M2 .50 (500 rounds) and one Javelin; 15 h
sim = "standin"
spawn = [37.8065, -122.4765, 93, 280]  # on the high ground at the bridge's south end, 93 m up
