# HIV3 salvo (sim/situations/hiv3-salvo.toml): a sensor ship and a drone-launcher UGV at the Golden
# Gate. Stand-ins only, so the situation starts in seconds and needs no ArduPilot build.
#
# uids follow the unit order (sim/swarm.py): 1 HUNTER 1, 2 HIVE 1.
#
# - HUNTER 1, the sensor ship (seahunter: radar 40 km, EO/IR 15 km), patrols a short leg mid-channel
#   just west of the bridge, as in shore-battery: its camera identifies the two range targets (about
#   1 km from each) and covers each strike point for the assessment, and it stays out of every
#   keep-out (900 m or more from either target).
# - HIVE 1, the drone-launcher UGV (ugv_launcher: 18 rounds of an HIV3-class launcher, 300 to 10,000
#   m), on the high ground at the bridge's south end where shore-battery's BULL 1 stands: some 60 m
#   above the water, in line of sight of the radios at Crissy Field (the same place, laid on the
#   terrain fixed by murmur-cbjn), 1,720 m from the first target and 1,170 m from the second. Both
#   are inside the launcher's band, so each plan's firing position is where HIVE 1 stands: it never
#   moves (rules 28). An armed platform gets no opening order.
#   make situation NAME=hiv3-salvo
title = "HIV3 salvo: a sensor ship and a drone-launcher UGV at the Gate"

[[unit]]
platform = "seahunter"                 # sensor ship (MUSV): radar 40 km, EO/IR 15 km, AIS 50 km; 1000 h
sim = "standin"
spawn = [37.8140, -122.4840, 0, 0]     # west of the bridge, mid-channel, at its patrol leg's south end

[[unit]]
platform = "ugv_launcher"              # drone-launcher UGV: 18 rounds of the HIV3-class launcher; 15 h
sim = "standin"
spawn = [37.8064, -122.4768, 60, 280]  # on the high ground at the bridge's south end, 60 m up
