# San Diego (sim/worlds/san-diego.toml; docs/WORLD-V3-PLAN.md section 5): 24 stand-ins in Golden
# Gate v3's domain mix (10 air, 5 surface, 5 subsurface, 2 ground, the antenna tracker), adapted
# from sim/fleets/sandiego.toml's units: its four Pumas, its X10s, the FVR-90 and the airship at
# NAS North Island, its three Corsairs at the North Island piers and its BlueROV, with world v3's
# REAPER, HAWK, Sea Hunter, Magura, Saildrone, REMUS, buoys and UGVs. Stand-ins only.
#
# Where each starts, checked against the world's baked grids (eval/headless/tests/
# test_worlds_v3.py): the small aircraft, the airship and the tracker on the ground at NAS North
# Island beside the runways (sandiego.toml's launch site); REAPER 1 and HAWK 1 on station, flown
# in from their bases off the map; HUNTER 1 alongside at Naval Base Point Loma (in the channel
# north of Ballast Point, clear of the sub base's no-go box), the Corsairs at the North Island
# carrier piers (north face), VIPER 1 off the Naval Amphibious Base in the south bay, the
# Saildrone at sea off Point Loma; REMUS 1 at the surface in the entrance channel, the BlueROV at
# the carrier piers, the buoys along the entrance channel (8 to 15 m of water); the UGVs on North
# Island. Altitudes are the surface's height there, rounded.
#
# uids follow the unit order (sim/swarm.py): 1 REAPER 1, 2 HAWK 1, 3-6 PUMA 1-4, 7 SKY 1, 8 SKY 2,
# 9 KESTREL 1, 10 ZEP 1, 11 HUNTER 1, 12-14 MARLIN 1-3, 15 VIPER 1, 16 ALBATROSS 1, 17 REMUS 1,
# 18 EEL 1, 19-21 DRIFT 1-3, 22 FERRET 1, 23 MULE 1, 24 TRK 1. Opening orders:
# sim/situations/san-diego-watch.toml.
title = "San Diego: 24 stand-ins across every domain"

