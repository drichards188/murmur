# Hostile act to engagement air to air (sim/situations/hostile-act-air-to-air.toml): three stand-ins
# at the Gate, one armed: FURY 1, a CCA with two AIM-120C (air targets only).
#
# uids follow the unit order (sim/swarm.py): 1 HUNTER 1, 2 FURY 1, 3 HUNTER 2. The contacts name
# HUNTER 2 by its uid (the drone's target); the orders and the timeline select by callsign.
#
# Where each one is, and why:
# - HUNTER 1, the sensor ship, patrols the tutorial's leg 0.9 to 1.2 km east of the drone's
#   station, just west of the bridge (sim/fleets/tutorial.toml gives the measurements): its
#   panoramic camera and radar hold the drone at 300 m the whole time, so the track is
#   identified before anyone nominates (bd murmur-9sxm) and seen within the 5 s the engagement
#   checks ask for. It stays out of the keep-out (the effect radius plus 200 m) by some 500 m.
# - HUNTER 2, a second Sea Hunter, pickets the approach off Lands End 3.5 to 3.9 km southwest of
#   the drone's station (inside the operating area, `gg-ops`, north of the yacht and the drifting
#   fishing boat, south of the shipping lane): the drone's target (bd murmur-qese). It is not the
#   sensor the chain needs, and it is far enough from the effect point that, sunk, its last report
#   reaches the keep-out only after some nine minutes at its 6 m/s cruise (a lost friendly counts
#   anywhere its cruise speed takes it from there, rules 6), well after the engagement's strike.
# - FURY 1, the CCA, circles at its 11,000 m cruise altitude off the coast to the southwest where
#   it spawns (an armed platform gets no script's order; its loiter circle is 6 km), some 6 to 12
#   km from the drone. Its own radar and camera see the drone too. The AIM-120C is
#   released once FURY 1 is within 1 to 90 km of slant range and the missile's flight (about 1,000
#   m/s on average) lands inside the plan's time.
title = "Hostile act to engagement air to air: three stand-ins at the Gate, one armed"

[[unit]]
platform = "seahunter"                 # sensor ship (MUSV): radar 40 km, EO/IR 15 km, AIS 50 km; 1000 h
sim = "standin"
spawn = [37.8130, -122.4850, 0, 0]     # west of the bridge, mid-channel, at its patrol leg's south end

[[unit]]
platform = "cca"                       # armed jet UAS: two AIM-120C, air targets only; 3 h
sim = "standin"
spawn = [37.7900, -122.5500, 11000, 0] # off the coast southwest of Lands End, at its cruise altitude

[[unit]]
platform = "seahunter"                 # the picket off Lands End, the drone's target
sim = "standin"
spawn = [37.7880, -122.5270, 0, 0]     # at its picket leg's south end
