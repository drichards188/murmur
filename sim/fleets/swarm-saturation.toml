# Saturation (sim/situations/swarm-saturation.toml): 3,602 stand-ins in 37 swarms at the Golden
# Gate, one operator. Each [[swarm]] table is one swarm and its members (sim/swarm.py, "swarms"):
# uids follow the swarms in this order, each swarm's members in its layout's order. Every member
# is a stand-in (`sim = "standin"`), so the whole force runs in one engine process.
#
# What each swarm is, and why that type (the figures are sim/platforms.toml's and sim/links.toml's;
# the situation runs 15 minutes, with a minute or two of setup before it):
# - PICKET-1 to -17, 1,700 X10-class quadcopters. Why: a small unarmed ISR copter (EO/IR 1.5 km),
#   endurance_h 0.65 (39 min: 15 min on station plus the transit leaves the policy's 20 % reserve),
#   cruise 12 m/s, and it hovers on a ring. Its link is the mesh class: 5 km clean, 12 km at most
#   from the ground station at Crissy Field, and blocked by terrain: the bridge's predicted
#   coverage (/api/links/coverage) reaches the strait and the bay north of the city, nothing
#   south of the Presidio's hills. So every ring is over the strait or the bay, inside that
#   coverage at 100 m, and every launch field inside it at the ground; a ring the radio does not
#   reach would never hear its order. Not the FPV strike quadcopter: armed (and 9 min of
#   endurance_h 0.15), and a script may not order an armed platform. Copters start on the ground,
#   so each picket launches from a flat field on land (a block 8 m apart), at the baked grid's
#   height there (eval/tests/test_swarm.py checks it).
# - SEARCH-1 to -10, 1,000 Puma 3 AE-class fixed wings. Why: EO/IR 4 km, cruise 20 m/s to cover a
#   lane, endurance_h 2.5, and the LOS radio, the small-UAS link that reaches furthest (15 km
#   clean, 25 km at most): the lanes over the inner Gulf of the Farallones are 9 to 17 km west of
#   the ground station. They start aloft over the sea along their lanes, 1,000 to 1,300 m up, and
#   fly them from 800 m: below about 600 m the Presidio's and Lands End's hills hide the gulf from
#   the ground station (the predicted coverage). Real Pumas fly far lower; with one ground station
#   at Crissy Field, height is what keeps them in reach (the relay the chain stands for would).
# - RELAY-1 to -3, 300 more Pumas flying a chain along the Presidio shore and out over the sea
#   toward the lanes, back and forth along it (a patrol), from 800 m. Why:
#   a relay chain is a line of small UAS, each holding long enough (endurance_h 2.5 against 15
#   minutes) on the radio that reaches furthest (LOS, above), launched aloft like the search
#   swarms. Not airships: no force fields them in hundreds. Not X10s: a copter starts on the
#   ground and a hold keeps it there, and the mesh class ends 12 km out. What the chain does not
#   do: the link emulator (crates/murmur-linkemu, sim/links.toml) links every vehicle straight to
#   the ground station and carries no vehicle's traffic through another, whatever its profile, so
#   the chain is a relay in role and place only, and the search lanes stay inside the LOS radio's
#   own reach.
# - SURFACE-1 and -2, 200 Saildrone Explorer-class USVs. Why: unarmed, wind-powered (2 m/s,
#   endurance_h 8760), SATCOM (Starlink), the ocean picket type: rings at sea off Ocean Beach and
#   off Point Bonita. SURFACE-3 to -5, 300 Corsair-class USVs. Why: unarmed, EO/IR 8 km, AIS and
#   ESM, 8 m/s, endurance_h 64, SATCOM: two rings in the strait and the central bay, and a lane
#   north of Alcatraz. Not Magura V5s: armed. They start at sea in blocks 30 m apart.
# - UNDERSEA-1, 100 REMUS 600-class AUVs. Why: the catalog's survey AUV (active sonar, 2 m/s,
#   endurance_h 24, acoustic modem with SATCOM on the surface): a ring under the bridge, where the
#   channel is deepest. They start at the surface east of it.
# - RESERVE, the two armed MQ-9Bs (mq9b_armed: radar, EO/IR, a Hellfire-class missile of 8 km
#   slant range, endurance_h 35), loitering at 7,600 m off Lands End, west of the bridge so their
#   way to the strait crosses no no-go area (as in hostile-act-engagement). No script orders them;
#   every task for them waits for a person.
#
# Opening orders (one per swarm but the reserve, to all its members as one intent):
# sim/situations/swarm-saturation.toml.
title = "Saturation: 3,602 stand-ins in 37 swarms at the Golden Gate"

