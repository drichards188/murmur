# Rules 5 engagement demo (murmur-der.2, murmur-der.3): the engagement demo's armed and sensor
# stand-ins, and one of our MALE aircraft circling high over the target's holding area, for
# sim/scenarios/golden-gate-engage-keepout.toml (a distant fast ferry, a fast ferry that
# comes near, an aircraft at 3,000 m). Stand-ins only: no ArduPilot SITL needed.
#   MURMUR_OPERATORS=op-1,op-2,op-3 MURMUR_ENGAGE_OPERATORS=op-2,op-3 \
#   make goldengate GG_FLEET=engage-keepout-demo CONTACTS=sim/scenarios/golden-gate-engage-keepout.toml
# - the MQ-9B-class aircraft at 7,000 m circles 3.5 km around the holding point: its circle
#   covers the effect point, so a 2D keep-out blocked every engagement there; in 3D it is
#   thousands of metres above a surface effect;
# - the Magura-class USV (LEO SATCOM, a 30 s lost-link timer) takes fallback loiter: at
#   dispatch its FS_ACTION is set to 6 (Loiter) and its FS_GCS_TIMEOUT to the approval's 5 s,
#   read back, and put back after;
# - the Switchblade-class fixed wing can only take fallback return (ArduPlane has no lost-link
#   action that holds where it is).
# The effect is an abstract event (a point, a radius, a time); see docs/PLAN.md, Phase E.
title = "Rules 5 engagement demo: armed stand-ins, sensors and a high friendly at the Gate"

[[unit]]
platform = "switchblade"               # armed; EO/IR 3 km
sim = "standin"
count = 1
spawn = [37.8070, -122.4600, 80, 270]  # over the Presidio, airborne
[[unit]]
platform = "magura"                    # armed USV-S; radar, EO/IR, AIS
sim = "standin"
count = 1
spawn = [37.8280, -122.4700, 0, 180]   # off Horseshoe Bay
[[unit]]
platform = "corsair"                   # sensor ship: radar 20 km, EO/IR 8 km, AIS
sim = "standin"
count = 1
spawn = [37.8200, -122.4650, 0, 270]   # east of the bridge, mid-channel
[[unit]]
platform = "x10"                       # quadcopter at Crissy Field, near the ground station
sim = "standin"
count = 1
spawn = [37.8055, -122.4480, 5, 0]
[[unit]]
platform = "mq9b"                      # one of ours, MALE, on station over the target area
sim = "standin"
count = 1
spawn = [37.8120, -122.4950, 7000, 90] # loitering 3.5 km around the holding point
