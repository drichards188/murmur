# Contact catalog: what each kind of contact that is not ours is, and what it carries (bd
# murmur-y85j.1, docs/AUTONOMOUS-NODES.md section 2.1). Read by crates/murmur-contacts
# (`catalog.rs`, compiled in); a scenario's `[[contact]]` names one of these kinds in `kind`.
#
# Names use "-class", as sim/platforms.toml does: game-level stand-ins for a class of craft or
# weapon, tuned to rounded public figures, not models of a particular one.
#
# name         what the kind is, in words (truth only).
# domain       air | surface | subsurface | ground.
# looks_like   the kind our sensors and the C2 see (decision D3): an armed variant passes for its
#              civilian twin until it acts. The contacts process publishes the look-alike as the
#              truth message's `kind` and this kind as its truth-only `variant`. Absent: itself.
# signature, emits, turn_dps, alt_m
#              the defaults a contact of the kind takes when its scenario gives none: the legacy
#              sensing model's detection-range multiplier (the physical model reads the bridge's
#              own signature table by kind, tracks/physical/signature.rs), whether it has a radar
#              or transponder an ESM receiver hears, its turn rate, its height (negative: depth).
#              Moved here unchanged from the `KINDS` table this file replaces; rounded and
#              indicative (an armed variant takes its look-alike's).
# cruise_mps, max_mps
#              its usual and top speed through the water, over the ground or in the air: what a
#              node's own steering will read (stage 2: closing on a target, fleeing).
# sensors      what the node itself sees (decision D2: our vehicles within this reach and above
#              the radio horizon), m: `eye_m` (lookouts, a sight or a camera), `radar_m`, `sonar_m`.
#              Given for every armed kind (an attack order needs a target it perceives).
# armed        true for a kind with a loadout (and only then).
# expended_by_effect
#              true for a kind that is its own weapon (a `self` loadout entry: a one-way drone, an
#              explosive boat), as sim/platforms.toml.
# loadout      the weapons it carries, in the order its fire control picks one when an order names
#              none (the first meant for the target's domain with rounds left), each in the shape
#              of our catalog's (crates/murmur-decide catalog.rs `WeaponFacts`; sim/platforms.toml
#              says what each key means), plus two truth-side keys:
#                reload_s  seconds from one shot of a missile, rocket or torpedo to the next (a
#                          gun has `burst_interval_s` instead; `self` neither);
#                sense     which of the bridge's weapon signatures our sensors see it by: `atgm`
#                          (the only one with figures today, tracks/physical/weapon.rs), `rocket`,
#                          `air_missile`, `gun`, `torpedo` (stage 3 adds their figures). None for
#                          `self`: the node itself is what is seen.
#              `effects` are keyed by contact kind as ours are: our vehicles read as one of them
#              (crates/murmur-contacts damage.rs `ours_kind`: the Sea Hunter a fishing vessel, the
#              Saildrone a sailboat, other boats a small fast boat, UGVs a vehicle, large aircraft
#              a light aircraft, other aircraft a small drone, under water a UUV).
# sources      one tag per figure, as docs/research/opponent-weapons.md gives it: [n] a reference
#              there, [E] an estimate with its basis there. Keys: `cruise_mps`, `max_mps`,
#              `sensors`, and per weapon (by name) every figure it lists: `count`, `min_range_m`,
#              `max_range_m`, `speed_mps`, `guidance`, `warhead`, `effects`, and each of
#              `burst_rounds`, `rate_rpm`, `burst_interval_s`, `reload_s` it has. A test fails a
#              figure without one.
#
# Nothing fires from this file yet: stage 2 (bd murmur-y85j.2) gives the nodes their fire control.
# Never author a node's figures to make a situation work (docs/AUTONOMOUS-NODES.md 2.1, as
# decision W3 for our sensors): an author moves the node or times its order instead.

