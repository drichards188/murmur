# Platform catalog: what each kind of node is, how it's simulated, and how it talks.
#
# Names use "-class": these are simulated stand-ins tuned to approximate public figures
# (speed, altitude, endurance) of the named platform type, not models of the real aircraft
# or vessels. Figures are rounded and indicative only.
#
# sim = "sitl"     a real ArduPilot SITL vehicle; `vehicle` picks the firmware/model in
#                  swarm.py's VEHICLES table, `params` tune it toward the platform.
# sim = "standin"  a lightweight MAVLink-speaking kinematic model (crates/murmur-standins) for
#                  platforms ArduPilot SITL can't credibly fly (HALE at 18 km, AUVs, ships).
#                  `behavior` picks which ArduPilot autopilot it imitates (mode numbers,
#                  MAV_TYPE), so the C2 bridge needs no special cases. SITL platforms with a
#                  stand-in behavior carry it too, for fleets that force `sim = "standin"`.
#
# link: los | mesh | satcom | acoustic | tether   (used by the link emulator, phase D)
# alt_m: cruise altitude above sea level; negative = operating depth for subs (stand-ins:
#        the bridge tasks them at this altitude/depth).
# typical_alt_m, cruise_mps, endurance_h on SITL platforms: display only (the Platforms
#        panel), matching how the sim flies them; tasking for SITL uses per-autopilot defaults.
#        Endurance is left out where we don't have a figure we trust.
# short: compact model label shown on the map symbol.
# armed: true for platforms that carry an effect; any task on them needs a human
#        (sim/policy.toml). Omitted means false.
#
# protocol: how a C2 reaches the real platform: mavlink | stanag4586 | uci | jaus | umaa |
#        proprietary | rc | telemetry. Every node speaks MAVLink in the sim whatever this says;
#        this is the real-world protocol it imitates.
# protocol_note, authenticity, authenticity_blocker: one line each, shown in the Platforms
#        panel: why that protocol, what maximum authenticity would take, and what stops it
#        (omitted when nothing does). Source of truth: docs/AUTHENTICITY.md.
#
# sensors: what the platform can detect contacts with (Phase C2 sensing model, read by the
#        bridge's tracker: crates/murmur-bridge/src/tracks/sensing.rs). One or more of
#          { type = "radar"|"eo_ir"|"ais"|"sonar"|"esm", range_m = N, guess = true }
#        range_m is the range at which a nominal contact (signature 1.0) is detected with
#        probability 0.5; detection falls off steeply beyond it and is zero past 1.5x. Air,
#        surface and ground contacts need radar, EO/IR or ESM (and a radio horizon); AIS
#        hears cooperative ships only; subsurface contacts are heard by sonar alone. These
#        are "-class" ballpark figures from public descriptions, rounded; guess = true marks
#        the ones that are an estimate rather than a published number (most of them).
#        No sensors: the platform sees nothing (antenna tracker).
#        That is the legacy sensing model's reading. The physical model (docs/SENSING.md;
#        crates/murmur-bridge/src/tracks/physical/spec.rs) reads more fields of the same entry:
#          eo_ir: slew_dps, channels = [{ band = "day"|"lowlight"|"mwir"|"lwir", wide_deg,
#                 narrow_deg, px, blur_urad, panoramic }]
#          radar: r50_m and rcs_ref_m2 (Pd 0.5 per scan), scan_s (at most 5: decision W2),
#                 beam_deg, cell_m, band_ghz
#          sonar: mode = "passive"|"active", freq_khz, ranges = { <kind> = m } (Pd 0.5 in 50 m of
#                 water, 5 m/s wind), max_m, scan_s
#          esm:   s_min_dbm, bearing_deg
#        A sensor without them runs on placeholders derived from range_m (the bridge lists them
#        when the physical model starts); range_m itself stays what the decision engine reads.
# mast_m: height of a surface vessel's sensors above the water, for the radio horizon
#        (default 3 m; aircraft use their altitude, submerged vehicles have no horizon).
# standin_params: ArduPilot parameters a stand-in of this platform sets over its firmware's
#        defaults (sim/swarm.py `standin_params`; the lost-link timer it sets per vehicle
#        still wins). Unlike `params`, never given to a SITL vehicle: the entry says why.

