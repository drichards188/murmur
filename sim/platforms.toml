# The armed MQ-9B: the same aircraft with its weapons stations loaded (the class carries
# Hellfire-class munitions on its wing stations). A separate entry so that only fleets that ask
# for it are armed: every order for an armed platform waits for a person, and a script may not
# move one. It is not spent by its own effect: it fires and flies on. Every other field is
# [mq9b]'s. Used by sim/fleets/hostile-act-engagement.toml.
