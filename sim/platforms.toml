# ---------------------------------------------------------------- scoring v2 variants
# Why these exist: eval/SCORING-V2.md, section 0 (decision D8). In Harbor watch, REAPER 1's
# EO/IR (40 km) and HUNTER 1's EO/IR and sonar reach the whole 3 km circle around the bridge
# from their opening orders, so a contact is identified before anyone sends a vehicle to it
# and a look cannot matter. In the v2 world they fly the same orders carrying radar and AIS
# only: every contact is still on the picture, but only the Pumas' EO/IR can identify one.
# Each entry is its platform's own (mq9b, seahunter) with eo_ir and sonar taken out; every
# other field is identical. Used by sim/fleets/harbor-watch-v2.toml.
[mq9b_radar]
name = "MQ-9B SkyGuardian-class"
short = "MQ-9B"
role = "MALE ISR/strike UAS"
domain = "air"
sim = "standin"
behavior = "plane"
callsign = "REAPER"
cruise_mps = 90
max_mps = 105
alt_m = 7600
climb_mps = 10
turn_dps = 3
loiter_radius_m = 3500
endurance_h = 35
link = "satcom"
space_class = "wgs"
space_class_alt = "ku-geo"
sidc = "SFAPMFQ--------"
# the base platform's sensors without EO/IR (its radar's physical figures too, as [mq9b])
sensors = [
  { type = "radar", range_m = 100000, guess = true, r50_m = 300000, rcs_ref_m2 = 10000, scan_s = 5, beam_deg = 3, cell_m = 15, band_ghz = 16.7 },
  { type = "ais", range_m = 150000, guess = true },
]
protocol = "stanag4586"
protocol_note = "GA-ASI's ground control station is STANAG 4586-based"
authenticity = "JSBSim MALE airframe plus 4586 (matches GA-ASI's 4586-based GCS)"
authenticity_blocker = "Proprietary flight software"

