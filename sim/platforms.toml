# Platform catalog: what each kind of node is, how it's simulated, and how it talks.
#
# Names use "-class": these are simulated stand-ins tuned to approximate public figures
# (speed, altitude, endurance) of the named platform type, not models of the real aircraft
# or vessels. Figures are rounded and indicative only.
#
# sim = "sitl"     a real ArduPilot SITL vehicle; `vehicle` picks the firmware/model in
#                  swarm.py's VEHICLES table, `params` tune it toward the platform.
# sim = "standin"  a lightweight MAVLink-speaking kinematic model (crates/murmur-standins) for
#                  platforms ArduPilot SITL can't credibly fly (HALE at 18 km, AUVs, ships).
#                  `behavior` picks which ArduPilot autopilot it imitates (mode numbers,
#                  MAV_TYPE), so the C2 bridge needs no special cases. SITL platforms with a
#                  stand-in behavior carry it too, for fleets that force `sim = "standin"`.
#
# link: los | mesh | satcom | acoustic | tether   (used by the link emulator, phase D)
# alt_m: cruise altitude above sea level; negative = operating depth for subs (stand-ins:
#        the bridge tasks them at this altitude/depth).
# typical_alt_m, cruise_mps on SITL platforms: display only (the Platforms panel), matching how
#        the sim flies them; tasking for SITL uses per-autopilot defaults.
# endurance_h: hours at cruise. The C2's reserves check reads it on every platform (without it,
#        an order needs a person: sim/policy.toml `unknown_endurance`), and a stand-in drains
#        its battery over it. Left out where nothing applies (the antenna tracker). The figures
#        added for murmur-4v7 carry a comment with their source, as the sensors do: [n] a
#        reference of docs/research/sensors.md ("Endurance"), [E] an estimate with its basis.
# short: compact model label shown on the map symbol.
# armed: true for platforms that carry an effect; any task on them needs a human
#        (sim/policy.toml). Omitted means false.
# loadout: the weapons the platform carries in real life (decision rules 24, bd murmur-lbw8.1;
#        crates/murmur-decide/src/catalog.rs `WeaponFacts`), one inline table each, in the order
#        the engine picks one when a nomination names none (the first usable against the target's
#        domain with a round left):
#          { name, kind = "missile"|"bomb"|"torpedo"|"self"|"gun"|"mine", count, min_range_m,
#            max_range_m, speed_mps, profile = "direct"|"lofted"|"glide"|"ballistic"|"dive"|
#            "sea_skimming"|"waterborne"|"laid", guidance, warhead = { class, mass_kg },
#            targets = [domains] }
#        count is rounds per load (each release spends one; a gun's rounds, not bursts); ranges
#        are the slant distance from launch to the effect point, speed an average. A missile,
#        bomb or torpedo flies rules 20's straight slant line at that speed (the profile is
#        recorded, not modelled yet); `self` is the platform itself (a one-way strike, spent by
#        its own effect). Guns and mines are listed but inert until bd murmur-lbw8.3 and .4: no
#        nomination may use one. effects = { <target kind> = { p_hit, p_kill, p_mobility,
#        p_firepower } } (bd murmur-lbw8.2): the chance of a hit on one shot in good conditions,
#        then given a hit the chance it destroys, stops (propulsion lost) or disarms (weapons
#        out, armed targets only) the target; the rest of a hit does no damage. Keyed by contact
#        kind (small_fast_boat, fishing_vessel, sailboat, cargo_ship, vehicle, truck, small_drone,
#        light_aircraft, uuv, person; the other kinds use one of these: catalog.rs
#        KIND_ALIASES); a kind not listed is one the weapon can't engage (no hit). The truth side
#        draws on them (crates/murmur-contacts damage.rs, with the conditions' multipliers); the
#        weapon check shows them (rules 25). Without effects a weapon's effect stays abstract
#        (everything inside the radius out of play). Later stages' optional keys: burst_rounds
#        and rate_rpm (guns), persist_h and trigger (mines). Figures carry a source: [n] a
#        reference of docs/research/weapons.md, [E] an estimate with its basis.
# munition: rules 20's single munition (`{ name, speed_mps, range_m }`), read under rules 20 to 23
#        only (replay of their logs, and runs pinned to them); rules 24 reads the loadout instead.
#
# protocol: how a C2 reaches the real platform: mavlink | stanag4586 | uci | jaus | umaa |
#        proprietary | rc | telemetry. Every node speaks MAVLink in the sim whatever this says;
#        this is the real-world protocol it imitates.
# protocol_note, authenticity, authenticity_blocker: one line each, shown in the Platforms
#        panel: why that protocol, what maximum authenticity would take, and what stops it
#        (omitted when nothing does). Source of truth: docs/AUTHENTICITY.md.
#
# sensors: what the platform can detect contacts with (Phase C2 sensing model, read by the
#        bridge's tracker: crates/murmur-bridge/src/tracks/sensing.rs). One or more of
#          { type = "radar"|"eo_ir"|"ais"|"sonar"|"esm", range_m = N, guess = true }
#        range_m is the range at which a nominal contact (signature 1.0) is detected with
#        probability 0.5; detection falls off steeply beyond it and is zero past 1.5x. Air,
#        surface and ground contacts need radar, EO/IR or ESM (and a radio horizon); AIS
#        hears cooperative ships only; subsurface contacts are heard by sonar alone. These
#        are "-class" ballpark figures from public descriptions, rounded; guess = true marks
#        the ones that are an estimate rather than a published number (most of them).
#        No sensors: the platform sees nothing (antenna tracker).
#        That is the legacy sensing model's reading. The physical model, the default (docs/SENSING.md;
#        crates/murmur-bridge/src/tracks/physical/spec.rs), reads more fields of the same entry:
#          eo_ir: slew_dps, channels = [{ band = "day"|"lowlight"|"mwir"|"lwir", wide_deg,
#                 narrow_deg, px, blur_urad, panoramic }]
#          radar: r50_m and rcs_ref_m2 (Pd 0.5 per scan), scan_s (at most 5: decision W2),
#                 beam_deg, cell_m, band_ghz
#          sonar: mode = "passive"|"active", freq_khz, ranges = { <kind> = m } (Pd 0.5 in 50 m of
#                 water, 5 m/s wind), max_m, scan_s
#          esm:   s_min_dbm, bearing_deg
#        A sensor without them runs on placeholders derived from range_m (the bridge lists them
#        when the physical model starts); every sensor here gives them (a test says so), each
#        value commented with its source: [n] a reference of docs/research/sensors.md, [E] the
#        research's estimate, [E here] an estimate it does not make, each with its basis. Never
#        tune one to make a situation work (decision W3). range_m itself stays the legacy model's
#        reach and what the decision engine reads in a run on that model (an engagement
#        assessment's coverage).
# physical_reach_m: what the decision engine reads instead in a run on the physical model (bd
#        murmur-1u4; docs/SENSING.md, "The decision engine's reaches"): for each radar, EO/IR and
#        sonar, by the domain of the contact it confirms (air, ground, surface, subsurface), the
#        distance out to which the physical model, the sensor pointed at a contact of no known
#        kind in the reference conditions, detects it at least half the time all the way, m (a
#        domain it does not reach left out). Generated from the entries above, never edited:
#        cargo test -p murmur-bridge write_physical_reaches -- --ignored
#        (tracks::tests::reaches fails while a value is not the generator's).
# mast_m: height of a surface vessel's sensors above the water, for the radio horizon
#        (default 3 m; aircraft use their altitude, submerged vehicles have no horizon).
# standin_params: ArduPilot parameters a stand-in of this platform sets over its firmware's
#        defaults (sim/swarm.py `standin_params`; the lost-link timer it sets per vehicle
#        still wins). Unlike `params`, never given to a SITL vehicle: the entry says why.

# ---------------------------------------------------------------- air
[rq4]
name = "RQ-4 Global Hawk-class"
short = "RQ-4"
role = "HALE ISR UAS"
domain = "air"
sim = "standin"
behavior = "plane"
callsign = "HAWK"
cruise_mps = 160
max_mps = 175
alt_m = 18000
climb_mps = 15
turn_dps = 2.5
loiter_radius_m = 9000
endurance_h = 32
link = "satcom"
space_class = "wgs"
space_class_alt = "ku-geo"
sidc = "SFAPMFQ--------"
# physical model:
#   radar: EISS SAR/GMTI to 200 km ([31], secondary) taken as Pd 0.5 on a 10^4 m^2 ship, as the
#     MQ-9B's Lynx [E]; revisit at the W2 cap of 5 s (airborne search 6-12 rpm [E]); X band
#     [E here]. Sea clutter (murmur-qlt): a 1 m range cell, the ISS's wide-area search resolution
#     ([75]: 1 m over 40,000 nmi^2 a day, 0.33 m spots); a 3 degree beam [E here: an aperture of
#     about 0.7 m at X band, 1.2 lambda / D]; a Doppler mode over the sea, its GMTI ([31]; its own
#     motion compensated [E]).
#   eo_ir: EO NIIRS 6 and IR 5.5 ([31]) at the research's IFOVs, 10 and 30 urad [E] (a vehicle
#     identified at about 19 and 6 km): a step-stare imager without zoom, 1,024 px visible and
#     640 px MWIR [E here], fields px x IFOV; slew 60 deg/s [E here, the research's turret rate].
#   esm: to the radio horizon (about 550 km from 18 km [E]); -90 dBm, the sensitive end of the
#     research's -60 to -90 [E]; 1 degree, an interferometer's ([29]).
sensors = [
  { type = "radar", range_m = 200000, guess = true, r50_m = 200000, rcs_ref_m2 = 10000, scan_s = 5, beam_deg = 3, cell_m = 1, band_ghz = 9.6, doppler = true },
  { type = "eo_ir", range_m = 50000, guess = true, slew_dps = 60, channels = [{ band = "day", wide_deg = 0.59, px = 1024, blur_urad = 10 }, { band = "mwir", wide_deg = 1.1, px = 640, blur_urad = 30 }] },
  { type = "esm", range_m = 300000, guess = true, s_min_dbm = -90, bearing_deg = 1 },
]
physical_reach_m = { radar = { air = 9320, ground = 60700 }, eo_ir = { air = 184430, ground = 142300, surface = 198140 } }
protocol = "stanag4586"
protocol_note = "Interop path via a STANAG 4586 vehicle-specific module; the real ground segment is the manufacturer's own"
authenticity = "JSBSim HALE airframe, a 4586 interface and SATCOM latency and bandwidth"
authenticity_blocker = "Real ground segment is the manufacturer's own; no official RQ-4 JSBSim model"

