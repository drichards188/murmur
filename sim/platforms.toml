climb_mps = 10
turn_dps = 3
loiter_radius_m = 3500
endurance_h = 35
# rules 20 (bd murmur-64z): the munition it launches at an engagement's release, flying a straight
# slant line from the aircraft to the effect point at a constant speed; range_m is that slant
# distance at most. From 7,600 m it strikes some 18 s after the release, so the release comes
# that much before the plan's time, from within about 2.5 km of the point on the ground.
munition = { name = "Hellfire-class missile", speed_mps = 425, range_m = 8000 }
# rules 24 (bd murmur-lbw8.1): its loadout ([n]: docs/research/weapons.md's references), the
# research's default for maritime engagements [E]:
# four AGM-114R on two dual rails [2; E: the MQ-9A's usual mix with bombs] and two GBU-12 on the
# middle stations [E: 230 kg [7] within their 270 kg [2]]. No torpedo: no public source arms
# the MQ-9B with one ([11,12]).
#   AGM-114R Hellfire II: 500 to 8,000 m [6]; 425 m/s (Mach 1.3, about 440 [6]); direct or lofted
#     [6]; semi-active laser [6]; a multi-function warhead, about 9 kg [E: the K's tandem HEAT is
#     9 kg [6], the R's mass is not published]; vehicles, boats, people.
#   GBU-12 Paveway II: 1,000 [E: time to acquire the laser spot] to 14,800 m [7]; about 200 m/s on
#     average from 7,600 m [E: a free fall of some 40 s]; free fall, then a terminal glide [7];
#     semi-active laser [7]; a Mk 82, 241 kg (87 to 89 kg of tritonal) [10]; ships, boats,
#     vehicles, buildings.
# effects (bd murmur-lbw8.2): docs/research/weapons.md 10.3 (hit, one shot) and 10.4 (damage
# given a hit), all [E] on the anchors there: the Hellfire's the missile column and the ~9 kg
# warhead's row (Brimstone and Longbow trials against small boats [49,50]; a ship of thousands of
# tonnes only damaged); the GBU-12's the laser bomb column (Vietnam's ~50% direct hits [47], a
# 1.1 m CEP [7]; slow to correct against a mover) and the Mk 82's row (destroys anything smaller
# than a ship).
loadout = [
  { name = "AGM-114R Hellfire II", kind = "missile", count = 4, min_range_m = 500, max_range_m = 8000, speed_mps = 425, profile = "direct", guidance = "semi_active_laser", warhead = { class = "multi_function", mass_kg = 9 }, targets = ["surface", "ground"], effects = { small_fast_boat = { p_hit = 0.75, p_kill = 0.85, p_mobility = 0.10, p_firepower = 0.05 }, fishing_vessel = { p_hit = 0.90, p_kill = 0.55, p_mobility = 0.40 }, sailboat = { p_hit = 0.85, p_kill = 0.65, p_mobility = 0.30 }, cargo_ship = { p_hit = 0.95, p_mobility = 0.45 }, vehicle = { p_hit = 0.85, p_kill = 0.90, p_mobility = 0.10 }, truck = { p_hit = 0.90, p_kill = 0.80, p_mobility = 0.15, p_firepower = 0.05 }, person = { p_hit = 0.80, p_kill = 1.0 } } },
  { name = "GBU-12 Paveway II", kind = "bomb", count = 2, min_range_m = 1000, max_range_m = 14800, speed_mps = 200, profile = "glide", guidance = "semi_active_laser", warhead = { class = "general_purpose_blast", mass_kg = 241 }, targets = ["surface", "ground"], effects = { small_fast_boat = { p_hit = 0.30, p_kill = 1.0 }, fishing_vessel = { p_hit = 0.70, p_kill = 0.95, p_mobility = 0.05 }, sailboat = { p_hit = 0.70, p_kill = 1.0 }, cargo_ship = { p_hit = 0.90, p_kill = 0.10, p_mobility = 0.60 }, vehicle = { p_hit = 0.45, p_kill = 1.0 }, truck = { p_hit = 0.55, p_kill = 1.0 }, person = { p_hit = 0.70, p_kill = 1.0 } } },
]
