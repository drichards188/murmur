[cca]
name = "Collaborative Combat Aircraft (YFQ-42A/44A-class)"
short = "CCA"
role = "Jet combat UAS"
domain = "air"
sim = "standin"
behavior = "plane"
callsign = "FURY"
cruise_mps = 230
max_mps = 260
alt_m = 11000
climb_mps = 40
turn_dps = 8
loiter_radius_m = 6000
endurance_h = 3
# C2 over BLOS SATCOM, as the RQ-4 and MQ-9B (GUESS: CCA datalinks are not public). The
# operator here is a ground station tens of km away from a jet that crosses the LOS class's
# 25 km in two minutes, and that class's range is a small-UAS datalink's (Puma). The control
# path in a fight, an air-to-air tactical link to a crewed lead, has no node in the fleet to
# carry it (docs/DECISIONS.md, murmur-3zj).
link = "satcom"
space_class = "wgs"
space_class_alt = "ku-geo"
sidc = "SFAPMFQ--------"
# physical model: nothing is published (research).
#   radar: an AESA fire-control radar (3D: `height`), fighter class, about 100 km against 1 m^2
#     [E]; revisit at the W2 cap of 5 s [E]; 3 degree beam, 15 m cell, X band [E here].
#   eo_ir: a pod like the MX-15 [E] ([35]: MWIR 26.7 to 0.54 degrees, spotter 1.1 to 0.43, 60
#     deg/s), 640 px MWIR and 1,920 px spotter [E here]; blur floors 20 urad MWIR [E, a 15-20 in
#     turret] and 10 visible [E, a large turret's 5-10] (a vehicle identified at about 10 km in
#     the MWIR).
#   esm: to the radio horizon (about 430 km from 11 km [E]); -80 dBm, the middle of the
#     research's -60 to -90 [E]; 2 degrees, installed ([30]).
sensors = [
  { type = "radar", range_m = 150000, guess = true, height = true, r50_m = 100000, rcs_ref_m2 = 1, scan_s = 5, beam_deg = 3, cell_m = 15, band_ghz = 10 },
  { type = "eo_ir", range_m = 30000, guess = true, slew_dps = 60, channels = [{ band = "mwir", wide_deg = 26.7, narrow_deg = 0.54, px = 640, blur_urad = 20 }, { band = "day", wide_deg = 1.1, narrow_deg = 0.43, px = 1920, blur_urad = 10 }] },
  { type = "esm", range_m = 200000, guess = true, s_min_dbm = -80, bearing_deg = 2 },
]
protocol = "uci"
protocol_note = "A-GRA, UCI and OMS are controlled distribution; stays on the generic intent API"
authenticity = "A-GRA/UCI interface plus a JSBSim jet model"
authenticity_blocker = "A-GRA/UCI not public: unattainable openly"

