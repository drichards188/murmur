[puma]
name = "Puma 3 AE-class"
short = "PUMA"
role = "Small fixed-wing UAS"
domain = "air"
sim = "sitl"
vehicle = "plane"
callsign = "PUMA"
link = "los"
sidc = "SFAPMFQ--------"
# physical model: the Mantis i45 ([37]: EO 15 MP, 56 to 1.2 degrees; blur floor 25 urad [E], the
# research's small-UAS gimbal) with the i45 N's LWIR ([38]: 640 px, 40 to 5.3 degrees); slew
# 90 deg/s [E, 60-120].
sensors = [{ type = "eo_ir", range_m = 4000, guess = true, slew_dps = 90, channels = [{ band = "day", wide_deg = 56, narrow_deg = 1.2, px = 4472, blur_urad = 25 }, { band = "lwir", wide_deg = 40, narrow_deg = 5.3, px = 640, blur_urad = 50 }] }]
protocol = "proprietary"
protocol_note = "AV's ground station and datalink are proprietary; MAVLink in the sim, labelled as such"
authenticity = "ArduPilot SITL tuned to the airframe, plus AV's DDL link profile"
authenticity_blocker = "AV ground station and datalink proprietary"
params = { AIRSPEED_CRUISE = 20 }
behavior = "plane"
cruise_mps = 20
typical_alt_m = 80
endurance_h = 2.5
# Sent home, a Puma lands there, as a real one does (murmur-a5v): RTL_AUTOLAND 1, ArduPlane's
# landing once on the RTL circle at home (crates/murmur-standins/src/behavior/plane.rs: with no
# DO_LAND_START in the mission, the AUTOLAND mode's landing at home). It is hand-launched
# (TKOFF_THR_MINACC, ArduPlane's throw detection): down again, nobody relaunches it, so it
# refuses to arm. Stand-ins only: a SITL ArduPlane needs a DO_LAND_START sequence in its mission
# to land from RTL, which the bridge's missions never carry (it would still circle home), and
# SITL has no one to throw it (TKOFF_THR_MINACC would keep it on the ground for good).
standin_params = { RTL_AUTOLAND = 1, TKOFF_THR_MINACC = 15 }
