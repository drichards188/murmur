# rules 24 (bd murmur-lbw8.1; [n]: docs/research/weapons.md's references): the V5 is a one-way
# weapon by design, the boat and its charge [19,20]: spent by its own effect (as the switchblade
# and the FPV; under rules 12 nothing is owed back to it after its release). Up to 800,000 m [19];
# 22 m/s at most [19]; at the waterline [19]; operator video and GNSS/INS with an EO tracker
# [19,20]; a contact-fuzed charge of up to 300 kg [19] (a 320 kg load [20]); ships, boats, piers.
