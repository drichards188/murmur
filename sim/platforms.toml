# ---------------------------------------------------------------- surface
[magura]
name = "Magura V5-class naval drone"
short = "USV-S"
role = "Small fast attack USV"
armed = true
domain = "surface"
sim = "sitl"
vehicle = "boat"
callsign = "VIPER"
link = "satcom"
space_class = "starlink"
sidc = "SFSP-----------"
# EO only, no radar (research: two EO guidance cameras, no radar published [41]); its AIS
# receiver as before [E].
# physical model: [E] the guidance cameras as one fixed 20 degree camera at 1080p, 1,920 px, looking
# along the heading (a vehicle-size target detected at about 8.4 km, research); by day only.
sensors = [{ type = "eo_ir", range_m = 5000, guess = true, slew_dps = 0, channels = [{ band = "day", wide_deg = 20, px = 1920 }] }, { type = "ais", range_m = 15000, guess = true }]
mast_m = 1.5
protocol = "proprietary"
protocol_note = "Control software is proprietary; MAVLink in the sim, labelled as such"
authenticity = "Planing-hull dynamics (Gazebo/VRX) plus a satellite link model"
authenticity_blocker = "Control software proprietary"
params = { CRUISE_SPEED = 12, WP_SPEED = 12 }
behavior = "boat"
cruise_mps = 12
typical_alt_m = 0
[corsair]
name = "Corsair-class autonomous surface vessel"
short = "USV-M"
role = "Medium USV"
domain = "surface"
sim = "sitl"
vehicle = "boat"
callsign = "MARLIN"
link = "satcom"
space_class = "starlink"
sidc = "SFSP-----------"
# Passive sensing only: a 360 degree EO/IR ring and ESM, no radar (research [42], secondary); its
# AIS receiver as before [E].
# physical model:
#   eo_ir: a fixed ring of M364C-class thermal cameras ([13]: 640 px at 18 degrees; a 30 ft boat
#     detected at about 7.9 km, a person at 0.97), each with a 1,920 px visible camera beside it
#     at the same field [E here, the M364C's own pairing of a thermal and an HD visible camera].
#   esm: range_m the radio horizon from its 4 m mast to a ship's radar 25 m up, 4.12 (sqrt 4 +
#     sqrt 25) = 29 km [E]; -80 dBm, the middle of the research's -60 to -90 [E]; 2 degrees,
#     installed ([30]).
sensors = [
  { type = "eo_ir", range_m = 8000, guess = true, channels = [{ band = "lwir", wide_deg = 18, px = 640, panoramic = true }, { band = "day", wide_deg = 18, px = 1920, panoramic = true }] },
  { type = "ais", range_m = 30000, guess = true },
  { type = "esm", range_m = 30000, guess = true, s_min_dbm = -80, bearing_deg = 2 },
]
mast_m = 4
protocol = "proprietary"
protocol_note = "Proprietary unless Navy-procured, in which case UMAA; MAVLink in the sim, labelled as such"
authenticity = "UMAA over DDS plus VRX hydrodynamics"
authenticity_blocker = "Proprietary unless Navy UMAA"
params = { CRUISE_SPEED = 8, WP_SPEED = 8 }
behavior = "boat"
cruise_mps = 8
typical_alt_m = 0
[seahunter]
name = "Sea Hunter-class MUSV"
short = "MUSV"
role = "Large medium-displacement USV"
domain = "surface"
sim = "standin"
behavior = "boat"
callsign = "HUNTER"
cruise_mps = 6
max_mps = 13
alt_m = 0
turn_dps = 4
loiter_radius_m = 400
endurance_h = 1000
link = "satcom"
space_class = "starlink"
sidc = "SFSP-----------"
# physical model:
#   radar: a navigation radar calibrated on IMO MSC.192(79) Table 2 ([19]: a 7.5 m^2 small
#     vessel at 5.0 NM with Pd 0.8, 6.72 NM at Pd 0.5) turning at 24 rpm ([18]); 1.2 degree
#     beam, 37 m range cell [E]. Its long-range radar ([43]; research [E] the IMO anchors x1.5-2)
#     is not here: a second entry would change what the legacy model reads for v1 and v2.
#   eo_ir: 360 degree stereo EO/IR ([43]), figures not published: [E here] a fixed ring as the
#     Corsair's, M364C-class thermal (640 px at 18 degrees [13]) beside 1,920 px visible.
#   sonar: the MS3 hull sonar, active and passive ([44]), as an active sonar: a submarine half
#     the time at 7.5 km and a small UUV at 1.5 km (the research's 5-10 and 1-2 km [E], from
#     FAS's figure-of-merit examples [25]), to 20 km (the 95 dB example's 19 km [25]); 10 kHz [E
#     here, a mid-frequency hull sonar]; its preformed beams listen on every bearing at once.
sensors = [
  { type = "radar", range_m = 40000, guess = true, r50_m = 12450, rcs_ref_m2 = 7.5, scan_s = 2.5, beam_deg = 1.2, cell_m = 37, band_ghz = 9.4 },
  { type = "eo_ir", range_m = 15000, guess = true, channels = [{ band = "lwir", wide_deg = 18, px = 640, panoramic = true }, { band = "day", wide_deg = 18, px = 1920, panoramic = true }] },
  { type = "ais", range_m = 50000, guess = true },
  { type = "sonar", range_m = 10000, guess = true, mode = "active", freq_khz = 10, max_m = 20000, ranges = { submarine = 7500, uuv = 1500 } },
]
mast_m = 10
protocol = "umaa"
protocol_note = "Navy programs use UMAA over DDS (public architecture description v1.1)"
authenticity = "UMAA plus a ship maneuvering model (e.g. 3-DOF MMG) plus SATCOM"
authenticity_blocker = "How much of UMAA's data model is public"

