# physical model: the Lynx radar ([34]: maritime to 300 km; r50 scaled from 300 km at 10^4 m^2 [E];
# its revisit at the W2 cap of 5 s, the research's 6-12 rpm [E]; Ku band) and the MX-20 turret
# ([3]: MWIR 640 px at 18.2 to 0.24 degrees, spotter 1080p at 1.07 to 0.2, 57 deg/s; blur floors
# [E] 20 urad MWIR and 7 urad visible). Research references in docs/research/sensors.md.
sensors = [
  { type = "radar", range_m = 100000, guess = true, r50_m = 300000, rcs_ref_m2 = 10000, scan_s = 5, beam_deg = 3, cell_m = 15, band_ghz = 16.7 },
  { type = "eo_ir", range_m = 40000, guess = true, slew_dps = 57, channels = [{ band = "mwir", wide_deg = 18.2, narrow_deg = 0.24, px = 640, blur_urad = 20 }, { band = "day", wide_deg = 1.07, narrow_deg = 0.2, px = 1920, blur_urad = 7 }] },
  { type = "ais", range_m = 150000, guess = true },
]
protocol = "stanag4586"
protocol_note = "GA-ASI's ground control station is STANAG 4586-based"
authenticity = "JSBSim MALE airframe plus 4586 (matches GA-ASI's 4586-based GCS)"
authenticity_blocker = "Proprietary flight software"

[cca]
name = "Collaborative Combat Aircraft (YFQ-42A/44A-class)"
short = "CCA"
role = "Jet combat UAS"
domain = "air"
sim = "standin"
behavior = "plane"
callsign = "FURY"
cruise_mps = 230
max_mps = 260
alt_m = 11000
climb_mps = 40
turn_dps = 8
loiter_radius_m = 6000
endurance_h = 3
# C2 over BLOS SATCOM, as the RQ-4 and MQ-9B (GUESS: CCA datalinks are not public). The
# operator here is a ground station tens of km away from a jet that crosses the LOS class's
# 25 km in two minutes, and that class's range is a small-UAS datalink's (Puma). The control
# path in a fight, an air-to-air tactical link to a crewed lead, has no node in the fleet to
# carry it (docs/DECISIONS.md, murmur-3zj).
link = "satcom"
space_class = "wgs"
space_class_alt = "ku-geo"
sidc = "SFAPMFQ--------"
sensors = [{ type = "radar", range_m = 150000, guess = true, height = true }, { type = "eo_ir", range_m = 30000, guess = true }, { type = "esm", range_m = 200000, guess = true }]   # AESA fire-control radar: 3D
protocol = "uci"
protocol_note = "A-GRA, UCI and OMS are controlled distribution; stays on the generic intent API"
authenticity = "A-GRA/UCI interface plus a JSBSim jet model"
authenticity_blocker = "A-GRA/UCI not public: unattainable openly"

