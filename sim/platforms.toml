behavior = "plane"
callsign = "HAWK"
cruise_mps = 160
max_mps = 175
alt_m = 18000
climb_mps = 15
turn_dps = 2.5
loiter_radius_m = 9000
endurance_h = 32
link = "satcom"
space_class = "wgs"
space_class_alt = "ku-geo"
sidc = "SFAPMFQ--------"
sensors = [{ type = "radar", range_m = 200000, guess = true }, { type = "eo_ir", range_m = 50000, guess = true }, { type = "esm", range_m = 300000, guess = true }]
protocol = "stanag4586"
protocol_note = "Interop path via a STANAG 4586 vehicle-specific module; the real ground segment is the manufacturer's own"
authenticity = "JSBSim HALE airframe, a 4586 interface and SATCOM latency and bandwidth"
authenticity_blocker = "Real ground segment is the manufacturer's own; no official RQ-4 JSBSim model"

