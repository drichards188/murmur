# circle = { lat = 37.8277, lon = -122.4995, radius_m = 5000 }
# loss = 0.5
# gnss = { effect = "jam", power_w = 1.5, height_m = 280 }

# A spoofer over the main shipping channel: a vessel inside 3 km is captured and its reported
# position walks 0.5 m/s north-east, up to 800 m, with every flag still saying good.
