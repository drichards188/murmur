[package]
name = "murmur-bridge"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
murmur-space = { path = "../murmur-space" }
murmur-decide = { path = "../murmur-decide" }
# Operator and agent credentials (rules 7): password hashes, sessions, keys.
murmur-auth = { path = "../murmur-auth" }
mavlink = { version = "0.18", default-features = false, features = ["std", "dialect-ardupilotmega", "mav2-message-extensions"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "1.1.6", features = ["preserve_order"] }
quick-xml = "0.42.0"
socket2 = { version = "0.6.5", features = ["all"] }
# The MCP server for AI agents (Phase F): the official Rust SDK, streamable HTTP at /mcp.
rmcp = { version = "3.5", features = ["transport-streamable-http-server"] }
schemars = "1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread"] }
