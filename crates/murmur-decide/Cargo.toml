[package]
name = "murmur-decide"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Murmur's decision layer: intents, fail-closed rules, risk-tier policy, append-only audit log and deterministic replay"

[dependencies]
# Satellite tasking (collect, cover intents): orbits, access windows, tasking options.
murmur-space = { path = "../murmur-space" }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: logged inputs must parse back to the exact same f64, or replay drifts.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
toml = "1"
# Rules 10 (passkeys): replay verifies each logged WebAuthn assertion (ES256: ECDSA P-256 over
# SHA-256) against the public key the run logged, independently of the bridge's WebAuthn
# library. Verification only, unless the test authenticator below is asked for.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
base64 = "0.22"

[features]
# A software authenticator (`passkey::soft`) for tests: it signs, so a production build leaves
# it out.
soft-authenticator = []

[dev-dependencies]
murmur-decide = { path = ".", features = ["soft-authenticator"] }

[lints]
workspace = true
