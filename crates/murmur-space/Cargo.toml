[package]
name = "murmur-space"
version = "0.1.0"
edition.workspace = true
description = "Space segment core for Murmur: orbits, access windows, link windows, GNSS visibility, tasking options"

[dependencies]
sgp4 = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
ureq = "3"
rayon = "1.12"
thiserror = "2"

[lints]
workspace = true
