[package]
name = "murmur-standins"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
jiff = "0.2"
murmur-space = { path = "../murmur-space" }
mavlink = { version = "0.18", default-features = false, features = ["std", "dialect-ardupilotmega", "mav2-message-extensions"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "signal", "io-util"] }

[lints]
workspace = true
