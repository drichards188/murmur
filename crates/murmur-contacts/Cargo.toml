[package]
name = "murmur-contacts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Scenario contacts that are not ours: simulated truth, published to the bridge on its simulation channel and to an evaluation log"

[dependencies]
# tidewater conditions client (surface craft drift with the real current) and geo helpers
murmur-standins = { path = "../murmur-standins" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "signal"] }
toml = "1"

[lints]
workspace = true
