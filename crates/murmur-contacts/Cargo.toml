[package]
name = "murmur-contacts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Scenario contacts that are not ours: simulated truth, published to the bridge on its simulation channel and to an evaluation log"

[dependencies]
# the contacts process's own API (orders and what the nodes perceive; src/api.rs), as the bridge
# serves its own
axum = "0.8.9"
# the land/water grid a node's steering keeps to (gzip, as the bridge reads it)
flate2 = "1"
murmur-weather = { path = "../murmur-weather" }
# tidewater conditions client (surface craft drift with the real current) and geo helpers
murmur-standins = { path = "../murmur-standins" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the API's token check, as the bridge's (SHA-256 digests compared in constant time)
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "signal", "net", "sync"] }
toml = "1"

[dev-dependencies]
# the API's routes driven without a socket
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
