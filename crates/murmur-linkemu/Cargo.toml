[package]
name = "murmur-linkemu"
version = "0.1.0"
edition.workspace = true
description = "User-space UDP link emulator between Murmur vehicles and the bridge"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "io-util", "sync"] }
mavlink = { version = "0.18", default-features = false, features = ["std", "dialect-ardupilotmega", "mav2-message-extensions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.9"
murmur-space = { path = "../murmur-space" }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[lints]
workspace = true
